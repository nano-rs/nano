# Prometheus for a single-node nano install (NAN-5250), the `monitoring`
# profile of docker-compose.opensource.yml. Every target is a service on the
# install's own Compose network; nothing here is reachable from outside.
#
# Job names are the same on every install shape (single-node, role-split
# Compose, Helm), so the shipped dashboards and alert rules work everywhere.
# A role-split install renders its own copy on the monitoring host
# (deploy/compose/render-inventory.py).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: nano

rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager sends nothing unless self-ingest is on (NANO_SELF_INGEST_TOKEN).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {host: nano, nano_role: monitoring}

  # api, search and jobs: /metrics needs NANO_SERVICE_TOKEN. The Prometheus
  # entrypoint writes it to this tmpfs file.
  - job_name: nano-api
    authorization:
      type: Bearer
      credentials_file: /run/nano-monitoring/service-token
    static_configs:
      - targets: ["nano-api:3000"]
        labels: {host: nano, nano_role: app}

  - job_name: nano-search
    authorization:
      type: Bearer
      credentials_file: /run/nano-monitoring/service-token
    static_configs:
      - targets: ["nano-search:3002"]
        labels: {host: nano, nano_role: app}

  # Needs NANO_JOBS_BIND_ADDR=0.0.0.0 (jobs binds loopback otherwise).
  - job_name: nano-jobs
    authorization:
      type: Bearer
      credentials_file: /run/nano-monitoring/service-token
    static_configs:
      - targets: ["nano-jobs:3003"]
        labels: {host: nano, nano_role: app}

  - job_name: nano-vector
    static_configs:
      - targets: ["vector:9598"]
        labels: {host: nano, nano_role: ingest}

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
        labels: {host: nano, nano_role: clickhouse, shard: "1", replica: "1"}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {host: nano, nano_role: "app,clickhouse,ingest,postgres"}

  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: {host: nano, nano_role: app}
