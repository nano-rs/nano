rule_files:
  - ../rules/nanosiem_alerts.yml
evaluation_interval: 1h
tests:
  - interval: 1h
    input_series:
      - series: 'lake_part_gc_blocked_seconds{cell="c1",tenant="t",reason="sanctioned_path_unavailable",detail="lake_part_gc_not_delivered_or_unreadable"}'
        values: '0 3600 7200 0'
      - series: 'lake_part_gc_blocked_seconds{cell="c2",tenant="t",reason="sanctioned_path_unavailable",detail="lake_part_gc_not_delivered_or_unreadable"}'
        values: '0 3600 7200 0'
    alert_rule_test:
      - eval_time: 1h
        alertname: LakePartGcBlocked
        exp_alerts: []
      - eval_time: 2h
        alertname: LakePartGcBlocked
        exp_alerts:
          - exp_labels:
              tenant: t
              reason: sanctioned_path_unavailable
              detail: lake_part_gc_not_delivered_or_unreadable
              severity: warning
            exp_annotations:
              summary: "Lake part GC blocked for tenant t"
              description: "Superseded parts have been kept for at least two hours: sanctioned_path_unavailable (lake_part_gc_not_delivered_or_unreadable). Check the credential exchange lake_part_gc route and delete grant."
      - eval_time: 3h
        alertname: LakePartGcBlocked
        exp_alerts: []
  - interval: 1h
    input_series:
      - series: 'lake_part_gc_capacity_pressure{cell="c1",tenant="t",reason="history_capacity",detail="resident_memory"}'
        values: '1 1 1 0'
    alert_rule_test:
      - eval_time: 0h
        alertname: LakePartGcHistoryCapacity
        exp_alerts:
          - exp_labels:
              tenant: t
              detail: resident_memory
              severity: warning
            exp_annotations:
              summary: "Lake GC history capacity pressure for tenant t"
              description: "GC resident memory is at least 75% of its bound or the history volume has at most 25% free (resident_memory). The signal stays latched through retries and index-only progress; increase capacity before GC stalls."
      - eval_time: 3h
        alertname: LakePartGcHistoryCapacity
        exp_alerts: []
