# Prometheus configuration for NanoSIEM monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nanosiem'

# Alertmanager configuration (optional - uncomment to enable)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # NanoSIEM API metrics
  - job_name: 'nanosiem-api'
    static_configs:
      - targets: ['nanosiem-api:3000']
    metrics_path: /metrics
    scrape_interval: 10s

  # NanoSIEM Search Service metrics
  - job_name: 'nanosiem-search'
    static_configs:
      - targets: ['nanosiem-search:3002']
    metrics_path: /metrics
    scrape_interval: 10s

  # Vector metrics (already exposed on 9598)
  - job_name: 'vector'
    static_configs:
      - targets: ['vector:9598']
    metrics_path: /metrics

  # PostgreSQL metrics via postgres_exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ClickHouse native Prometheus metrics (dedicated endpoint on port 9363)
  # Configured in clickhouse/config.d/monitoring.xml
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
    metrics_path: /metrics
    scrape_interval: 15s
    # ClickHouse exposes many metrics, increase timeout
    scrape_timeout: 10s

  # Host metrics via node_exporter
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s
