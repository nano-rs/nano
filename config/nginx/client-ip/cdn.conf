# NAN-5015: opt-in for an install that really sits behind a CDN (Cloudflare,
# Akamai). Forward the CDN's client-IP headers to the apps; they believe them
# only from this nginx (TRUSTED_PROXY_CIDRS) and only when
# TRUSTED_CLIENT_IP_HEADERS names them, e.g.
#   NANO_EDGE_CDN_CLIENT_IP=cdn
#   TRUSTED_CLIENT_IP_HEADERS=cf-connecting-ip,x-forwarded-for
# Only enable this when the CDN is the ONLY way in: anyone who can reach this
# nginx directly can set these headers to any address.
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header True-Client-IP $http_true_client_ip;
