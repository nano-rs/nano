worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # NAN-5217: ingestion pause admission. Each ingest request asks nano-api
    # whether ingestion is paused; the answer is cached here for 2 s (one
    # lookup per 2 s per edge, not per request).
    proxy_cache_path /tmp/nano_ingest_admission levels=1 keys_zone=nano_ingest_admission:1m max_size=1m inactive=10m use_temp_path=off;

    # NAN-5004: reject admission at the HTTP boundary. A Vector throttle drops
    # events after decoding and its source acknowledgement reports that as
    # Delivered; nginx can return an unambiguous, retryable 429 instead.
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=1000r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Push-enrichment has a dedicated acknowledged source and disk spool. Do
    # not let the legacy log endpoint accept it into the shared log graph,
    # where a bound nano_enrich credential could otherwise select an
    # unconsumed route and still receive 2xx from Vector's Dropped fold.
    map $http_x_source_type $nano_enrichment_on_log_endpoint {
        default 0;
        ~*^nano_enrich$ 1;
    }

    server {
        listen 80 default_server;

        # Resolve upstream container names via Docker's embedded DNS on every
        # request instead of caching the IP at startup. Without this, recreating
        # nano-api / nano-search (e.g. `docker compose pull && up -d`, or an
        # install.sh upgrade) gives them new IPs while nginx keeps proxying the
        # old ones -> 502 until nginx is manually restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Using variables in proxy_pass forces per-request re-resolution.
        set $nano_api    http://nano-api:3000;
        set $nano_search http://nano-search:3002;
        set $nano_web    http://nano-web:5173;
        set $nano_vector http://vector:8080;
        set $nano_enrichment http://vector:8090;
        set $nano_otlp   http://vector:4318;

        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # NAN-5015: CDN client-IP headers are client-controlled unless a CDN
        # really fronts this edge, so the edge strips them. A CDN-fronted install
        # opts in with NANO_EDGE_CDN_CLIENT_IP=cdn, which mounts
        # config/nginx/client-ip/cdn.conf here (a later proxy_set_header for the
        # same header wins over the empty value). No file matched = stripped.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        include /etc/nginx/nano-client-ip.d/*.conf;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Search-service overrides handled by nano-api (order matters — before /api/search).
        location = /api/search/history     { proxy_pass $nano_api; }
        location = /api/search/share       { proxy_pass $nano_api; }
        location = /api/search/shared       { proxy_pass $nano_api; }
        location = /api/search/explanation { proxy_pass $nano_api; }

        # Search service
        location /api/search {
            proxy_pass $nano_search;
            proxy_read_timeout 300s;
        }

        # API health alias -> nano-api /health
        location = /api/health {
            proxy_pass $nano_api/health;
        }

        # NAN-5131: deploy/publish render the Vector config synchronously (90 s+
        # measured on a 6-core host); give them the 300 s search budget, not 120 s.
        location ~ ^/api/((log-sources|source-configurations)/(deploy-all|[^/]+/(deploy|undeploy|publish))|custom-enrichments/[^/]+/deploy)$ {
            proxy_pass $nano_api;
            proxy_read_timeout 300s;
        }

        # All other API routes
        location /api/ {
            proxy_pass $nano_api;
            proxy_read_timeout 120s;
        }

        # Swagger / OpenAPI docs
        location /swagger-ui/ { proxy_pass $nano_api; }
        location /api-docs/   { proxy_pass $nano_api; }

        # Log ingestion (HTTP) — strip the /ingest/ prefix
        location /ingest/ {
            auth_request /_nano_ingest_admission;
            error_page 403 = @nano_ingest_paused;
            if ($nano_enrichment_on_log_endpoint) { return 409 "nano_enrich requires /enrichment\n"; }
            limit_req zone=ingest_limit burst=500 nodelay;
            rewrite ^/ingest/(.*)$ /$1 break;
            proxy_pass $nano_vector;
            client_max_body_size 100m;
        }

        # Bare /ingest (no trailing slash) — exact match so a POST here reaches
        # Vector instead of falling through to the SPA below and 301-ing to
        # /ingest/ (which drops the POST body for clients that don't re-POST on
        # redirect). install.sh advertises /ingest verbatim (NAN-1332).
        location = /ingest {
            auth_request /_nano_ingest_admission;
            error_page 403 = @nano_ingest_paused;
            if ($nano_enrichment_on_log_endpoint) { return 409 "nano_enrich requires /enrichment\n"; }
            limit_req zone=ingest_limit burst=500 nodelay;
            rewrite ^/ingest$ / break;
            proxy_pass $nano_vector;
            client_max_body_size 100m;
        }

        # Dedicated push-enrichment source: durable handoff without sharing the
        # ordinary log source's backpressure domain.
        location = /enrichment {
            auth_request /_nano_ingest_admission;
            error_page 403 = @nano_ingest_paused;
            limit_req zone=ingest_limit burst=500 nodelay;
            rewrite ^/enrichment$ / break;
            proxy_pass $nano_enrichment;
            client_max_body_size 100m;
        }

        # NAN-5217: ingestion pause. 204 admits; 423 (an answer no older API gives
        # this path) = paused, answered as 503 + Retry-After so senders keep the
        # data and retry (nothing enters Vector, so a resumed sender delivers each
        # event once). Every other answer admits: an older API during a rolling
        # upgrade or rollback (404), an IP allowlist (403), an outage (5xx or no
        # connection, after any cached answer). The ClickHouse guard on the ingest
        # users still enforces a pause; ingestion must not depend on the API.
        location = /_nano_ingest_admission {
            internal;
            proxy_pass $nano_api/api/internal/ingest-admission;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "";
            proxy_cache nano_ingest_admission;
            proxy_cache_key nano_ingest_admission;
            proxy_cache_valid any 2s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 423 = @nano_ingest_paused_answer;
            error_page 400 401 403 404 405 408 429 500 502 503 504 = @nano_ingest_admit;
        }
        # The admit fallback also catches the 404 `internal` gives a direct request
        # for /_nano_ingest_admission; keep that a 404 (only subrequests admit).
        location @nano_ingest_admit {
            if ($request_uri ~ "^/_nano_ingest_admission") { return 404; }
            return 204;
        }
        location @nano_ingest_paused_answer { return 403; }
        location @nano_ingest_paused {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"text":"Ingestion is paused","code":9}\n';
        }

        # NAN-4907 (port of main NAN-3933): OTLP/HTTP with a source-bound
        # ingest token. Point SDKs/collectors at <base>/otlp with
        # `Authorization: Bearer <token>`. Every request is authenticated
        # against current credential state (no positive cache); nano-api
        # answers with the verified identity, which replaces any identity
        # header the sender sent, so OTLP logs land in the token's source.
        # The credential check is for the edge's subrequest only: direct
        # clients never reach it (the subrequest proxies straight to nano-api
        # and does not pass through this location).
        # /api/internal/* is in-stack infrastructure (Vector config delivery,
        # the OTLP edge's auth subrequest). It is never served at the edge;
        # the OTLP subrequest below proxies to nano-api directly instead.
        location = /api/internal { return 404; }
        location ^~ /api/internal/ { return 404; }

        # NAN-5269: auth_request turns any otlp-auth answer other than 2xx/401/403
        # (nano-api restarting or unready during a PostgreSQL failover: 502/503/504,
        # refused, timeout) into a 500. OTLP/HTTP senders drop a 500 but retry a
        # 503 (OTLP spec: 429/502/503/504 are retryable), so answer that instead.
        location @nano_otlp_auth_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":"auth_unavailable","message":"The OTLP credential check could not reach nano-api (restarting, or a PostgreSQL failover). Retry: nothing was accepted."}\n';
        }
        location = /_nano_otlp_auth {
            internal;
            proxy_pass $nano_api/api/internal/otlp-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/otlp(/v1/(logs|traces|metrics))$ {
            set $otlp_path $1;
            # nano's OTLP/HTTP receiver (Vector) decodes protobuf only. Answer anything else
            # with a clear 415 here instead of the receiver's opaque 500. This `if` must come
            # after `set $otlp_path $1`: its own regex resets $1.
            default_type application/json;
            if ($content_type !~* "^application/x-protobuf$") {
                return 415 '{"error":"unsupported_media_type","message":"OTLP/HTTP accepts protobuf only: send Content-Type: application/x-protobuf. OTLP/JSON is not supported; set your exporter to the http/protobuf protocol."}\n';
            }
            auth_request /_nano_otlp_auth;
            # NAN-5217: otlp-auth answers 403 for a valid credential while paused.
            error_page 403 = @nano_ingest_paused;
            # NAN-5269: auth backend unavailable -> retryable 503 (see @nano_otlp_auth_unavailable).
            error_page 500 = @nano_otlp_auth_unavailable;
            auth_request_set $otlp_credential_id $upstream_http_x_nano_credential_id;
            auth_request_set $otlp_source_route $upstream_http_x_nano_source_route;
            auth_request_set $otlp_identity_assertion $upstream_http_x_nano_identity_assertion;
            rewrite ^ $otlp_path break;
            proxy_set_header Authorization "";
            proxy_set_header X-Nano-Credential-Id $otlp_credential_id;
            proxy_set_header X-Nano-Source-Route $otlp_source_route;
            proxy_set_header X-Nano-Identity-Assertion $otlp_identity_assertion;
            proxy_pass $nano_otlp;
            client_max_body_size 100m;
        }

        # Frontend SPA (everything else)
        location / {
            proxy_pass $nano_web;
        }
    }
}
