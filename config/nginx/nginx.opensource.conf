worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nano_api {
        server nano-api:3000;
        keepalive 16;
    }

    upstream nano_search {
        server nano-search:3002;
        keepalive 16;
    }

    upstream nano_web {
        server nano-web:5173;
        keepalive 16;
    }

    upstream vector_ingest {
        server vector:8080;
        keepalive 16;
    }

    server {
        listen 80 default_server;

        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Search service overrides: history / share / shared / explanation are
        # handled by nano-api, not nano-search. Order matters — these must
        # match before the broader /api/search prefix.
        location = /api/search/history { proxy_pass http://nano_api; }
        location = /api/search/share   { proxy_pass http://nano_api; }
        location = /api/search/shared  { proxy_pass http://nano_api; }
        location = /api/search/explanation { proxy_pass http://nano_api; }

        # Search service
        location /api/search {
            proxy_pass http://nano_search;
            proxy_read_timeout 300s;
        }

        # API health alias
        location = /api/health {
            proxy_pass http://nano_api/health;
        }

        # All other API routes
        location /api/ {
            proxy_pass http://nano_api;
            proxy_read_timeout 120s;
        }

        # Swagger / OpenAPI docs
        location /swagger-ui/ { proxy_pass http://nano_api; }
        location /api-docs/   { proxy_pass http://nano_api; }

        # Log ingestion (HTTP) — strips /ingest prefix
        location /ingest/ {
            proxy_pass http://vector_ingest/;
            client_max_body_size 100m;
        }

        # Frontend SPA (everything else)
        location / {
            proxy_pass http://nano_web;
        }
    }
}
