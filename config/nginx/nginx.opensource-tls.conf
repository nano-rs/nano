worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# TLS-enabled variant of nginx.opensource.conf. Identical routing, but served
# over HTTPS on :443 with a plain-HTTP :80 server that redirects to it.
#
# Bring your own certificate: drop a cert chain + private key at
#   config/nginx/ssl/fullchain.pem
#   config/nginx/ssl/privkey.pem
# (obtained however you like — Let's Encrypt/certbot, your CA, or self-signed
# via config/nginx/generate-ssl.sh) and enable this conf with the TLS override:
#   docker compose -f docker-compose.opensource.yml -f docker-compose.tls.yml up -d
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # NAN-5004: explicit request admission; overload is 429, never a silently
    # acknowledged in-Vector event drop.
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=1000r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nano_api {
        server nano-api:3000;
        keepalive 16;
    }

    upstream nano_search {
        server nano-search:3002;
        keepalive 16;
    }

    upstream nano_web {
        server nano-web:5173;
        keepalive 16;
    }

    upstream vector_ingest {
        server vector:8080;
        keepalive 16;
    }

    upstream vector_otlp {
        server vector:4318;
        keepalive 16;
    }

    # Plain HTTP — redirect everything to HTTPS.
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    # HTTPS — same routing as nginx.opensource.conf.
    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000" always;

        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # NAN-5015: CDN client-IP headers are client-controlled unless a CDN
        # really fronts this edge, so the edge strips them. A CDN-fronted install
        # opts in with NANO_EDGE_CDN_CLIENT_IP=cdn, which mounts
        # config/nginx/client-ip/cdn.conf here (a later proxy_set_header for the
        # same header wins over the empty value). No file matched = stripped.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        include /etc/nginx/nano-client-ip.d/*.conf;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Search service overrides: history / share / shared / explanation are
        # handled by nano-api, not nano-search. Order matters — these must
        # match before the broader /api/search prefix.
        location = /api/search/history { proxy_pass http://nano_api; }
        location = /api/search/share   { proxy_pass http://nano_api; }
        location = /api/search/shared  { proxy_pass http://nano_api; }
        location = /api/search/explanation { proxy_pass http://nano_api; }

        # Search service
        location /api/search {
            proxy_pass http://nano_search;
            proxy_read_timeout 300s;
        }

        # API health alias
        location = /api/health {
            proxy_pass http://nano_api/health;
        }

        # NAN-5131: deploy/publish render the Vector config synchronously (90 s+
        # measured on a 6-core host); give them the 300 s search budget, not 120 s.
        location ~ ^/api/((log-sources|source-configurations)/(deploy-all|[^/]+/(deploy|undeploy|publish))|custom-enrichments/[^/]+/deploy)$ {
            proxy_pass http://nano_api;
            proxy_read_timeout 300s;
        }

        # All other API routes
        location /api/ {
            proxy_pass http://nano_api;
            proxy_read_timeout 120s;
        }

        # Swagger / OpenAPI docs
        location /swagger-ui/ { proxy_pass http://nano_api; }
        location /api-docs/   { proxy_pass http://nano_api; }

        # Log ingestion (HTTP) — strips /ingest prefix
        location /ingest/ {
            limit_req zone=ingest_limit burst=500 nodelay;
            proxy_pass http://vector_ingest/;
            client_max_body_size 100m;
        }

        # Bare /ingest (no trailing slash) — exact match so a POST here reaches
        # Vector instead of falling through to the SPA below and 301-ing to
        # /ingest/ (which drops the POST body for clients that don't re-POST on
        # redirect). install.sh advertises /ingest verbatim (NAN-1332).
        location = /ingest {
            limit_req zone=ingest_limit burst=500 nodelay;
            proxy_pass http://vector_ingest/;
            client_max_body_size 100m;
        }

        # NAN-4907 (port of main NAN-3933): authenticated OTLP/HTTP edge. See
        # nginx.opensource.conf for the contract.
        # /api/internal/* is in-stack infrastructure (Vector config delivery,
        # the OTLP edge's auth subrequest). It is never served at the edge;
        # the OTLP subrequest below proxies to nano-api directly instead.
        location = /api/internal { return 404; }
        location ^~ /api/internal/ { return 404; }

        location = /_nano_otlp_auth {
            internal;
            proxy_pass http://nano_api/api/internal/otlp-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/otlp(/v1/(logs|traces|metrics))$ {
            set $otlp_path $1;
            auth_request /_nano_otlp_auth;
            auth_request_set $otlp_credential_id $upstream_http_x_nano_credential_id;
            auth_request_set $otlp_source_route $upstream_http_x_nano_source_route;
            auth_request_set $otlp_identity_assertion $upstream_http_x_nano_identity_assertion;
            rewrite ^ $otlp_path break;
            proxy_set_header Authorization "";
            proxy_set_header X-Nano-Credential-Id $otlp_credential_id;
            proxy_set_header X-Nano-Source-Route $otlp_source_route;
            proxy_set_header X-Nano-Identity-Assertion $otlp_identity_assertion;
            proxy_pass http://vector_otlp;
            client_max_body_size 100m;
        }

        # Frontend SPA (everything else)
        location / {
            proxy_pass http://nano_web;
        }
    }
}
