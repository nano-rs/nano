worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# TLS-enabled variant of nginx.opensource.conf. Identical routing, but served
# over HTTPS on :443 with a plain-HTTP :80 server that redirects to it.
#
# Bring your own certificate: drop a cert chain + private key at
#   config/nginx/ssl/fullchain.pem
#   config/nginx/ssl/privkey.pem
# (obtained however you like — Let's Encrypt/certbot, your CA, or self-signed
# via config/nginx/generate-ssl.sh) and enable this conf with the TLS override:
#   docker compose -f docker-compose.opensource.yml -f docker-compose.tls.yml up -d
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nano_api {
        server nano-api:3000;
        keepalive 16;
    }

    upstream nano_search {
        server nano-search:3002;
        keepalive 16;
    }

    upstream nano_web {
        server nano-web:5173;
        keepalive 16;
    }

    upstream vector_ingest {
        server vector:8080;
        keepalive 16;
    }

    # Plain HTTP — redirect everything to HTTPS.
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    # HTTPS — same routing as nginx.opensource.conf.
    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000" always;

        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Search service overrides: history / share / shared / explanation are
        # handled by nano-api, not nano-search. Order matters — these must
        # match before the broader /api/search prefix.
        location = /api/search/history { proxy_pass http://nano_api; }
        location = /api/search/share   { proxy_pass http://nano_api; }
        location = /api/search/shared  { proxy_pass http://nano_api; }
        location = /api/search/explanation { proxy_pass http://nano_api; }

        # Search service
        location /api/search {
            proxy_pass http://nano_search;
            proxy_read_timeout 300s;
        }

        # API health alias
        location = /api/health {
            proxy_pass http://nano_api/health;
        }

        # All other API routes
        location /api/ {
            proxy_pass http://nano_api;
            proxy_read_timeout 120s;
        }

        # Swagger / OpenAPI docs
        location /swagger-ui/ { proxy_pass http://nano_api; }
        location /api-docs/   { proxy_pass http://nano_api; }

        # Log ingestion (HTTP) — strips /ingest prefix
        location /ingest/ {
            proxy_pass http://vector_ingest/;
            client_max_body_size 100m;
        }

        # Bare /ingest (no trailing slash) — exact match so a POST here reaches
        # Vector instead of falling through to the SPA below and 301-ing to
        # /ingest/ (which drops the POST body for clients that don't re-POST on
        # redirect). install.sh advertises /ingest verbatim (NAN-1332).
        location = /ingest {
            proxy_pass http://vector_ingest/;
            client_max_body_size 100m;
        }

        # Frontend SPA (everything else)
        location / {
            proxy_pass http://nano_web;
        }
    }
}
