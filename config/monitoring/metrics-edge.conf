# NAN-5408: metrics edge for "your own Prometheus" on a single-node install
# (docker-compose.metrics-expose.yml, turned on by NANO_METRICS_BIND_ADDRESS).
#
# One port per scrape target, the same numbers the services use inside the
# install. Each port answers GET /metrics and nothing else, so publishing it
# never exposes the rest of the API, search or ClickHouse. api, search and
# jobs still check the bearer token (NANO_SERVICE_TOKEN): the Authorization
# header is passed through unchanged.
#
# Upstreams resolve through Docker's DNS on every request (resolver + a
# variable), so the edge starts even while a service is restarting.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;

    # nano-api
    server {
        listen 3000;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream nano-api:3000;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
    # nano-search
    server {
        listen 3002;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream nano-search:3002;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
    # nano-jobs (needs NANO_JOBS_BIND_ADDR=0.0.0.0; install.sh sets it)
    server {
        listen 3003;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream nano-jobs:3003;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
    # Vector's Prometheus exporter
    server {
        listen 9598;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream vector:9598;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
    # ClickHouse's Prometheus endpoint
    server {
        listen 9363;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream clickhouse:9363;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
    # node-exporter
    server {
        listen 9100;
        location = /metrics {
            limit_except GET { deny all; }
            set $upstream node-exporter:9100;
            proxy_pass http://$upstream/metrics;
        }
        location / { return 404; }
    }
}
