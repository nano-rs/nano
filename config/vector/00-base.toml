# NanoSIEM Vector Base Configuration
# This file contains the core pipeline: sources, auth, rate limiting, and sinks.
# Parser routing is handled by dynamically generated configs in sources/parsers/
#
# File loading order (alphabetical):
#   00-base.toml        - This file (sources, auth, rate limiting, sinks)
#   sources/parsers/    - Dynamically generated parser configs
#   transforms/         - Additional transforms (dynamic_router.toml)
#
# TLS: Handled by load balancer (Hetzner LB terminates HTTPS, forwards HTTP to Vector)

data_dir = "/var/lib/vector"

# =============================================================================
# Vector API (for config reload)
# =============================================================================
# NB: no `playground` key — vector removed `api.playground` in 0.55 (would fail
# config validation → crashloop). The GraphQL API stays on for config reload /
# `vector top`/`vector tap`; the browser playground IDE was a debug-only extra
# and its port (8686) isn't even published in docker-compose.opensource.yml.
[api]
enabled = true
address = "0.0.0.0:8686"

# =============================================================================
# Single HTTP Source - All formats on one port
# Supports both single events and NDJSON batches
# =============================================================================
[sources.http_ingest]
type = "http_server"
address = "0.0.0.0:8080"
strict_path = false
path = "/"
# Credentials are read by source authentication, never copied into events.
# Forwarding headers are needed by rate_limit_prep.
headers = ["X-Source-Type", "Content-Type", "X-Forwarded-For", "X-Real-IP"]
max_body_size = 52428800  # 50MB to match batch size (was 10MB)

# Keep-alive for better connection reuse from log shippers
keepalive.max_connection_age_secs = 300  # 5 minutes

# NAN-3770: named, revocable per-sender ingest tokens (Ingestion -> Credentials).
# nano-api writes SHA-256 hashes of the active tokens to this file (0600, on
# the shared nano-vector-dynamic volume); the nano-rs/vector fork re-reads it
# at most every `reload_interval_secs`, so a revoke is refused within seconds
# with no reload and no listener restart. A listed `Bearer <token>` is
# authenticated by the source and stamps `%nano_credential_id` /
# `%nano_credential_name`.
#
# NAN-3806: a token decides the source, 100% token based. Every listed token
# is bound to one log source and its `name` in the file is that source's route
# key, stamped as `%nano_credential_name`; `source_type_extract` routes on it
# and ignores any X-Source-Type / body `source_type` the sender declares. An
# unbound token (and the install token until an admin binds it) is not listed
# and is refused with 401. nano-api writes `fallback_enabled = false` whenever
# VECTOR_AUTH_TOKEN is set, so nothing falls through to the `auth` below; it
# is reached only with no install token at all (the explicit
# VECTOR_ALLOW_UNAUTHENTICATED_INGEST opt-in). A missing file = no tokens.
# Requires ghcr.io/nano-rs/vector >= 0.59.0-nano.7.
[sources.http_ingest.valid_tokens_file]
path = "/etc/vector/dynamic/ingest-tokens/tokens.json"
reload_interval_secs = 2

# NAN-3379: authenticate at the source so a bad or missing token gets HTTP 401.
# The `auth_check` remap below runs after the source has already answered 200,
# and VRL cannot change the response, so a sender with a typo'd or rotated
# token used to see success forever while every event was dropped.
# NAN-3806: this static fallback never accepts a token. With VECTOR_AUTH_TOKEN
# set, every accepted token (the install token included, once bound) is in
# `valid_tokens_file` above, so an unlisted one is refused here too even if
# the file is missing. A blank install token refuses everything unless
# VECTOR_ALLOW_UNAUTHENTICATED_INGEST is explicitly "true" (NAN-1351).
[sources.http_ingest.auth]
strategy = "custom"
source = '''
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
allow_unauthenticated = (get_env_var("VECTOR_ALLOW_UNAUTHENTICATED_INGEST") ?? "") == "true"
expected_token == "" && allow_unauthenticated
'''

# A successful HTTP response is a delivery receipt. The lake sink enables
# acknowledgements and confirms only after the Bronze object PUT completes.
# Push enrichment has its own listener below, so it cannot stall log delivery.
[sources.http_ingest.acknowledgements]
enabled = true

# Split incoming body by newlines - each line becomes a separate event
# This enables NDJSON batch ingestion from log shippers (Cribl, Fluentd, etc.)
[sources.http_ingest.framing]
method = "newline_delimited"

# Decode each line as raw bytes (transforms handle JSON parsing)
[sources.http_ingest.decoding]
codec = "bytes"

# Dedicated push-enrichment ingress. Identity/IP-context synchronization must
# be allowed to use a durable blocking sink without ever backpressuring the log
# front door. It shares the install token but has an independent Vector source
# and topology branch.
[sources.enrichment_ingest]
type = "http_server"
address = "0.0.0.0:8090"
strict_path = false
path = "/"
headers = ["X-Source-Type", "Content-Type"]
max_body_size = 52428800

# NAN-3379: authenticate at the source so a bad or missing token gets HTTP 401.
# The `enrichment_prepare` remap below runs after the source has already answered 200,
# and VRL cannot change the response, so a sender with a typo'd or rotated
# token used to see success forever while every event was dropped. Same rules
# as the log ingress: `Bearer <VECTOR_AUTH_TOKEN>`, and
# a blank token refuses everything unless VECTOR_ALLOW_UNAUTHENTICATED_INGEST
# is explicitly "true" (NAN-1351). Header names are lowercase here.
# `enrichment_prepare` still refuses a blank token outright, so the
# unauthenticated opt-in never reaches the enrichment lane.
[sources.enrichment_ingest.auth]
strategy = "custom"
source = '''
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
allow_unauthenticated = (get_env_var("VECTOR_ALLOW_UNAUTHENTICATED_INGEST") ?? "") == "true"
auth_header = to_string(.headers.authorization) ?? ""
if expected_token == "" {
    allow_unauthenticated
} else {
    auth_header == "Bearer " + expected_token
}
'''

[sources.enrichment_ingest.framing]
method = "newline_delimited"

# NAN-3767: end-to-end acknowledgements. A sender (the connector runner's
# directory sync, provider sync) gets its 200 only once every record was
# delivered: the lake identity sink keeps a memory buffer, so that is the
# coordinator's answer. A refused record answers the sender with an error
# instead of a silent drop.
[sources.enrichment_ingest.acknowledgements]
enabled = true

[sources.enrichment_ingest.decoding]
codec = "bytes"

[transforms.enrichment_prepare]
type = "remap"
inputs = ["enrichment_ingest"]
drop_on_abort = true
drop_on_error = true
reroute_dropped = true
source = '''
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
# The source authenticates the request before decoding. Do not copy its token
# into the event for a second comparison. A blank token remains forbidden here.
if expected_token == "" {
    log("Auth failed on dedicated enrichment ingress", level: "warn")
    abort
}
source_type = downcase(to_string(."X-Source-Type") ?? to_string(."x-source-type") ?? "")
if source_type != "nano_enrich" {
    log("Dedicated enrichment ingress requires X-Source-Type: nano_enrich", level: "warn")
    abort
}
raw = to_string(.message) ?? ""
parsed = parse_json!(raw)
if !is_object(parsed) {
    abort
}
. = parsed
.source_type = "nano_enrich"
'''

[sinks.enrichment_ingest_dead_letter]
type = "blackhole"
inputs = ["enrichment_prepare.dropped"]
print_interval_secs = 0

# =============================================================================
# Authentication Transform
# =============================================================================
[transforms.auth_check]
type = "remap"
inputs = ["http_ingest"]
source = '''
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
allow_unauthenticated = (get_env_var("VECTOR_ALLOW_UNAUTHENTICATED_INGEST") ?? "") == "true"
# NAN-3770: the source already matched a named ingest token from
# `valid_tokens_file` and stamped its credential id (event metadata cannot be
# set by a sender).
credential_id = to_string(%nano_credential_id) ?? ""

if credential_id != "" {
    .auth_status = "authenticated"
} else if expected_token == "" {
    # NAN-1351 (F1): fail closed when no ingest token is configured. Previously
    # a blank VECTOR_AUTH_TOKEN silently accepted every event, allowing
    # unauthenticated log injection + nano_enrich enrichment-lane poisoning by
    # anyone able to reach :8080. Operators on a trusted network (or air-gapped)
    # can opt back in with VECTOR_ALLOW_UNAUTHENTICATED_INGEST=true.
    if allow_unauthenticated {
        .auth_status = "unauthenticated"
    } else {
        log("Auth failed: VECTOR_AUTH_TOKEN is not set. Refusing unauthenticated ingest. Set VECTOR_AUTH_TOKEN, or set VECTOR_ALLOW_UNAUTHENTICATED_INGEST=true to explicitly allow it.", level: "error")
        abort
    }
} else {
    # NAN-3806: with an install token configured, every accepted token is a
    # listed, source-bound credential. An event without the stamp got in some
    # other way: refuse it rather than route it by what it declares.
    log("Auth refused: the token is not bound to a source. Bind it in Ingestion -> Credentials.", level: "warn")
    abort
}

# Extract source_type from header, defaulting to "unknown"
# With framing, headers might exist but be empty - treat empty as unknown
source_type = "unknown"
if exists(."X-Source-Type") {
    st = to_string(."X-Source-Type") ?? ""
    if st != "" {
        source_type = st
    }
}
.source_type = source_type
.request_path = to_string(.path) ?? "/"

del(.Authorization)
del(.authorization)
'''

# =============================================================================
# Rate Limiting
# =============================================================================
[transforms.rate_limit_prep]
type = "remap"
inputs = ["auth_check"]
source = '''
client_ip = null
xff = to_string(."X-Forwarded-For") ?? ""
if xff != "" {
    parts = split(xff, ",")
    if length(parts) > 0 {
        client_ip = strip_whitespace(parts[0]) ?? null
    }
}
if client_ip == null {
    client_ip = to_string(."X-Real-IP") ?? null
}
if client_ip == null {
    client_ip = "unknown"
}
.client_ip = client_ip
'''

[transforms.rate_limit]
type = "throttle"
inputs = ["rate_limit_route.identified"]
threshold = ${VECTOR_RATE_LIMIT_PER_CLIENT_EPS:-500000}
window_secs = 1
key_field = "client_ip"

[transforms.rate_limit_route]
type = "route"
inputs = ["rate_limit_prep"]
reroute_unmatched = false
route.identified = '.client_ip != "unknown"'
route.unidentified = '.client_ip == "unknown"'

# Preserve a separate, configurable aggregate fence for legacy or
# unidentified senders. This avoids both the retired 5k-EPS shared choke point
# and an unbounded bypass when forwarding identity is unavailable.
[transforms.rate_limit_unidentified]
type = "throttle"
inputs = ["rate_limit_route.unidentified"]
threshold = ${VECTOR_RATE_LIMIT_UNIDENTIFIED_EPS:-500000}
window_secs = 1

# =============================================================================
# Content-Type Detection & Parsing
# =============================================================================
[transforms.parse_content]
type = "remap"
inputs = ["rate_limit", "rate_limit_unidentified"]
source = '''
content_type = to_string(."Content-Type") ?? to_string(."content-type") ?? ""
content_type = downcase(content_type)

raw = to_string(.message) ?? ""
.metadata = {}
.metadata.forwarded_via = "http"
.content_format = "unknown"

# Normalize empty source_type to "unknown" for consistent extraction logic
current_source_type = to_string(.source_type) ?? ""
if current_source_type == "" {
    .source_type = "unknown"
}

if contains(content_type, "application/json") {
    .content_format = "json"
    parsed, err = parse_json(raw)
    if err == null {
        # Merge parsed JSON fields to top-level (parsers can access .referrer directly)
        # Skip 'message' which we handle specially below
        parsed_keys, key_err = keys(parsed)
        if key_err == null {
            for_each(parsed_keys) -> |_idx, key| {
                if key != "message" {
                    val, get_err = get(parsed, [key])
                    if get_err == null && val != null {
                        . = set!(., [key], val)
                    }
                }
            }
        }
        # Extract the actual log message if present
        if exists(parsed.message) && is_string(parsed.message) {
            .message = to_string!(parsed.message)
        } else {
            .message = raw
        }
        if .source_type == "unknown" {
            body_source_type = to_string(parsed.source_type) ?? null
            if body_source_type != null {
                .source_type = body_source_type
            }
        }
    } else {
        .message = raw
    }
} else if contains(content_type, "application/x-ndjson") || contains(content_type, "ndjson") {
    .content_format = "ndjson"
    parsed, err = parse_json(raw)
    if err == null {
        # Merge parsed JSON fields to top-level
        parsed_keys, key_err = keys(parsed)
        if key_err == null {
            for_each(parsed_keys) -> |_idx, key| {
                if key != "message" {
                    val, get_err = get(parsed, [key])
                    if get_err == null && val != null {
                        . = set!(., [key], val)
                    }
                }
            }
        }
        if exists(parsed.message) && is_string(parsed.message) {
            .message = to_string!(parsed.message)
        } else {
            .message = raw
        }
        if .source_type == "unknown" {
            body_source_type = to_string(parsed.source_type) ?? null
            if body_source_type != null {
                .source_type = body_source_type
            }
        }
    } else {
        .message = raw
    }
} else if contains(content_type, "text/plain") || contains(content_type, "text/") {
    .content_format = "raw"
    .message = raw
} else {
    if starts_with(raw, "{") || starts_with(raw, "[") {
        parsed, err = parse_json(raw)
        if err == null {
            .content_format = "json"
            # Merge parsed JSON fields to top-level
            parsed_keys, key_err = keys(parsed)
            if key_err == null {
                for_each(parsed_keys) -> |_idx, key| {
                    if key != "message" {
                        val, get_err = get(parsed, [key])
                        if get_err == null && val != null {
                            . = set!(., [key], val)
                        }
                    }
                }
            }
            if exists(parsed.message) && is_string(parsed.message) {
                .message = to_string!(parsed.message)
            } else {
                .message = raw
            }
            if .source_type == "unknown" {
                body_source_type = to_string(parsed.source_type) ?? null
                if body_source_type != null {
                    .source_type = body_source_type
                }
            }
        } else {
            .content_format = "raw"
            .message = raw
        }
    } else {
        .content_format = "raw"
        .message = raw
    }
}

if contains(to_string(.request_path) ?? "", "/webhook") {
    .is_webhook = true
}
'''

# =============================================================================
# Source Type Extraction and Normalization
# =============================================================================
[transforms.source_type_extract]
type = "remap"
inputs = ["parse_content"]
source = '''
source_type = "unknown"
if exists(.source_type) && is_string(.source_type) {
    source_type = to_string!(.source_type)
}

if source_type == "unknown" {
    if exists(."X-Source-Type") {
        st = to_string(."X-Source-Type") ?? ""
        if st != "" { source_type = downcase(st) }
    }
}
if source_type == "unknown" {
    if exists(."x-source-type") {
        st = to_string(."x-source-type") ?? ""
        if st != "" { source_type = downcase(st) }
    }
}

if source_type == "unknown" {
    if is_object(.metadata) && exists(.metadata.source_type) {
        st = to_string(.metadata.source_type) ?? ""
        if st != "" { source_type = downcase(st) }
    }
}

# Source type aliasing is handled dynamically by the router via match_values
# on each parser — no hardcoded aliases needed here.

# NAN-3806: the token decides the source, 100% token based. A listed token's
# `%nano_credential_name` is its bound source's route key (event metadata: a
# sender cannot set it). Whatever the sender declared above (X-Source-Type,
# a body `source_type`, `metadata.source_type`) never routes; a different
# claim is kept only as the raw `claimed_source_type` field. A listed token
# without a route is refused. The platform pull credential (nano-api's own
# collector integrations, each stream typed by its manifest) is the one
# credential whose declared type is kept.
nano_credential_id = to_string(%nano_credential_id) ?? ""
if nano_credential_id != "" && nano_credential_id != "6e616e6f-0000-4000-8000-000000000002" {
    bound_source_type = to_string(%nano_credential_name) ?? ""
    if bound_source_type == "" || bound_source_type == "*" {
        log("Refusing an event: its ingest token is not bound to a source", level: "warn")
        abort
    }
    if source_type != "unknown" && source_type != bound_source_type {
        .claimed_source_type = source_type
    }
    source_type = bound_source_type
}

.source_type = source_type
.routing_timestamp = now()

# OCSF lane (NAN-1241): stash the operational routing key into Vector EVENT
# METADATA so it survives the OCSF parsers' `. = {OCSF object}` root-replacement
# (which wipes `.source_type`). `%` metadata persists across `.` replacement on
# Vector 0.54. `ocsf_prepare` reads `%source_type` back onto the ocsf_logs row.
%source_type = downcase(source_type)
# NAN-2361 wave 8: the ingress lane, stashed the same way. The lake sink
# stamps it as `metadata.ingress_transport` so the tenant's per-source
# ingest counters can attribute rows the edge did not bind to a named source
# (the conventional `ingest-token` path) to the tenant's default source with
# the protocol they arrived on. Vocabulary: nano_https | hec | otlp | vector.
%ingress_transport = "nano_https"
'''
