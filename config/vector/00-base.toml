# NanoSIEM Vector Base Configuration
# This file contains the core pipeline: sources, auth, rate limiting, and sinks.
# Parser routing is handled by dynamically generated configs in sources/parsers/
#
# File loading order (alphabetical):
#   00-base.toml        - This file (sources, auth, rate limiting, sinks)
#   sources/parsers/    - Dynamically generated parser configs
#   transforms/         - Additional transforms (dynamic_router.toml)
#
# TLS: Handled by load balancer (Hetzner LB terminates HTTPS, forwards HTTP to Vector)

data_dir = "/var/lib/vector"

# =============================================================================
# Vector API (for config reload)
# =============================================================================
# NB: no `playground` key — vector removed `api.playground` in 0.55 (would fail
# config validation → crashloop). The GraphQL API stays on for config reload /
# `vector top`/`vector tap`; the browser playground IDE was a debug-only extra
# and its port (8686) isn't even published in docker-compose.opensource.yml.
#
# NAN-4918: loopback only. The API has no authentication, and on 0.0.0.0 every
# container on the compose network could read pipeline topology and tap live
# events. Health checks run inside the container (127.0.0.1); reload
# acknowledgement uses the internal-metrics exporter (:9598), not this API.
# `vector top` / `vector tap` work from inside the container (docker exec).
[api]
enabled = true
address = "127.0.0.1:8686"

# =============================================================================
# Single HTTP Source - All formats on one port
# Supports both single events and NDJSON batches
# =============================================================================
[sources.http_ingest]
type = "http_server"
address = "0.0.0.0:8080"
strict_path = false
path = "/"
# NAN-4038: capture only what the pipeline reads. Every captured header becomes
# an event field, and fields that are not UDM columns land in `ext` in
# ClickHouse, so X-Api-Key / X-Webhook-Secret used to be stored verbatim in
# searchable rows. NAN-4907: `Authorization` is read by source authentication
# below and is no longer copied into events either. Forwarding headers are
# read by rate_limit_prep. X-Nano-Edge-Client-IP is a private assertion from
# the role-split edge and is ignored unless that edge-only topology is enabled.
headers = ["X-Source-Type", "Content-Type", "X-Forwarded-For", "X-Real-IP", "X-Nano-Edge-Client-IP"]
# NAN-4945: the TCP peer that reached this listener (the nginx edge, or a
# direct sender). rate_limit_prep turns it into the trusted client address.
host_key = "nano_ingest_peer"

# Keep-alive for better connection reuse from log shippers
keepalive.max_connection_age_secs = 300  # 5 minutes

# NAN-5004: an HTTP success is a durable handoff, not merely admission into
# Vector's in-process graph. The nano Vector 0.61 fork attaches one batch
# notifier to every event decoded from the request. Its disk-buffer writer
# finalizes each event only after `flush_record` accepts the complete record;
# http_server returns 5xx when a downstream finalizer reports an error.
# Durable event sinks therefore use disk buffers with `when_full = "block"`:
# a saturated buffer applies backpressure instead of destroying a finalizer as
# `Dropped` (which Vector intentionally folds into Delivered). Request admission
# limits live at the nginx edge, where rejection is an explicit HTTP 429.
# NAN-5285: "accepts" includes the fsync. From nano-rs/vector 0.61.0-nano.10 the
# disk buffer syncs its data file and ledger before it acknowledges a record a
# source waits on, so the 2xx survives a power loss or hard reset of the host,
# not only a Vector kill (earlier images synced every 500 ms; the v2.0.13 HA
# drill lost an OTLP event answered ~370 ms before a reset). One sync covers
# every record buffered since the last flush.
[sources.http_ingest.acknowledgements]
enabled = true

# NAN-4907 (port of main NAN-3770 / NAN-3806): named, revocable per-source
# ingest tokens (Settings -> Ingest tokens). nano-api writes the SHA-256 of
# every accepted token to this file (0600, on the shared vector-dynamic
# volume); the nano-rs/vector fork re-reads it at most every
# `reload_interval_secs`, so a revoke is refused within seconds with no reload
# and no listener restart. A listed `Bearer <token>` is authenticated here and
# stamps `%nano_credential_id` / `%nano_credential_name` (event metadata: a
# sender cannot set it). The `name` is the bound source's route key, and
# `source_type_extract` routes on it, ignoring the sender's X-Source-Type. The
# route `*` marks a multiplex credential (nano-api's own senders, and the
# install token in the deprecated legacy multiplex mode): its events keep the
# type they declare. An unbound token is not listed and gets 401.
#
# nano-api writes `fallback_enabled = false` whenever VECTOR_AUTH_TOKEN is set,
# so the static `auth` below is consulted only when the file is missing or
# with no install token at all. A missing file FAILS CLOSED: the static check
# accepts the install token only when the deployment explicitly sets
# NANO_INGEST_STATIC_FALLBACK=true on Vector (a deployment that cannot deliver
# the tokens file and keeps the legacy multiplex install token). With no
# install token, only the explicit VECTOR_ALLOW_UNAUTHENTICATED_INGEST opt-in.
[sources.http_ingest.valid_tokens_file]
path = "/etc/vector/dynamic/ingest-tokens/tokens.json"
reload_interval_secs = 2

# NAN-3379 / NAN-4907: authenticate at the source so a bad or missing token gets
# HTTP 401. A VRL check after the source cannot change the response: a sender
# with a revoked or mistyped token would see 200 forever while every event was
# dropped. Header names are lowercase here.
[sources.http_ingest.auth]
strategy = "custom"
source = '''
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
allow_unauthenticated = (get_env_var("VECTOR_ALLOW_UNAUTHENTICATED_INGEST") ?? "") == "true"
static_fallback = (get_env_var("NANO_INGEST_STATIC_FALLBACK") ?? "") == "true"
auth_header = to_string(.headers.authorization) ?? ""
if expected_token == "" {
    allow_unauthenticated
} else {
    static_fallback && auth_header == "Bearer " + expected_token
}
'''

# Split incoming body by newlines - each line becomes a separate event
# This enables NDJSON batch ingestion from log shippers (Cribl, Fluentd, etc.)
[sources.http_ingest.framing]
method = "newline_delimited"

# Decode each line as raw bytes (transforms handle JSON parsing)
[sources.http_ingest.decoding]
codec = "bytes"

# =============================================================================
# Authentication Transform
# =============================================================================
[transforms.auth_check]
type = "remap"
inputs = ["http_ingest"]
source = '''
# The source already authenticated the request (valid_tokens_file, else the
# static `auth`), and never copies the Authorization header into the event.
credential_id = to_string(%nano_credential_id) ?? ""
expected_token = get_env_var("VECTOR_AUTH_TOKEN") ?? ""
allow_unauthenticated = (get_env_var("VECTOR_ALLOW_UNAUTHENTICATED_INGEST") ?? "") == "true"

if credential_id != "" {
    .auth_status = "authenticated"
} else if expected_token == "" {
    # NAN-1351 (F1): fail closed when no ingest token is configured, unless the
    # operator explicitly opted into unauthenticated ingest.
    if allow_unauthenticated {
        .auth_status = "unauthenticated"
    } else {
        log("Auth failed: VECTOR_AUTH_TOKEN is not set. Refusing unauthenticated ingest. Set VECTOR_AUTH_TOKEN, or set VECTOR_ALLOW_UNAUTHENTICATED_INGEST=true to explicitly allow it.", level: "error")
        abort
    }
} else if (get_env_var("NANO_INGEST_STATIC_FALLBACK") ?? "") == "true" {
    # The explicit static install-token fallback (tokens file missing on a
    # deployment that opted in): legacy multiplex, routed by X-Source-Type.
    .auth_status = "authenticated"
} else {
    log("Refusing an event without an ingest credential: the tokens file is missing and NANO_INGEST_STATIC_FALLBACK is not enabled", level: "error")
    abort
}

# Extract source_type from header, defaulting to "unknown"
# With framing, headers might exist but be empty - treat empty as unknown
source_type = "unknown"
if exists(."X-Source-Type") {
    st = to_string(."X-Source-Type") ?? ""
    if st != "" {
        source_type = st
    }
}
.source_type = source_type
.request_path = to_string(.path) ?? "/"
# NAN-4945: `path` and `X-Source-Type` are transport metadata, read above (and
# `path` kept as `request_path`). Dropped here, before parse_content merges the
# JSON body onto the event, so a body field of the same name is never removed.
del(.path)
del(."X-Source-Type")

# NAN-4038: no credential header may survive into the stored event. Only
# Authorization is captured today; the rest are defense in depth in case a
# header is added back to the source's `headers` list.
del(.Authorization)
del(.authorization)
del(."X-Api-Key")
del(."x-api-key")
del(."X-Webhook-Secret")
del(."x-webhook-secret")
del(."Cookie")
del(.cookie)
'''

# =============================================================================
# Trusted client metadata
# =============================================================================
[transforms.rate_limit_prep]
type = "remap"
inputs = ["auth_check"]
source = '''
# NAN-4945: the client address used for the throttle and kept on the event.
# Only the TCP peer (`nano_ingest_peer`, from the source's host_key) cannot be
# forged. `X-Real-IP` is believed only when that peer is a trusted proxy: the
# nginx edge sets it to the peer it saw (remote_addr), replacing what the sender
# sent. `X-Forwarded-For` is never believed: nginx appends the real peer to
# the sender's list, so its first entry is attacker-chosen. Proxy trust defaults
# to NONE. Set NANO_INGEST_TRUSTED_PROXIES to the exact sanitizing proxy
# addresses/CIDRs (comma-separated) only in a deployment that has such an edge.
# The role-split Compose edge instead stamps a private header after applying its
# exact inventory trusted_cidr contract; its existing edge-only flag gates use
# of that assertion, and Vector is not published directly in that topology.
peer = to_string(.nano_ingest_peer) ?? ""
del(.nano_ingest_peer)
trusted = get_env_var("NANO_INGEST_TRUSTED_PROXIES") ?? ""
from_proxy = false
if peer != "" {
    for_each(split(trusted, ",")) -> |_idx, cidr| {
        cidr = strip_whitespace(cidr)
        if cidr != "" && (ip_cidr_contains(cidr, peer) ?? false) {
            from_proxy = true
        }
    }
}
real_ip = strip_whitespace(to_string(."X-Real-IP") ?? "")
edge_ip = strip_whitespace(to_string(."X-Nano-Edge-Client-IP") ?? "")
client_ip = peer
if (get_env_var("NANO_HEC_TRUST_EDGE_IDENTITY") ?? "") == "true" && (is_ipv4(edge_ip) || is_ipv6(edge_ip)) {
    client_ip = edge_ip
} else if from_proxy && (is_ipv4(real_ip) || is_ipv6(real_ip)) {
    client_ip = real_ip
}
if client_ip == "" {
    client_ip = "unknown"
}
.client_ip = client_ip
# Kept in event metadata (a body field cannot overwrite it); parse_content
# writes them back as `ingest_client_ip` / `ingest_peer` after the body merge.
%nano_ingest_client_ip = client_ip
%nano_ingest_peer = peer
# The raw forwarding headers are transport metadata: dropped before
# parse_content merges the body, so body fields of those names survive.
del(."X-Forwarded-For")
del(."X-Real-IP")
del(."X-Nano-Edge-Client-IP")
'''

# =============================================================================
# Content-Type Detection & Parsing
# =============================================================================
[transforms.parse_content]
type = "remap"
inputs = ["rate_limit_prep"]
source = '''
content_type = to_string(."Content-Type") ?? to_string(."content-type") ?? ""
content_type = downcase(content_type)
# NAN-4945: the request's Content-Type stays on the event for the parsers
# (format-aware parsers pick parse_xml / parse_csv from it). Its value is also
# kept in event metadata, and the storage boundary (ingest_transport_strip_vrl!
# in vector_config/mod.rs) drops the root field when it still holds that
# header value, so it never lands in `unmapped`/`ext`; a body field of the same
# name with its own value survives.
header_content_type = to_string(."Content-Type") ?? to_string(."content-type") ?? ""
if header_content_type != "" {
    %nano_content_type = header_content_type
}

raw = to_string(.message) ?? ""
.metadata = {}
.metadata.forwarded_via = "http"
# Protected event metadata survives a parser that replaces the event root.
# Per-parser sampling reads this marker and must retain HTTP records covered by
# the request's durable-success contract (NAN-5004).
%nano_durable_ingest = true
.content_format = "unknown"

# Normalize empty source_type to "unknown" for consistent extraction logic
current_source_type = to_string(.source_type) ?? ""
if current_source_type == "" {
    .source_type = "unknown"
}

if contains(content_type, "application/json") {
    .content_format = "json"
    parsed, err = parse_json(raw)
    if err == null {
        if is_array(parsed) {
            # A top-level JSON array is a transport batch. The following remap
            # expands it before source routing; nested arrays remain untouched.
            %nano_json_batch = parsed
        } else if is_object(parsed) {
            # Retain the already-parsed record in protected event metadata for
            # credential redaction below. A sender cannot forge this control.
            %nano_json_record = parsed
            # Merge parsed JSON fields to top-level so format-aware parsers can
            # access them directly. `message` is ordinary source data, not an
            # HTTP envelope: `.message` must remain the complete JSON record for
            # source-specific parsers such as Generic JSON.
            parsed_keys, key_err = keys(parsed)
            if key_err == null {
                for_each(parsed_keys) -> |_idx, key| {
                    if key != "message" {
                        val, get_err = get(parsed, [key])
                        if get_err == null && val != null {
                            . = set!(., [key], val)
                        }
                    }
                }
            }
            if .source_type == "unknown" {
                body_source_type = to_string(parsed.source_type) ?? null
                if body_source_type != null {
                    .source_type = body_source_type
                }
            }
        }
        .message = raw
    } else {
        .message = raw
    }
} else if contains(content_type, "application/x-ndjson") || contains(content_type, "ndjson") {
    .content_format = "ndjson"
    parsed, err = parse_json(raw)
    if err == null {
        if is_array(parsed) {
            %nano_json_batch = parsed
        } else if is_object(parsed) {
            %nano_json_record = parsed
            # Newline framing already emits one event per NDJSON record. Keep
            # the full record in `.message` even when it contains a field with
            # that name; the configured parser owns any envelope semantics.
            parsed_keys, key_err = keys(parsed)
            if key_err == null {
                for_each(parsed_keys) -> |_idx, key| {
                    if key != "message" {
                        val, get_err = get(parsed, [key])
                        if get_err == null && val != null {
                            . = set!(., [key], val)
                        }
                    }
                }
            }
            if .source_type == "unknown" {
                body_source_type = to_string(parsed.source_type) ?? null
                if body_source_type != null {
                    .source_type = body_source_type
                }
            }
        }
        .message = raw
    } else {
        .message = raw
    }
} else if contains(content_type, "text/plain") || contains(content_type, "text/") {
    .content_format = "raw"
    .message = raw
} else {
    if starts_with(raw, "{") || starts_with(raw, "[") {
        parsed, err = parse_json(raw)
        if err == null {
            .content_format = "json"
            if is_array(parsed) {
                %nano_json_batch = parsed
            } else if is_object(parsed) {
                %nano_json_record = parsed
                # Headerless clients receive the same JSON semantics as an
                # explicit application/json request.
                parsed_keys, key_err = keys(parsed)
                if key_err == null {
                    for_each(parsed_keys) -> |_idx, key| {
                        if key != "message" {
                            val, get_err = get(parsed, [key])
                            if get_err == null && val != null {
                                . = set!(., [key], val)
                            }
                        }
                    }
                }
                if .source_type == "unknown" {
                    body_source_type = to_string(parsed.source_type) ?? null
                    if body_source_type != null {
                        .source_type = body_source_type
                    }
                }
            }
            .message = raw
        } else {
            .content_format = "raw"
            .message = raw
        }
    } else {
        .content_format = "raw"
        .message = raw
    }
}

# Parser-facing `.message` preserves the complete JSON record, but the storage
# security boundary also forbids credential-shaped body fields at any depth.
# Sanitize only when such a field exists so ordinary records retain their exact
# original bytes (including whitespace and key order). Reuse the protected
# parsed value above instead of parsing this hot path twice.
if exists(%nano_json_record) {
    parser_record = del(%nano_json_record)
    nano_message_cred_names = ["authorization", "proxy-authorization", "x-api-key", "x-webhook-secret", "cookie", "set-cookie"]
    nano_message_cred_paths = []
    # NAN-5180: walk only when a credential key can be present; see
    # credential_key_precheck_vrl! in nanosiem-core vector_config/mod.rs.
    if match(encode_json(object!(parser_record)), r'(?i)"(?:authorization|proxy-authorization|x-api-key|x-webhook-secret|cookie|set-cookie)":') {
        for_each(keys(flatten(object!(parser_record), "\u{1f}"))) -> |_idx, nano_flat_key| {
            nano_segments = split(nano_flat_key, "\u{1f}")
            nano_hit = -1
            for_each(nano_segments) -> |nano_i, nano_seg| {
                if nano_hit < 0 && includes(nano_message_cred_names, downcase(nano_seg)) {
                    nano_hit = nano_i
                }
            }
            if nano_hit >= 0 {
                nano_message_cred_paths = push(nano_message_cred_paths, slice!(nano_segments, 0, nano_hit + 1))
            }
        }
    }
    for_each(nano_message_cred_paths) -> |_idx, nano_path| {
        parser_record = object!(remove!(parser_record, array!(nano_path)))
    }
    if length(nano_message_cred_paths) > 0 {
        .message = encode_json(parser_record)
    }
}

# Remove the same fields from the merged root before any source parser runs.
# The storage-boundary redactor remains defense in depth for every transport.
nano_cred_names = ["authorization", "proxy-authorization", "x-api-key", "x-webhook-secret", "cookie", "set-cookie"]
nano_cred_paths = []
# NAN-5180: walk only when a credential key can be present; see
# credential_key_precheck_vrl! in nanosiem-core vector_config/mod.rs.
if match(encode_json(.), r'(?i)"(?:authorization|proxy-authorization|x-api-key|x-webhook-secret|cookie|set-cookie)":') {
    for_each(keys(flatten(., "\u{1f}"))) -> |_idx, nano_flat_key| {
        nano_segments = split(nano_flat_key, "\u{1f}")
        nano_hit = -1
        for_each(nano_segments) -> |nano_i, nano_seg| {
            if nano_hit < 0 && includes(nano_cred_names, downcase(nano_seg)) {
                nano_hit = nano_i
            }
        }
        if nano_hit >= 0 {
            nano_cred_paths = push(nano_cred_paths, slice!(nano_segments, 0, nano_hit + 1))
        }
    }
}
for_each(nano_cred_paths) -> |_idx, nano_path| {
    . = object!(remove!(., array!(nano_path)))
}

if contains(to_string(.request_path) ?? "", "/webhook") {
    .is_webhook = true
}

# A body may contain its own `metadata` object. Preserve it, but restore the
# transport marker used by the durable-delivery route after the merge.
if !is_object(.metadata) { .metadata = {} }
.metadata.forwarded_via = "http"

# NAN-4945: the trusted client address and the TCP peer, restored after the
# body merge so a sender cannot overwrite them.
ingest_client_ip = to_string(%nano_ingest_client_ip) ?? ""
if ingest_client_ip != "" { .ingest_client_ip = ingest_client_ip }
ingest_peer = to_string(%nano_ingest_peer) ?? ""
if ingest_peer != "" { .ingest_peer = ingest_peer }
'''

# =============================================================================
# JSON batch expansion
# =============================================================================
# `http_server` newline framing handles NDJSON records, but a JSON array is one
# decoded source event. `unnest!` returns cloned log objects and Vector's remap
# transform emits one event per array member. Event metadata (including the
# authenticated source binding and the request batch notifier) is retained on
# every clone, so one HTTP 2xx still waits for every member's disk handoff.
[transforms.json_batch_expand]
type = "remap"
inputs = ["parse_content"]
source = '''
if is_array(%nano_json_batch) {
    .nano_json_batch = del(%nano_json_batch)
    %nano_json_batch_member = true
    . = unnest!(.nano_json_batch)
}
'''

[transforms.json_batch_normalize]
type = "remap"
inputs = ["json_batch_expand"]
source = '''
if to_bool(%nano_json_batch_member) ?? false {
    del(%nano_json_batch_member)
    parsed = del(.nano_json_batch)

    # Match the single-object contract: parser-facing `.message` is the whole
    # member, while native object/array values are also available at the root.
    if is_object(parsed) {
        # Apply the same recursive credential-field boundary as single-object
        # JSON before the member becomes either `.message` or merged fields.
        nano_cred_names = ["authorization", "proxy-authorization", "x-api-key", "x-webhook-secret", "cookie", "set-cookie"]
        nano_cred_paths = []
        # NAN-5180: walk only when a credential key can be present; see
        # credential_key_precheck_vrl! in nanosiem-core vector_config/mod.rs.
        if match(encode_json(object!(parsed)), r'(?i)"(?:authorization|proxy-authorization|x-api-key|x-webhook-secret|cookie|set-cookie)":') {
            for_each(keys(flatten(object!(parsed), "\u{1f}"))) -> |_idx, nano_flat_key| {
                nano_segments = split(nano_flat_key, "\u{1f}")
                nano_hit = -1
                for_each(nano_segments) -> |nano_i, nano_seg| {
                    if nano_hit < 0 && includes(nano_cred_names, downcase(nano_seg)) {
                        nano_hit = nano_i
                    }
                }
                if nano_hit >= 0 {
                    nano_cred_paths = push(nano_cred_paths, slice!(nano_segments, 0, nano_hit + 1))
                }
            }
        }
        for_each(nano_cred_paths) -> |_idx, nano_path| {
            parsed = object!(remove!(parsed, array!(nano_path)))
        }

        parsed_keys = keys!(parsed)
        for_each(parsed_keys) -> |_idx, key| {
            if key != "message" {
                val = get!(parsed, [key])
                if val != null { . = set!(., [key], val) }
            }
        }
        if (to_string(.source_type) ?? "unknown") == "unknown" {
            body_source_type = to_string(parsed.source_type) ?? ""
            if body_source_type != "" { .source_type = body_source_type }
        }
    }

    raw = encode_json(parsed)
    .message = raw
    .content_format = "json"
    if !is_object(.metadata) { .metadata = {} }
    .metadata.forwarded_via = "http"

    # The array member is untrusted body data; restore the edge-derived values
    # after merging it so it cannot forge transport identity.
    ingest_client_ip = to_string(%nano_ingest_client_ip) ?? ""
    if ingest_client_ip != "" { .ingest_client_ip = ingest_client_ip }
    ingest_peer = to_string(%nano_ingest_peer) ?? ""
    if ingest_peer != "" { .ingest_peer = ingest_peer }
}
'''

# =============================================================================
# Source Type Extraction and Normalization
# =============================================================================
[transforms.source_type_extract]
type = "remap"
inputs = ["json_batch_normalize"]
source = '''
source_type = "unknown"
if exists(.source_type) && is_string(.source_type) {
    source_type = to_string!(.source_type)
}

if source_type == "unknown" {
    if exists(."X-Source-Type") {
        st = to_string(."X-Source-Type") ?? ""
        if st != "" { source_type = downcase(st) }
    }
}
if source_type == "unknown" {
    if exists(."x-source-type") {
        st = to_string(."x-source-type") ?? ""
        if st != "" { source_type = downcase(st) }
    }
}

if source_type == "unknown" {
    if is_object(.metadata) && exists(.metadata.source_type) {
        st = to_string(.metadata.source_type) ?? ""
        if st != "" { source_type = downcase(st) }
    }
}

# Source type aliasing is handled dynamically by the router via match_values
# on each parser — no hardcoded aliases needed here.

# NAN-4907 (port of main NAN-3806): the token decides the source. A listed
# token's `%nano_credential_name` is its bound source's route key (event
# metadata: a sender cannot set it). Whatever the sender declared above
# (X-Source-Type, a body `source_type`, `metadata.source_type`) never routes; a
# different claim is kept only as the raw `claimed_source_type` field. The
# route `*` is a multiplex credential (nano-api's own senders, or the install
# token in legacy multiplex mode): its declared type is kept. A listed token
# without a route is refused. An event with no credential stamp came in through
# the static install-token fallback (tokens file missing) and keeps its
# declared type, as before per-source tokens.
del(.claimed_source_type)
# NAN-4912: the claim is also kept in event METADATA (a sender cannot set it)
# so it survives a parser that replaces the root; the UDM `_output` and the
# OCSF `_ocsf_prepare` restore it.
del(%nano_claimed_source_type)
nano_credential_id = to_string(%nano_credential_id) ?? ""
if nano_credential_id != "" {
    bound_source_type = to_string(%nano_credential_name) ?? ""
    if bound_source_type == "" {
        log("Refusing an event: its ingest token is not bound to a source", level: "warn")
        abort
    }
    if bound_source_type != "*" {
        if source_type != "unknown" && source_type != bound_source_type {
            .claimed_source_type = source_type
            %nano_claimed_source_type = source_type
            # NAN-5264: the claim is ignored, so say so. Source health counts
            # these per source (source_claims_ignored_24h); this is the
            # operator-side trace. Rate-limited: one sender repeats it per event.
            log("Ignoring declared source_type " + replace(truncate(source_type, 64), r'[^\w.-]', "_") + " (X-Source-Type / body source_type): the ingest token is bound to " + bound_source_type + ". Use that source's token, or a token for the declared source.", level: "warn", rate_limit_secs: 60)
        }
        source_type = bound_source_type
    }
}

.source_type = source_type
.routing_timestamp = now()

# OCSF lane (NAN-1241): stash the operational routing key into Vector EVENT
# METADATA so it survives the OCSF parsers' `. = {OCSF object}` root-replacement
# (which wipes `.source_type`). `%` metadata persists across `.` replacement on
# Vector 0.54. `ocsf_prepare` reads `%source_type` back onto the ocsf_logs row.
%source_type = downcase(source_type)
'''
