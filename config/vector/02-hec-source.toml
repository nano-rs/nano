# Splunk HEC Source
# Accepts events on the Splunk HTTP Event Collector wire format so existing
# Splunk forwarders / agents can be repointed at nano without rewriting their
# config. Port 8088 is the standard HEC port.
#
# Auth (NAN-4907, port of main NAN-3770 / NAN-3806): named, revocable
# per-source tokens from Settings -> Ingest tokens, read from
# `valid_tokens_file` (SHA-256 hashes only, written by nano-api to the shared
# vector-dynamic volume, re-read every 2 s so a revoke is refused within
# seconds without a reload). A listed token stamps `%nano_credential_id` /
# `%nano_credential_name` on its events; the name is the bound source's route
# key and `hec_normalize` routes on it, not on the envelope's `sourcetype`.
# nano-api writes `fallback_enabled = false` whenever VECTOR_AUTH_TOKEN is set,
# so the static `valid_tokens` below is consulted only while the file is
# missing. That FAILS CLOSED: `hec_normalize` drops (and logs) every event
# without a credential stamp unless the deployment explicitly sets
# NANO_INGEST_STATIC_FALLBACK=true on Vector (legacy multiplex install token
# where the tokens file cannot be delivered).

[sources.splunk_hec_ingest]
type = "splunk_hec"
address = "0.0.0.0:8088"
valid_tokens = ["${VECTOR_AUTH_TOKEN}"]
valid_tokens_file.path = "/etc/vector/dynamic/ingest-tokens/tokens.json"
valid_tokens_file.reload_interval_secs = 2
# Indexer acknowledgements (NAN-4976): an event POST with an
# `X-Splunk-Request-Channel` (header or `?channel=`) answers an `ackId`;
# `POST /services/collector/ack` (same token check; gzip-encoded polls need
# nano-rs/vector 0.61.0-nano.5+) reports it true once every sink the event
# reached has finalized it. Every ClickHouse event sink is disk-buffered
# (`_pipeline.toml`, pinned by deploy/hec_ack_contract_tests.rs), so true means
# "committed (and, from nano-rs/vector 0.61.0-nano.10, fsynced: NAN-5285) to
# the durable buffer in front of ClickHouse", not the INSERT:
# acks keep resolving through a ClickHouse outage and the buffer delivers
# at-least-once after it. Acks live in this Vector process's memory, so a
# sender must poll the replica that took the event (sticky by channel behind
# a load balancer) and an ackId outstanding across a Vector restart reads false.
acknowledgements.enabled = true
# Bound acknowledgement state so a credential cannot turn outstanding ackIds
# or idle channels into unbounded listener memory. With acks enabled the source
# registers an ack before parsing an event request, so max_pending_acks also
# bounds concurrent/outstanding accepted requests. The source independently
# enforces its built-in 100 MiB decompressed request cap before event creation.
acknowledgements.max_pending_acks = 100000
acknowledgements.max_number_of_ack_channels = 10000
acknowledgements.max_pending_acks_per_channel = 10000
acknowledgements.ack_idle_cleanup = true
acknowledgements.max_idle_time = 300

# =============================================================================
# HEC Normalization
# Splunk HEC events arrive with structure:
#   { "event": <object|string>, "sourcetype": "...", "source": "...",
#     "host": "...", "time": <epoch>, "index": "...", "fields": {...} }
# We flatten this into the same shape the rest of the pipeline expects.
# =============================================================================
[transforms.hec_normalize]
type = "remap"
inputs = ["splunk_hec_ingest"]
source = '''
# The role-split edge replaces X-Splunk-Request-Channel with the sender's
# channel plus an authenticated client-address suffix. This is disabled unless
# the deployment guarantees that Vector is reachable only through that edge;
# direct HEC listeners must never trust a sender-created suffix.
if (get_env_var("NANO_HEC_TRUST_EDGE_IDENTITY") ?? "") == "true" {
    hec_channel = to_string(.splunk_channel) ?? ""
    hec_edge, hec_edge_err = parse_regex(hec_channel, r'^(?P<channel>.*);nano-client=(?P<client>[^;]+)$')
    if hec_edge_err == null {
        hec_client = to_string(hec_edge.client)
        if !(is_ipv4(hec_client) || is_ipv6(hec_client)) {
            log("Refusing a HEC event with an invalid edge client identity", level: "error")
            abort
        }
        %nano_ingest_client_ip = hec_client
        original_channel = to_string(hec_edge.channel)
        if original_channel == "" {
            del(.splunk_channel)
        } else {
            .splunk_channel = original_channel
        }
    }
}

# The source already enforced auth (valid_tokens_file, else the static
# valid_tokens fallback while the tokens file is missing) — mark and move on.
.auth_status = "authenticated"
nano_credential_id = to_string(%nano_credential_id) ?? ""
if nano_credential_id == "" && (get_env_var("NANO_INGEST_STATIC_FALLBACK") ?? "") != "true" {
    log("Refusing a HEC event without an ingest credential: the tokens file is missing and NANO_INGEST_STATIC_FALLBACK is not enabled", level: "error")
    abort
}

# Vector's `splunk_hec` source emits the envelope's sourcetype as
# `.splunk_sourcetype` (prefixed to avoid collisions with the event's
# own fields — Vector 0.50+). Earlier versions used `.sourcetype`.
# Check both so we work across versions. (NAN-924)
source_type = "unknown"
if exists(.splunk_sourcetype) {
    st = to_string(.splunk_sourcetype) ?? ""
    if st != "" {
        source_type = downcase(st)
    }
}
if source_type == "unknown" && exists(.sourcetype) {
    st = to_string(.sourcetype) ?? ""
    if st != "" {
        source_type = downcase(st)
    }
}
# NAN-4907 (port of main NAN-3806): the token decides the source. The bound
# source's route key replaces whatever the envelope declared; a differing claim
# is kept only as the raw `claimed_source_type`. The route `*` is a multiplex
# credential (nano-api's own senders, or the install token in legacy multiplex
# mode) and keeps its declared type; so does an unstamped event (only reached
# with the explicit static fallback). A listed token without a route is
# refused.
del(.claimed_source_type)
# NAN-4912: the claim is also kept in event METADATA (a sender cannot set it)
# so it survives a parser that replaces the root; the UDM `_output` and the
# OCSF `_ocsf_prepare` restore it.
del(%nano_claimed_source_type)
if nano_credential_id != "" {
    bound_source_type = to_string(%nano_credential_name) ?? ""
    if bound_source_type == "" {
        log("Refusing a HEC event: its ingest token is not bound to a source", level: "warn")
        abort
    }
    if bound_source_type != "*" {
        if source_type != "unknown" && source_type != bound_source_type {
            .claimed_source_type = source_type
            %nano_claimed_source_type = source_type
            # NAN-5264: the claim is ignored, so say so. Source health counts
            # these per source (source_claims_ignored_24h); this is the
            # operator-side trace. Rate-limited: one sender repeats it per event.
            log("Ignoring declared source_type " + replace(truncate(source_type, 64), r'[^\w.-]', "_") + " (HEC sourcetype): the ingest token is bound to " + bound_source_type + ". Use that source's token, or a token for the declared source.", level: "warn", rate_limit_secs: 60)
        }
        source_type = bound_source_type
    }
}
.source_type = source_type

# Splunk's .event holds the actual log payload. Lift it into .message
# (raw forms) or merge its keys (structured forms) so downstream parsers
# see the same shape as HTTP-ingested events.
#
# Reserved root keys must not be lifted from .event — otherwise a Splunk
# forwarder can clobber routing-critical fields (.source_type, .namespace,
# .auth_status, etc.) and bypass per-parser HEC filters that fire on
# source_type. NAN-938.
if exists(.event) {
    if is_object(.event) {
        reserved = ["source_type", "namespace", "auth_status", "timestamp",
                    "metadata", "ingest_time", "_inserted_at", "id", "ext",
                    "message", "sourcetype", "splunk_sourcetype",
                    "content_format", "routing_timestamp", "claimed_source_type"]
        event_keys = keys(object!(.event))
        for_each(event_keys) -> |_idx, key| {
            if !includes(reserved, key) {
                val, get_err = get(.event, [key])
                if get_err == null && val != null {
                    . = set!(., [key], val)
                }
            }
        }
        if exists(.event.message) && is_string(.event.message) {
            .message = to_string!(.event.message)
        } else {
            .message = encode_json(.event)
        }
    } else if is_string(.event) {
        .message = to_string!(.event)
    } else {
        .message = encode_json(.event)
    }
    del(.event)
}

# NAN-3646 (ported): a sender that posts a structured (object) event can reach
# this point with no `.message`: Vector's splunk_hec source spreads an object
# event over the log root instead of keeping `.event`. Every parser reads
# `.message`, so rebuild the payload from the root minus the HEC envelope and
# pipeline fields. VRL objects are key-sorted, so the JSON is deterministic. A
# non-string `.message` (an object or number) is serialized the same way.
if !exists(.message) || .message == null || .message == "" {
    hec_envelope_keys = ["message", "auth_status", "source_type", "claimed_source_type",
                         "sourcetype", "splunk_sourcetype", "splunk_source", "splunk_index",
                         "splunk_channel", "host",
                         "timestamp", "metadata", "content_format", "routing_timestamp",
                         "ingest_time", "_inserted_at"]
    hec_payload = {}
    for_each(object!(.)) -> |key, value| {
        if !includes(hec_envelope_keys, key) && value != null {
            hec_payload = set!(hec_payload, [key], value)
        }
    }
    if length(hec_payload) > 0 {
        .message = encode_json(hec_payload)
    } else {
        .message = ""
    }
} else if !is_string(.message) {
    .message = encode_json(.message)
}

.content_format = "splunk_hec"
.routing_timestamp = now()

if !is_object(.metadata) {
    .metadata = {}
}
.metadata.forwarded_via = "splunk_hec"
'''
