# =============================================================================
# Bootstrap dynamic router
# =============================================================================
# NAN-1083: ship a SIEM with no opinionated pre-seeded routes. This file is the
# first-boot artifact used by Vector before any parser-deploy regenerates it
# via `nanosiem-core::parsers::vector_config::router::write_router_config`.
#
# On a fresh install there are no deployed parsers and no source configs, so
# `source_router` accepts the two always-present base inputs (`vector_merge`
# from native Vector traffic, `http_ingestion_route` from the HTTP pipeline)
# and offers only the `generic` catch-all route. Unmatched events fall through
# to `generic_parser` in `_pipeline.toml` and are normalized as-is.
#
# `placeholder_combiner` is required because `_pipeline.toml`'s `normalize`
# transform names it as an input. It's a no-op filter consuming from
# `source_router.generic` and dropping every event via `condition = "false"`
# — present-but-inert so the topology stays valid until a parser-deploy
# rewrites this file with real placeholders for any installed parsers.

[transforms.source_router]
type = "route"
inputs = ["vector_merge", "http_ingestion_route"]

[transforms.source_router.route]
# NAN-1124: exclude nano_enrich (push enrichment) so it never reaches the
# generic log parser — enrichment_router below claims it instead.
generic = '!starts_with(downcase(to_string(.source_type) ?? ""), "nano_enrich")'

# =============================================================================
# NAN-1124: Enrichment lane router (nano_enrich -> per-kind outputs)
# =============================================================================
# Sibling to source_router with identical inputs; routes push-enrichment records
# by `.kind` to the outputs consumed by config/vector/03-enrichment-lane.toml.
# Non-enrichment events fall to enrichment_router._unmatched (dropped). Present
# in this bootstrap so the lane file's `enrichment_router.<kind>` inputs never
# dangle before the first parser-deploy regenerates this file. Kept in sync with
# router::write_router_config (which emits the same block dynamically).
[transforms.enrichment_router]
type = "route"
inputs = ["vector_merge", "http_ingestion_route"]

[transforms.enrichment_router.route]
identity = 'downcase(to_string(.source_type) ?? "") == "nano_enrich" && downcase(to_string(.kind) ?? "") == "identity"'
ip_context = 'downcase(to_string(.source_type) ?? "") == "nano_enrich" && downcase(to_string(.kind) ?? "") == "ip_context"'
ioc = 'downcase(to_string(.source_type) ?? "") == "nano_enrich" && downcase(to_string(.kind) ?? "") == "ioc"'
asset = 'downcase(to_string(.source_type) ?? "") == "nano_enrich" && downcase(to_string(.kind) ?? "") == "asset"'

[transforms.placeholder_combiner]
type = "filter"
inputs = ["source_router.generic"]
condition = "false"
