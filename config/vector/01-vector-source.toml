# Vector Native Source
# Receives events from upstream Vector instances (aggregators, forwarders)
# Port 6000 is the standard Vector-to-Vector port
#
# Use case: On-premise Vector aggregator forwarding to cloud SIEM
# Events arrive pre-structured, minimal processing needed
#
# NAN-5515: ALWAYS mutual TLS. The Vector protocol has no token auth, so the
# client certificate is the credential: a sender must present a certificate
# that chains to an anchor in tls.ca_file, or the TLS handshake is refused
# before any event is read. There is no plaintext mode and no switch to turn
# verification off. Issue sender certificates with
# `scripts/nano vector-client-cert <name>` (Compose) or from the chart's
# Secrets (Helm, docs/getting-started/kubernetes.md).
#
# tls.ca_file is a BUNDLE of per-sender anchors (one small CA per sender), so
# revoking one sender removes only its anchor; the listener certificate comes
# from a separate listener CA that is never in the bundle. Defaults:
# /etc/nano/vector-native/{server.crt,server.key,client-ca.crt}; Compose
# mounts <install>/config/vector-native there (install.sh / nano upgrade
# issue it), role-split ingest hosts mount the cluster's private TLS
# certificate as the listener, Helm mounts its Secrets. When a file is
# missing or unreadable the entrypoint substitutes LOCKED material (an anchor
# whose key never existed), so the listener refuses every sender instead of
# falling back to plaintext.
#
# NAN-4907: a client certificate proves a sender may send, not which source it
# is. Events land under the fixed route `vector_native` and a declared
# `.source_type` survives only as `claimed_source_type`, so a sender cannot
# select a parser. A deployment that trusts every certificate holder's
# declared type can opt back in with NANO_VECTOR_NATIVE_TRUST_SOURCE_TYPE=true.
[sources.vector_native]
type = "vector"
address = "${NANO_VECTOR_NATIVE_ADDRESS:-0.0.0.0:6000}"
version = "2"  # Vector protocol version
tls.enabled = true
tls.crt_file = "${NANO_VECTOR_NATIVE_CRT_FILE:-/etc/nano/vector-native/server.crt}"
tls.key_file = "${NANO_VECTOR_NATIVE_KEY_FILE:-/etc/nano/vector-native/server.key}"
tls.ca_file = "${NANO_VECTOR_NATIVE_CA_FILE:-/etc/nano/vector-native/client-ca.crt}"
# Require and verify a client certificate (a connection without one, or with
# one that chains to no anchor in the bundle, is refused).
tls.verify_certificate = true

# Acknowledgements ensure upstream Vector knows events were received
acknowledgements.enabled = true

# =============================================================================
# Vector Native Auth & Normalization
# Events from Vector are already structured, but we normalize for consistency
# =============================================================================
[transforms.vector_auth]
type = "remap"
inputs = ["vector_native"]
source = '''
# NAN-5515: the TLS handshake verified the sender's client certificate.
.auth_status = "vector_forwarded"

# Ensure source_type exists
if !exists(.source_type) || !is_string(.source_type) {
    .source_type = "unknown"
}

# Normalize source_type to lowercase
.source_type = downcase(to_string(.source_type) ?? "unknown")

# NAN-4907: a sender never selects a parser route unless trust is configured.
del(.claimed_source_type)
del(%nano_claimed_source_type)
if (get_env_var("NANO_VECTOR_NATIVE_TRUST_SOURCE_TYPE") ?? "") != "true" {
    if .source_type != "unknown" && .source_type != "vector_native" {
        .claimed_source_type = .source_type
        %nano_claimed_source_type = .source_type
    }
    .source_type = "vector_native"
}

# Ensure message exists
if !exists(.message) {
    if exists(.log) {
        .message = to_string(.log) ?? ""
    } else {
        .message = encode_json(.)
    }
}

# Set routing timestamp
.routing_timestamp = now()

# Ensure metadata exists
if !exists(.metadata) || !is_object(.metadata) {
    .metadata = {}
}

# Mark as forwarded from Vector
.metadata.forwarded_via = "vector_native"
'''

# =============================================================================
# Merge Vector events into main pipeline
# Skips HTTP-specific parsing, goes directly to source type extraction
# =============================================================================
[transforms.vector_merge]
type = "remap"
inputs = ["vector_auth"]
source = '''
# Preserve all fields, just ensure consistent structure
.content_format = "vector"

# Source type aliasing is handled dynamically by the router via match_values
# on each parser — no hardcoded aliases needed here.
'''
