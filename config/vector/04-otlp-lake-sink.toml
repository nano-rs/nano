# Native OTLP spans and metrics -> Nano object lake (NAN-2361)
# =============================================================================
# The existing 03-otlp-source.toml owns the OTLP listener and routes each native
# record to exactly one selected backend. Legacy installs keep their ClickHouse
# sink; lake installs POST native batches to `lake_otel_ingest`:
#
#   * open-core lean: `http://lean-otel:3014` (NANO_OTEL_LAKE_MODE=trusted_local),
#     which writes durable native Parquet (nanosiem-lake-worker otel_local.rs);
#   * hosted lean: `http://otel.internal`, the tenant Worker's outbound host,
#     which lands each batch as one immutable object under
#     `otel-handoff-v1/tenant_uuid=<T>/` in the tenant's R2 bucket; the tenant's
#     `lake_otel_ingest` (NANO_OTEL_LAKE_MODE=lean) drains it into its query
#     mirror (otel_lean.rs).
#
# The overlay consumes the one-record-per-event span shape from
# `otlp_traces_prep` and the pre-ClickHouse native metric shape from
# `otlp_metrics_to_log`. It does not normalize traces or metrics into OCSF:
# OCSF is the event/log dataset, while spans and metrics retain their native
# OTLP semantics in separate native datasets.
#
# Required environment variables:
#   NANO_OTEL_LAKE_INGEST_URL
#   NANO_OTEL_LAKE_INGEST_TOKEN
#
# Wire contract: newline-delimited JSON, one envelope per span or metric point.
# The endpoint authenticates the bearer token and stamps its configured tenant
# server-side. Tenant identity is intentionally absent from this untrusted
# request body.
# =============================================================================

[transforms.otlp_lake_spans_envelope]
type = "remap"
inputs = ["otlp_traces_backend.lake"]
drop_on_abort = true
drop_on_error = true
reroute_dropped = false
source = '''
event, err = parse_json(.event)
if err != null || !is_object(event) { abort }

event_time_unix_nano = to_string(event.startTimeUnixNano) ?? ""
if event_time_unix_nano == "" || event_time_unix_nano == "0" { abort }
ingest_time_unix_nano = to_string(to_unix_timestamp(now(), unit: "nanoseconds"))
if ingest_time_unix_nano == "0" { abort }

. = {
    "schema_version": "nano-otlp-lake-v1",
    "dataset": "spans",
    "source_type": "otlp_trace",
    "ingest_time_unix_nano": ingest_time_unix_nano,
    "event": event
}
'''

[transforms.otlp_lake_metrics_envelope]
type = "remap"
inputs = ["otlp_metrics_backend.lake"]
drop_on_abort = true
drop_on_error = true
reroute_dropped = false
source = '''
ts = .timestamp
if !is_timestamp(ts) { ts = now() }
nanos = to_string(to_unix_timestamp(ts, unit: "nanoseconds") ?? 0)
if nanos == "0" { abort }

# metric_to_log exposes the data-point and resource attributes in `.tags`.
# Preserve their native separation in OTLP KeyValue arrays; the Rust endpoint
# stores both flattened maps plus the complete raw OTLP object.
attrs = []
res_attrs = []
tags = object(.tags) ?? {}
# NAN-3886: metric_to_log lifts a data-point attribute named `host` out of the
# tags into the top-level `.host` field (its default `host_tag`), so the
# attribute vanished from the stored point. Put it back.
if !exists(tags.host) && exists(.host) {
    tags = set!(tags, ["host"], to_string(.host) ?? encode_json(.host))
}
for_each(tags) -> |k, v| {
    sv = if is_object(v) || is_array(v) { encode_json(v) } else { to_string(v) ?? "" }
    if starts_with(k, "resource.") {
        rk = replace(k, "resource.", "")
        res_attrs = push(res_attrs, { "key": rk, "value": { "stringValue": sv } })
    } else {
        attrs = push(attrs, { "key": k, "value": { "stringValue": sv } })
    }
}

event = {
    "metadata": { "nano_credential_id": %nano_credential_id },
    "name": to_string(.name) ?? "",
    "unit": to_string(.unit) ?? "",
    "timeUnixNano": nanos,
    "attributes": attrs,
    "resource": { "attributes": res_attrs }
}

metric_kind = to_string(.kind) ?? ""
temporality = if metric_kind == "absolute" { 2 } else if metric_kind == "incremental" { 1 } else { 0 }
ingest_time_unix_nano = to_string(to_unix_timestamp(now(), unit: "nanoseconds"))
if ingest_time_unix_nano == "0" { abort }

if exists(.gauge) {
    event = set!(event, ["type"], "gauge")
    event = set!(event, ["asDouble"], to_float(.gauge.value) ?? 0.0)
} else if exists(.counter) {
    event = set!(event, ["type"], "sum")
    event = set!(event, ["asDouble"], to_float(.counter.value) ?? 0.0)
    event = set!(event, ["aggregationTemporality"], temporality)
} else if exists(.aggregated_histogram) {
    event = set!(event, ["type"], "histogram")
    event = set!(event, ["aggregationTemporality"], temporality)
    event = set!(event, ["count"], to_int(.aggregated_histogram.count) ?? 0)
    event = set!(event, ["sum"], to_float(.aggregated_histogram.sum) ?? 0.0)
    buckets = array(.aggregated_histogram.buckets) ?? []
    last_bucket = length(buckets) - 1
    bucket_counts = []
    explicit_bounds = []
    for_each(buckets) -> |i, bucket| {
        bucket_counts = push(bucket_counts, to_int(bucket.count) ?? 0)
        if i < last_bucket {
            explicit_bounds = push(explicit_bounds, to_float(bucket.upper_limit) ?? 0.0)
        }
    }
    event = set!(event, ["bucketCounts"], bucket_counts)
    event = set!(event, ["explicitBounds"], explicit_bounds)
}

points = [event]
if exists(.aggregated_summary) {
    # NAN-3886: the native schema has gauge, sum and histogram points only, and
    # a summary used to be dropped here without a trace (Prometheus client
    # summaries, e.g. go_gc_duration_seconds, are common). Store it the way the
    # OTel Prometheus exporter exposes it: one gauge per quantile under the
    # metric name with a `quantile` attribute, plus `<name>_count` and
    # `<name>_sum` cumulative sums.
    name = to_string(.name) ?? ""
    points = []
    for_each(array(.aggregated_summary.quantiles) ?? []) -> |_i, q| {
        quantile_attrs = push(attrs, { "key": "quantile", "value": { "stringValue": to_string(to_float(q.quantile) ?? 0.0) } })
        points = push(points, merge(event, {
            "attributes": quantile_attrs,
            "type": "gauge",
            "asDouble": to_float(q.value) ?? 0.0
        }))
    }
    points = push(points, merge(event, {
        "name": name + "_count",
        "type": "sum",
        "asDouble": to_float(.aggregated_summary.count) ?? 0.0,
        "aggregationTemporality": temporality
    }))
    points = push(points, merge(event, {
        "name": name + "_sum",
        "type": "sum",
        "asDouble": to_float(.aggregated_summary.sum) ?? 0.0,
        "aggregationTemporality": temporality
    }))
} else if !exists(event.type) {
    # Any other Vector metric variant (set, distribution, sketch) has no
    # native OTLP point shape. Reject it instead of silently recording it as a
    # zero-valued gauge.
    abort
}

# A root array makes remap emit one event per element (summary fan-out).
envelopes = []
for_each(points) -> |_i, point| {
    envelopes = push(envelopes, {
        "schema_version": "nano-otlp-lake-v1",
        "dataset": "metrics",
        "source_type": "otlp_metric",
        "ingest_time_unix_nano": ingest_time_unix_nano,
        "event": point
    })
}
. = envelopes
'''

# The HTTP sink encodes each buffered batch as NDJSON. A batch is acknowledged
# upstream only after the Rust lake ingest endpoint returns success. Disk
# buffers block when full: accepted telemetry is never deliberately shed.
# Vector 0.57 parses typed numeric TOML before environment interpolation, so the
# numeric limits below are concrete deployment defaults. A deployment renderer
# may materialize different numeric values for larger tenants.
#
# NAN-4189: batches flush every 5 s, not every 1 s. On hosted lean every batch
# is one `otel-handoff-v1/` object: 1 R2 PUT, 2 HEAD + 1 GET in the drain, and a
# writer-DO lease + record (~6 SQLite rows). At 1 s the internal ops tenant
# wrote ~4.7k objects/h (~$1.4/day of Cloudflare); 5 s coalesces bursts to ~2k/h.
# The ceiling is the ACK path: end-to-end acknowledgements hold the OTLP
# response until this sink delivers, the hosted direct ACK cap is 15 s, and the
# common OTel SDK export timeout is 10 s, so 5 s leaves room for the PUT.
[sinks.otlp_lake_spans]
type = "http"
inputs = ["otlp_lake_spans_envelope"]
uri = "${NANO_OTEL_LAKE_INGEST_URL:-http://127.0.0.1:9}/v1/otlp/spans"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
acknowledgements.enabled = true

[sinks.otlp_lake_spans.buffer]
type = "disk"
max_size = 5368709120
when_full = "block"

[sinks.otlp_lake_spans.batch]
max_bytes = 5242880
max_events = 5000
timeout_secs = 5

[sinks.otlp_lake_spans.request]
concurrency = "adaptive"
timeout_secs = 120
retry_initial_backoff_secs = 1
retry_max_duration_secs = 300

[sinks.otlp_lake_spans.request.headers]
Authorization = "Bearer ${NANO_OTEL_LAKE_INGEST_TOKEN:-legacy-disabled-legacy-disabled}"
Content-Type = "application/x-ndjson"

[sinks.otlp_lake_spans.healthcheck]
enabled = false

[sinks.otlp_lake_metrics]
type = "http"
inputs = ["otlp_lake_metrics_envelope"]
uri = "${NANO_OTEL_LAKE_INGEST_URL:-http://127.0.0.1:9}/v1/otlp/metrics"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
acknowledgements.enabled = true

[sinks.otlp_lake_metrics.buffer]
type = "disk"
max_size = 5368709120
when_full = "block"

[sinks.otlp_lake_metrics.batch]
max_bytes = 5242880
max_events = 5000
timeout_secs = 5

[sinks.otlp_lake_metrics.request]
concurrency = "adaptive"
timeout_secs = 120
retry_initial_backoff_secs = 1
retry_max_duration_secs = 300

[sinks.otlp_lake_metrics.request.headers]
Authorization = "Bearer ${NANO_OTEL_LAKE_INGEST_TOKEN:-legacy-disabled-legacy-disabled}"
Content-Type = "application/x-ndjson"

[sinks.otlp_lake_metrics.healthcheck]
enabled = false

# Contract tests run with `vector test` after enabling this overlay. They pin
# the object-valued native event and ensure tenant identity never enters the
# producer-controlled row.
[[tests]]
name = "otlp lake span envelope is native and tenantless"

[tests.input]
insert_at = "otlp_lake_spans_envelope"
type = "log"

[tests.input.log_fields]
event = '''{"traceId":"0123456789abcdef0123456789abcdef","spanId":"0123456789abcdef","startTimeUnixNano":"1786572000000000000","name":"GET /health"}'''

[[tests.outputs]]
extract_from = "otlp_lake_spans_envelope"

[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.schema_version, "nano-otlp-lake-v1")
assert_eq!(.dataset, "spans")
assert_eq!(.source_type, "otlp_trace")
assert!(is_string(.ingest_time_unix_nano))
assert_eq!(.event.traceId, "0123456789abcdef0123456789abcdef")
assert_eq!(.event.name, "GET /health")
assert!(!exists(.tenant_id))
'''

[[tests]]
name = "otlp lake histogram envelope preserves native metric semantics"

[tests.input]
insert_at = "otlp_lake_metrics_envelope"
type = "log"

[tests.input.log_fields]
name = "http.server.request.duration"
unit = "ms"
kind = "incremental"
timestamp = "2026-08-12T22:00:00Z"
aggregated_histogram = { count = 7, sum = 130.0, buckets = [{ count = 2, upper_limit = 10.0 }, { count = 3, upper_limit = 50.0 }, { count = 2, upper_limit = 100.0 }] }
tags = { route = "/checkout", "resource.service.name" = "api" }

[[tests.outputs]]
extract_from = "otlp_lake_metrics_envelope"

[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.schema_version, "nano-otlp-lake-v1")
assert_eq!(.dataset, "metrics")
assert_eq!(.source_type, "otlp_metric")
assert!(is_string(.ingest_time_unix_nano))
assert_eq!(.event.name, "http.server.request.duration")
assert_eq!(.event.unit, "ms")
assert_eq!(.event.type, "histogram")
assert_eq!(.event.aggregationTemporality, 1)
assert_eq!(.event.count, 7)
assert_eq!(.event.sum, 130.0)
assert_eq!(.event.bucketCounts, [2, 3, 2])
assert_eq!(.event.explicitBounds, [10.0, 50.0])
assert_eq!(.event.attributes[0].key, "route")
assert_eq!(.event.resource.attributes[0].key, "service.name")
assert!(!exists(.tenant_id))
'''

[[tests]]
name = "otlp lake metric envelope keeps a data-point attribute named host"

[tests.input]
insert_at = "otlp_lake_metrics_envelope"
type = "log"

[tests.input.log_fields]
name = "system.cpu.utilization"
kind = "absolute"
timestamp = "2026-08-12T22:00:00Z"
host = "node-a"
gauge = { value = 0.5 }
tags = { "resource.service.name" = "node-exporter" }

[[tests.outputs]]
extract_from = "otlp_lake_metrics_envelope"

[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.event.type, "gauge")
assert_eq!(.event.asDouble, 0.5)
assert_eq!(.event.attributes, [{ "key": "host", "value": { "stringValue": "node-a" } }])
assert_eq!(.event.resource.attributes[0].key, "service.name")
'''

[[tests]]
name = "otlp lake summary fans out to quantile gauges plus count and sum"

[tests.input]
insert_at = "otlp_lake_metrics_envelope"
type = "log"

[tests.input.log_fields]
name = "go_gc_duration_seconds"
kind = "absolute"
timestamp = "2026-08-12T22:00:00Z"
aggregated_summary = { count = 10, sum = 0.42, quantiles = [{ quantile = 0.5, value = 0.03 }, { quantile = 0.99, value = 0.095 }] }
tags = { job = "api", "resource.service.name" = "api" }

[[tests.outputs]]
extract_from = "otlp_lake_metrics_envelope"

[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.schema_version, "nano-otlp-lake-v1")
assert_eq!(.dataset, "metrics")
name = string!(.event.name)
assert!(includes(["go_gc_duration_seconds", "go_gc_duration_seconds_count", "go_gc_duration_seconds_sum"], name))
if name == "go_gc_duration_seconds" {
    assert_eq!(.event.type, "gauge")
    assert_eq!(.event.attributes[0].key, "job")
    assert_eq!(.event.attributes[1].key, "quantile")
    assert!(includes(["0.5", "0.99"], .event.attributes[1].value.stringValue))
} else {
    assert_eq!(.event.type, "sum")
    assert_eq!(.event.aggregationTemporality, 2)
    assert!(includes([10.0, 0.42], .event.asDouble))
    assert_eq!(length!(.event.attributes), 1)
}
assert_eq!(.event.resource.attributes[0].key, "service.name")
assert!(!exists(.tenant_id))
'''

[[tests]]
name = "otlp lake metric envelope rejects a variant with no native point shape"
no_outputs_from = ["otlp_lake_metrics_envelope"]

[tests.input]
insert_at = "otlp_lake_metrics_envelope"
type = "log"

[tests.input.log_fields]
name = "unique.users"
kind = "incremental"
timestamp = "2026-08-12T22:00:00Z"
set = { values = ["a", "b"] }
