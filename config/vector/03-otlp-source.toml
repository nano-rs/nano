# OpenTelemetry (OTLP) Source — NAN-1528
# =============================================================================
# SYNC: the managed product generates its own copy of the traces/metrics
# event-type conversion + OTLP/JSON reshape (NAN-1576) in the nano-main repo
# (apps/api/src/services/vector-otlp.ts, which adds TLS + a token gate). The two
# repos can't share a literal — KEEP THEM IN SYNC. This copy is pinned by the
# `otlp_traces_metrics_ingest_is_wired` test in deploy.rs.
# =============================================================================
# Receives OTLP over gRPC (:4317) and HTTP (:4318) — the two standard OTLP
# ports. Vector's `opentelemetry` source decodes the protobuf/JSON payloads and
# fans them out onto three named outputs: `.logs`, `.traces`, `.metrics`.
#
# Architecture (mirrors the OCSF Null-table + MV pattern):
#   * Traces  -> wrapped as { event, timestamp, source_type="otlp_trace" } and
#                written to `otel_spans_raw` (ENGINE=Null). A ClickHouse
#                MATERIALIZED VIEW (clickhouse/138_otel_spans.sql) does the
#                OTLP->column mapping ONCE, in SQL, into `otel_spans`.
#   * Metrics -> wrapped the same way into `otel_metrics_raw` (ENGINE=Null);
#                its MV (clickhouse/140_otel_metrics.sql) derives `otel_metrics`.
#   * Logs    -> OTLP LogRecords are still logs, so they ride the existing
#                UDM/OCSF logs lane: tagged `source_type="otlp_log"` and fed
#                into `source_router` (see router.rs base inputs), where a
#                deployed parser's `match_values` claims them like any other
#                source_type. We add trace_id/span_id for correlation.
#
# ONE row == ONE record (one span / one log record / one metric data point).
# The raw table is the ONLY contract: a direct producer (Tenzir/Cribl/native
# OTLP collector exporter) that POSTs the identical
# { event: <OTLP JSON for one record>, timestamp, source_type } shape to the
# `otel_spans_raw` / `otel_metrics_raw` tables reuses this exact lane — no
# Vector required. The MV mapping is shared by both paths.
#
# Auth: the OTLP source has no shared-token gate here (OTLP exporters generally
# terminate auth at the collector / LB tier, like the Vector-native :6000 and
# HEC :8088 sources). Front it with the LB/mTLS in untrusted networks.
# =============================================================================

[sources.otlp_ingest]
type = "opentelemetry"

[sources.otlp_ingest.grpc]
address = "0.0.0.0:4317"

[sources.otlp_ingest.http]
address = "0.0.0.0:4318"

# =============================================================================
# Traces -> spans raw table (NAN-1576)
# Vector's `opentelemetry` source decodes OTLP spans into a Vector-native shape:
# snake_case keys (`trace_id`/`span_id`/`parent_span_id`/`start_time_unix_nano`),
# RFC3339-string timestamps, and FLAT attribute maps (`{k: v}`) rather than the
# OTLP/JSON the `otel_spans` MV (clickhouse/138_otel_spans.sql) reads (camelCase
# `traceId`/`startTimeUnixNano`, epoch-nano strings, KeyValue ARRAYS). Translate
# back to OTLP/JSON so the MV's JSONExtract mapping fires. `encode_json` of the
# rebuilt object is the raw-table contract.
# =============================================================================
# Vector's `opentelemetry` source emits spans as TRACE-type events, but the
# `clickhouse` sink only accepts LOG events and silently filters traces out at
# its input (confirmed: sink received_events_total stays 0; `remap` preserves
# the event type so it can't bridge the gap). `trace_to_log` is the dedicated
# converter — re-emit each span as a LOG event, then reshape to OTLP/JSON below.
[transforms.otlp_traces_to_log]
type = "trace_to_log"
inputs = ["otlp_ingest.traces"]

[transforms.otlp_traces_prep]
type = "remap"
inputs = ["otlp_traces_to_log"]
source = '''
ts = .timestamp
if !is_timestamp(ts) { ts = .start_time_unix_nano }
if !is_timestamp(ts) { ts = now() }

# RFC3339/timestamp -> epoch-nanos string (the MV parses with
# toUInt64OrZero(JSONExtractString(...)) so a numeric string is required).
# O2: missing/unparseable nanos fall back to the event ingest timestamp (ts,
# always a real timestamp above) — NOT "0", which the MV maps to 1970-01-01 and
# the spans table's 30d TTL then silently reaps.
fallback_nanos = to_string(to_unix_timestamp(ts, unit: "nanoseconds") ?? 0)

start_nanos = fallback_nanos
st = .start_time_unix_nano
if is_timestamp(st) {
    start_nanos = to_string(to_unix_timestamp(st, unit: "nanoseconds") ?? 0)
} else if is_integer(st) {
    start_nanos = to_string(st) ?? fallback_nanos
} else if is_string(st) {
    # O2: accept RFC3339 with a numeric offset (+00:00) via %+, not only the Z
    # form; on parse failure keep the ingest-timestamp fallback (never "0").
    pt, err = parse_timestamp(st, "%+")
    if err != null { pt, err = parse_timestamp(st, "%Y-%m-%dT%H:%M:%S%.fZ") }
    if err == null { start_nanos = to_string(to_unix_timestamp(pt, unit: "nanoseconds")) }
}

end_nanos = fallback_nanos
et = .end_time_unix_nano
if is_timestamp(et) {
    end_nanos = to_string(to_unix_timestamp(et, unit: "nanoseconds") ?? 0)
} else if is_integer(et) {
    end_nanos = to_string(et) ?? fallback_nanos
} else if is_string(et) {
    pt2, err2 = parse_timestamp(et, "%+")
    if err2 != null { pt2, err2 = parse_timestamp(et, "%Y-%m-%dT%H:%M:%S%.fZ") }
    if err2 == null { end_nanos = to_string(to_unix_timestamp(pt2, unit: "nanoseconds")) }
}

# Flat attribute maps -> OTLP KeyValue arrays the MV's arrayFirst()/JSONExtract
# idiom understands. Span attributes and resource attributes are separate arrays.
# O38: non-scalar (array/object) attribute values are JSON-encoded rather than
# collapsed to "" so structured attrs survive round-trip.
attrs = []
for_each(object(.attributes) ?? {}) -> |k, v| {
    sv = if is_object(v) || is_array(v) { encode_json(v) } else { to_string(v) ?? "" }
    attrs = push(attrs, { "key": k, "value": { "stringValue": sv } })
}
res_attrs = []
for_each(object(.resources) ?? {}) -> |k, v| {
    sv = if is_object(v) || is_array(v) { encode_json(v) } else { to_string(v) ?? "" }
    res_attrs = push(res_attrs, { "key": k, "value": { "stringValue": sv } })
}

# O38: re-encode span events + links to OTLP/JSON so they are preserved. The MV
# stores JSONExtractRaw(event,'events') into the events column; the rebuilt
# object previously had no events/links key, so every Vector-lane span lost its
# events (incl. SDK exception events) and links.
events = []
for_each(array(.events) ?? []) -> |_ie, ev| {
    ev_attrs = []
    for_each(object(ev.attributes) ?? {}) -> |k, v| {
        sv = if is_object(v) || is_array(v) { encode_json(v) } else { to_string(v) ?? "" }
        ev_attrs = push(ev_attrs, { "key": k, "value": { "stringValue": sv } })
    }
    events = push(events, {
        "timeUnixNano": to_string(ev.time_unix_nano) ?? "",
        "name": to_string(ev.name) ?? "",
        "attributes": ev_attrs
    })
}
links = []
for_each(array(.links) ?? []) -> |_il, ln| {
    ln_attrs = []
    for_each(object(ln.attributes) ?? {}) -> |k, v| {
        sv = if is_object(v) || is_array(v) { encode_json(v) } else { to_string(v) ?? "" }
        ln_attrs = push(ln_attrs, { "key": k, "value": { "stringValue": sv } })
    }
    links = push(links, {
        "traceId": to_string(ln.trace_id) ?? "",
        "spanId": to_string(ln.span_id) ?? "",
        "attributes": ln_attrs
    })
}

otlp = {
    "traceId": to_string(.trace_id) ?? "",
    "spanId": to_string(.span_id) ?? "",
    "parentSpanId": to_string(.parent_span_id) ?? "",
    "name": to_string(.name) ?? "",
    "kind": to_int(.kind) ?? 0,
    "startTimeUnixNano": start_nanos,
    "endTimeUnixNano": end_nanos,
    "status": {
        "code": to_int(.status.code) ?? 0,
        "message": to_string(.status.message) ?? ""
    },
    "attributes": attrs,
    "events": events,
    "links": links,
    "resource": { "attributes": res_attrs }
}

. = {
    "event": encode_json(otlp),
    "timestamp": ts,
    "source_type": "otlp_trace"
}
'''

# =============================================================================
# Metrics -> metrics raw table (NAN-1576)
# Vector's `opentelemetry` source decodes OTLP metrics into Vector-native METRIC
# events (`{name, tags, timestamp, kind, gauge|counter|... :{value}}`), NOT the
# OTLP/JSON the `otel_metrics` MV (clickhouse/140_otel_metrics.sql) reads — and a
# `clickhouse` (logs) sink can't ingest metric events at all. So `metric_to_log`
# turns each metric into a log event, then `otlp_metrics_prep` reshapes Vector's
# metric shape back into the OTLP/JSON `event` the MV expects (camelCase keys,
# epoch-nanos `timeUnixNano`, KeyValue-array attributes). One data point per row.
# =============================================================================
[transforms.otlp_metrics_to_log]
type = "metric_to_log"
inputs = ["otlp_ingest.metrics"]

[transforms.otlp_metrics_prep]
type = "remap"
inputs = ["otlp_metrics_to_log"]
source = '''
ts = .timestamp
if !is_timestamp(ts) { ts = now() }
nanos = to_string(to_unix_timestamp(ts, unit: "nanoseconds") ?? 0)

# Vector flattens metric labels into `.tags`; `resource.<k>` tags are resource
# attributes, the rest are data-point attributes. Rebuild both as OTLP KeyValue
# arrays the MV's JSONExtract path understands.
attrs = []
res_attrs = []
tags = object(.tags) ?? {}
for_each(tags) -> |k, v| {
    if starts_with(k, "resource.") {
        rk = replace(k, "resource.", "")
        res_attrs = push(res_attrs, { "key": rk, "value": { "stringValue": to_string(v) ?? "" } })
    } else {
        attrs = push(attrs, { "key": k, "value": { "stringValue": to_string(v) ?? "" } })
    }
}

otlp = {
    "name": to_string(.name) ?? "",
    "timeUnixNano": nanos,
    "attributes": attrs,
    "resource": { "attributes": res_attrs }
}

# O26: Vector's metric kind carries temporality — `absolute` == cumulative,
# `incremental` == delta. Map to OTLP aggregationTemporality (2 CUMULATIVE,
# 1 DELTA, 0 UNSPECIFIED) so sum/histogram consumers can delta-decode running
# totals instead of summing cumulative counters (SDKs export CUMULATIVE sums by
# default).
mkind = to_string(.kind) ?? ""
temporality = if mkind == "absolute" { 2 } else if mkind == "incremental" { 1 } else { 0 }

# metric_to_log emits the value under .gauge / .counter / .histogram keyed by the
# metric kind. Map to the OTLP `type` discriminator + value the MV reads.
if exists(.gauge) {
    otlp = set!(otlp, ["type"], "gauge")
    otlp = set!(otlp, ["asDouble"], to_float(.gauge.value) ?? 0.0)
} else if exists(.counter) {
    otlp = set!(otlp, ["type"], "sum")
    otlp = set!(otlp, ["asDouble"], to_float(.counter.value) ?? 0.0)
    otlp = set!(otlp, ["aggregationTemporality"], temporality)
# metric_to_log emits histograms under `aggregated_histogram`
# ({buckets:[{count, upper_limit}], count, sum}).
} else if exists(.aggregated_histogram) {
    otlp = set!(otlp, ["type"], "histogram")
    otlp = set!(otlp, ["aggregationTemporality"], temporality)
    otlp = set!(otlp, ["count"], to_int(.aggregated_histogram.count) ?? 0)
    otlp = set!(otlp, ["sum"], to_float(.aggregated_histogram.sum) ?? 0.0)
    # O25: OTLP requires bucketCounts to hold exactly ONE more element than
    # explicitBounds — the terminal (+Inf) bucket has a count but no explicit
    # bound. Emit every bucket's count, but exclude the last bucket's bound: its
    # upper_limit is +Inf, which can't JSON-encode (-> null -> CH reads 0.0 and
    # corrupts bound ordering).
    buckets = array(.aggregated_histogram.buckets) ?? []
    last_bucket = length(buckets) - 1
    bc = []
    eb = []
    for_each(buckets) -> |i, b| {
        bc = push(bc, to_int(b.count) ?? 0)
        if i < last_bucket {
            eb = push(eb, to_float(b.upper_limit) ?? 0.0)
        }
    }
    otlp = set!(otlp, ["bucketCounts"], bc)
    otlp = set!(otlp, ["explicitBounds"], eb)
} else {
    otlp = set!(otlp, ["type"], "gauge")
    otlp = set!(otlp, ["asDouble"], 0.0)
}

. = {
    "event": encode_json(otlp),
    "timestamp": ts,
    "source_type": "otlp_metric"
}
'''

# =============================================================================
# Logs -> existing UDM/OCSF logs lane
# OTLP LogRecords are normalized like any other log: tag the source_type so a
# deployed parser's match_values can claim them, lift the body into `.message`,
# and surface trace_id/span_id at top level for the logs-table correlation
# columns (clickhouse/141_logs_otel_correlation.sql). This transform is wired
# into `source_router` as an always-on base input (see
# nanosiem-core/src/parsers/vector_config/router.rs::base_router_inputs).
# =============================================================================
[transforms.otlp_logs_prep]
type = "remap"
inputs = ["otlp_ingest.logs"]
source = '''
.source_type = "otlp_log"
# O37: honest provenance, not a token-verified claim. Open OTLP ports are by
# design in open core (the deployer fronts them with LB/mTLS for managed); this
# value only records the ingest lane so downstream can distinguish OTLP-lane
# logs from token-gated HTTP-lane events instead of them reading "authenticated".
.auth_status = "otlp"
.content_format = "otlp"
.routing_timestamp = now()

# Vector decodes the OTLP LogRecord body into `.message`; keep whatever is there
# and fall back to a JSON encode of the record so nothing is lost.
if !exists(.message) || !is_string(.message) {
    .message = encode_json(.)
}

# NAN-1556: severity. Prefer the textual level; else map the numeric OTLP
# SeverityNumber (1-24) to the canonical band. Lands in the `severity` column
# (carried through the generic path by prepare_output / clickhouse_mapping).
sev = to_string(.severity_text) ?? ""
if sev == "" {
    sn = to_int(.severity_number) ?? 0
    sev = if sn >= 21 { "Fatal" } else if sn >= 17 { "Error" } else if sn >= 13 { "Warn" } else if sn >= 9 { "Info" } else if sn >= 5 { "Debug" } else if sn >= 1 { "Trace" } else { "" }
}
.severity = sev

if !is_object(.metadata) {
    .metadata = {}
}

# NAN-1556: resource service.name -> src_host (the canonical UDM host slot the
# normalize pipeline already resolves to the src_host column — reuse, don't
# special-case a new column).
svc = .resources."service.name"
if svc != null {
    .metadata.src_host = to_string(svc) ?? ""
}

# NAN-1556: resource + log-record attributes -> the `ext` JSON tail (searchable
# by key, no enumeration). Resource attrs first so a same-named log attribute
# wins. Values may be nested; the JSON ext column stores them as-is.
tail = {}
if is_object(.resources) { tail = merge(tail, object!(.resources)) }
if is_object(.attributes) { tail = merge(tail, object!(.attributes)) }
.ext = tail

# Correlation ids — OTLP carries them as `.trace_id` / `.span_id`. Downcase to
# match the lower(col) convention the logs table compares on.
.trace_id = downcase(to_string(.trace_id) ?? "")
.span_id = downcase(to_string(.span_id) ?? "")

.metadata.forwarded_via = "otlp"
'''

# =============================================================================
# ClickHouse Sink — spans raw (ENGINE=Null; MV derives otel_spans)
# COPIED from the `clickhouse_logs` sink (sources/parsers/_pipeline.toml):
# basic auth, gzip, memory buffer, batch, adaptive concurrency. Table is
# env-overridable.
# O3: end-to-end acknowledgements are ON, so the OTLP source only 200-acks an
# exporter once the CH insert is confirmed — a down/overloaded CH now returns a
# retryable error to the exporter instead of silently acking-then-dropping.
# buffer.when_full = "drop_newest" is kept ONLY as the last-resort shed.
# O24: batch idempotency (dedup of a batch re-POSTed after a client-side request
# timeout) is NOT achievable from the Vector clickhouse sink — it exposes no
# per-batch, content-derived insert_deduplication_token, and the staging tables
# are ENGINE=Null so block-hash dedup can't apply. The durable fix is a
# ReplacingMergeTree keyed (trace_id, span_id, start_time) for spans /
# (metric identity, timeUnixNano) for metrics in clickhouse/138 & 140 — tracked
# outside this file (see O24 in OBSERVABILITY_AUDIT_FINDINGS.md).
# =============================================================================
[sinks.clickhouse_otel_spans]
type = "clickhouse"
inputs = ["otlp_traces_prep"]

endpoint = "${CLICKHOUSE_URL:-http://clickhouse:8123}"
database = "${CLICKHOUSE_DATABASE:-nanosiem}"
table = "${CLICKHOUSE_OTEL_SPANS_TABLE:-otel_spans_raw}"

auth.strategy = "basic"
auth.user = "${CLICKHOUSE_USER:-nanosiem}"
auth.password = "${CLICKHOUSE_PASSWORD:-nanosiem}"

compression = "gzip"
date_time_best_effort = true
skip_unknown_fields = true

# NAN-1728 (C4/W10): async-insert block dedup for the raw span lane.
# `deduplicate = true` emits `async_insert_deduplicate=1` so an identical batch
# re-POSTed after an HTTP timeout is dropped at the async-insert layer instead of
# duplicating (otel_spans_raw is ENGINE=Null → MV → otel_spans). Its MV-cascade
# companion `deduplicate_blocks_in_dependent_materialized_views=1` is set in the
# server-side ingestion profile (query_limits.xml) — Vector's clickhouse sink
# cannot express it (query_settings exposes only async_insert_settings, and
# endpoint query params corrupt the sink's own generated query string). These
# reduce but do not eliminate dupes on cross-shard retries — the raw Null lane
# has no content-hash wrapper to re-pin a retry to the origin shard, so this lane
# is at-least-once by construction (O24). Harmless on single-shard.
[sinks.clickhouse_otel_spans.query_settings.async_insert_settings]
deduplicate = true

[sinks.clickhouse_otel_spans.buffer]
type = "memory"
max_events = 100000
# O3: last-resort shed only — with acknowledgements on, drops happen solely when
# this in-memory buffer is saturated, and the exporter still sees a retryable
# error for anything not accepted.
when_full = "drop_newest"

# O3: end-to-end acknowledgements — the OTLP source withholds its 200/OK until
# this CH insert is confirmed, so exporters retry on failure instead of the
# source acking success while the batch is dropped.
[sinks.clickhouse_otel_spans.acknowledgements]
enabled = true

[sinks.clickhouse_otel_spans.batch]
max_bytes = ${VECTOR_BATCH_MAX_BYTES:-52428800}
max_events = ${VECTOR_BATCH_MAX_EVENTS:-50000}
timeout_secs = ${VECTOR_BATCH_TIMEOUT_SECS:-10}

[sinks.clickhouse_otel_spans.request]
concurrency = "adaptive"
timeout_secs = 120
retry_initial_backoff_secs = 1
retry_max_duration_secs = 300

# =============================================================================
# ClickHouse Sink — metrics raw (ENGINE=Null; MV derives otel_metrics)
# O3: end-to-end acknowledgements ON (see the spans sink note above); drop_newest
# stays only as the last-resort shed. O24: same insert_deduplication_token
# limitation — the durable dedup fix is a ReplacingMergeTree in clickhouse/140.
# =============================================================================
[sinks.clickhouse_otel_metrics]
type = "clickhouse"
inputs = ["otlp_metrics_prep"]

endpoint = "${CLICKHOUSE_URL:-http://clickhouse:8123}"
database = "${CLICKHOUSE_DATABASE:-nanosiem}"
table = "${CLICKHOUSE_OTEL_METRICS_TABLE:-otel_metrics_raw}"

auth.strategy = "basic"
auth.user = "${CLICKHOUSE_USER:-nanosiem}"
auth.password = "${CLICKHOUSE_PASSWORD:-nanosiem}"

compression = "gzip"
date_time_best_effort = true
skip_unknown_fields = true

# NAN-1728 (C4/W10): async-insert block dedup for the raw metrics lane — see the
# clickhouse_otel_spans sink note above. `deduplicate = true` emits
# `async_insert_deduplicate=1` (otel_metrics_raw is ENGINE=Null → MV →
# otel_metrics); the MV-cascade companion setting lives server-side in
# query_limits.xml. Reduces (not eliminates) cross-shard-retry dupes; harmless
# on single-shard.
[sinks.clickhouse_otel_metrics.query_settings.async_insert_settings]
deduplicate = true

[sinks.clickhouse_otel_metrics.buffer]
type = "memory"
max_events = 100000
# O3: last-resort shed only — see the spans sink buffer note above.
when_full = "drop_newest"

# O3: end-to-end acknowledgements — exporters get a retryable error on CH
# failure instead of a silent ack-then-drop.
[sinks.clickhouse_otel_metrics.acknowledgements]
enabled = true

[sinks.clickhouse_otel_metrics.batch]
max_bytes = ${VECTOR_BATCH_MAX_BYTES:-52428800}
max_events = ${VECTOR_BATCH_MAX_EVENTS:-50000}
timeout_secs = ${VECTOR_BATCH_TIMEOUT_SECS:-10}

[sinks.clickhouse_otel_metrics.request]
concurrency = "adaptive"
timeout_secs = 120
retry_initial_backoff_secs = 1
retry_max_duration_secs = 300
