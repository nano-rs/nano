# Deduplication Transform for NanoSIEM
#
# This transform removes duplicate log entries within a configurable time window.
# Requirement 1.2: Deduplicate logs before storage

# =============================================================================
# Content-Based Deduplication
# =============================================================================
# Deduplicates based on raw_content field
# Keeps the first occurrence of each unique log within the cache window

[transforms.dedupe_content]
type = "dedupe"
inputs = ["normalize_logs"]

# Match on raw content for exact duplicate detection
fields.match = ["raw_content"]

# Cache configuration
# num_events: Maximum number of unique events to track
# Higher values = better deduplication but more memory usage
cache.num_events = 10000

