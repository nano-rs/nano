# Source Type Router for NanoSIEM
#
# This configuration routes logs to appropriate parsers based on source type.
# Source type is determined from:
# 1. X-Source-Type header (highest priority)
# 2. source_type field in request body
# 3. Default to generic parser when unspecified
#
# Requirements: 5.1, 5.2, 5.3

# =============================================================================
# Source Type Extraction Transform
# =============================================================================
# Extracts and normalizes source type from headers or body
# Runs after request validation to ensure authenticated, validated requests

[transforms.source_type_extract]
type = "remap"
inputs = ["request_validation"]
source = '''
# =============================================================================
# Step 1: Extract Source Type from Headers (Priority 1)
# =============================================================================
# Requirement 5.1: Route based on X-Source-Type header

source_type = "unknown"

# Check X-Source-Type header (case-insensitive)
if exists(."X-Source-Type") {
    source_type = downcase(to_string(."X-Source-Type") ?? "unknown")
} else if exists(."x-source-type") {
    source_type = downcase(to_string(."x-source-type") ?? "unknown")
} else if is_object(.headers) {
    if exists(.headers."X-Source-Type") {
        source_type = downcase(to_string(.headers."X-Source-Type") ?? "unknown")
    } else if exists(.headers."x-source-type") {
        source_type = downcase(to_string(.headers."x-source-type") ?? "unknown")
    }
}

# =============================================================================
# Step 2: Fall Back to Body Field (Priority 2)
# =============================================================================
# Requirement 5.2: Use source_type field in body if no header present

if source_type == "unknown" {
    # Check top-level source_type field
    if exists(.source_type) && is_string(.source_type) {
        source_type = downcase(to_string(.source_type) ?? "unknown")
    }
    # Check in message object (for nested JSON)
    else if is_object(.message) && exists(.message.source_type) {
        source_type = downcase(to_string(.message.source_type) ?? "unknown")
    }
    # Check in data object (common wrapper)
    else if is_object(.data) && exists(.data.source_type) {
        source_type = downcase(to_string(.data.source_type) ?? "unknown")
    }
    # Check in log object
    else if is_object(.log) && exists(.log.source_type) {
        source_type = downcase(to_string(.log.source_type) ?? "unknown")
    }
}

# =============================================================================
# Step 3: Normalize Source Type
# =============================================================================
# Map common aliases to canonical source types

# Windows Event Log aliases
if source_type == "winlog" || source_type == "windows" || source_type == "winevt" {
    source_type = "windows_event"
}

# Apache aliases
if source_type == "apache_access" || source_type == "httpd" {
    source_type = "apache"
}

# AWS CloudTrail aliases
if source_type == "cloudtrail" || source_type == "aws_ct" {
    source_type = "aws_cloudtrail"
}

# Syslog aliases
if source_type == "rsyslog" || source_type == "syslog-ng" {
    source_type = "syslog"
}

# Firewall aliases
if source_type == "pan" || source_type == "panos" {
    source_type = "palo_alto"
}
if source_type == "asa" || source_type == "cisco_firewall" {
    source_type = "cisco_asa"
}
if source_type == "fortigate" || source_type == "fgt" {
    source_type = "fortinet"
}

# Set the normalized source type
.source_type = source_type

# Add routing metadata
.routing_timestamp = now()
.routing_source = "source_type_extract"
'''

# =============================================================================
# Source Type Router
# =============================================================================
# Routes logs to appropriate parsers based on source type
# Requirement 5.3: Default to generic parser when unspecified

[transforms.source_router]
type = "route"
inputs = ["source_type_extract"]

[transforms.source_router.route]
# Endpoint category parsers
windows_event = '.source_type == "windows_event"'
sysmon = '.source_type == "sysmon"'

# Network category parsers
palo_alto = '.source_type == "palo_alto"'
fortinet = '.source_type == "fortinet"'
cisco_asa = '.source_type == "cisco_asa"'
syslog = '.source_type == "syslog"'

# Cloud category parsers
aws_cloudtrail = '.source_type == "aws_cloudtrail"'
aws_guardduty = '.source_type == "aws_guardduty"'
azure_activity = '.source_type == "azure_activity"'
azure_signin = '.source_type == "azure_signin"'

# Identity category parsers
okta = '.source_type == "okta"'

# Application category parsers
apache = '.source_type == "apache"'
nginx = '.source_type == "nginx"'

# Generic/default route for unknown source types
# Requirement 5.3: Default to generic parser when unspecified
generic = 'true'

# =============================================================================
# Generic Parser (Default)
# =============================================================================
# Handles logs with unknown or unspecified source types
# Requirement 5.3: Default to generic parser when unspecified

[transforms.generic_parser]
type = "remap"
inputs = ["source_router.generic"]
source = '''
# =============================================================================
# Generic Log Parser
# =============================================================================
# Processes logs that don't match any specific parser
# Attempts basic field extraction and UDM normalization

# Store raw content
.raw_content = to_string(.message) ?? to_string(encode_json(.))

# Initialize metadata
.metadata = {}

# Try to parse message as JSON if it looks like JSON
if is_string(.message) && starts_with(.message, "{") {
    parsed, err = parse_json(.message)
    if err == null {
        .metadata = parsed
    }
} else if is_object(.message) {
    .metadata = .message
}

# Initialize UDM fields
.udm = {}

# =============================================================================
# Basic UDM Field Extraction
# =============================================================================

# Source IP - check common field names
.udm.src_ip = .metadata.src_ip ?? .metadata.source_ip ?? .metadata.src ?? 
              .metadata.client_ip ?? .metadata.clientip ?? .metadata.remote_addr ?? null

# Destination IP
.udm.dest_ip = .metadata.dest_ip ?? .metadata.destination_ip ?? .metadata.dst ?? 
               .metadata.server_ip ?? .metadata.serverip ?? null

# Source Host
.udm.src_host = .metadata.src_host ?? .metadata.source_host ?? .metadata.hostname ?? 
                .metadata.host ?? null

# Destination Host
.udm.dest_host = .metadata.dest_host ?? .metadata.destination_host ?? null

# Source Port
src_port = .metadata.src_port ?? .metadata.source_port ?? null
if is_string(src_port) { src_port = to_int(src_port) ?? null }
.udm.src_port = src_port

# Destination Port
dest_port = .metadata.dest_port ?? .metadata.destination_port ?? null
if is_string(dest_port) { dest_port = to_int(dest_port) ?? null }
.udm.dest_port = dest_port

# Protocol
.udm.protocol = .metadata.protocol ?? .metadata.proto ?? null

# User
.udm.user = .metadata.user ?? .metadata.username ?? .metadata.user_name ?? null

# Action
.udm.action = .metadata.action ?? .metadata.event_type ?? .metadata.event ?? null

# Status
.udm.status = .metadata.status ?? .metadata.result ?? .metadata.outcome ?? null

# Process fields
.udm.process_name = .metadata.process_name ?? .metadata.program ?? .metadata.appname ?? null
.udm.process_id = .metadata.process_id ?? .metadata.pid ?? null
.udm.command_line = .metadata.command_line ?? .metadata.cmdline ?? null

# File fields
.udm.file_path = .metadata.file_path ?? .metadata.path ?? null
.udm.file_name = .metadata.file_name ?? .metadata.filename ?? null
.udm.file_hash = .metadata.file_hash ?? .metadata.hash ?? null

# Timestamp
ts = .metadata.timestamp ?? .metadata."@timestamp" ?? .metadata.time ?? .timestamp ?? now()
if is_string(ts) {
    parsed_ts, err = parse_timestamp(ts, "%+")
    if err == null {
        ts = parsed_ts
    }
}
.udm.timestamp = to_string(to_timestamp(ts) ?? now())

# Mark as generically parsed
.metadata.parser_type = "generic"
.metadata.original_source_type = .source_type
.source_type = "generic"
'''

# =============================================================================
# Generic Parser Output
# =============================================================================
# Formats generic parser output for the sink

[transforms.generic_output]
type = "remap"
inputs = ["generic_parser"]
source = '''
# Flatten for PostgreSQL - standard NanoSIEM format
. = {
    "timestamp": .udm.timestamp ?? to_string(now()),
    "raw_content": .raw_content,
    "metadata": encode_json(.metadata ?? {}),
    "source_type": .source_type ?? "generic",
    "src_ip": .udm.src_ip,
    "dest_ip": .udm.dest_ip,
    "src_host": .udm.src_host,
    "dest_host": .udm.dest_host,
    "src_port": .udm.src_port,
    "dest_port": .udm.dest_port,
    "protocol": .udm.protocol,
    "user": .udm.user,
    "action": .udm.action,
    "status": .udm.status,
    "process_name": .udm.process_name,
    "process_id": .udm.process_id,
    "command_line": .udm.command_line,
    "file_path": .udm.file_path,
    "file_name": .udm.file_name,
    "file_hash": .udm.file_hash
}
'''

