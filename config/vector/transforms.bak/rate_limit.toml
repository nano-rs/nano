# Rate Limiting Configuration for NanoSIEM
#
# This configuration provides rate limiting and request validation for HTTP ingestion.
# Implements per-IP rate limiting and request body size enforcement.
#
# Requirements: 3.1, 3.2, 3.3, 3.4

# =============================================================================
# Rate Limiting Transform
# =============================================================================
# Applies rate limiting to authenticated requests
# Uses Vector's throttle transform for overall rate limiting
#
# Note: Vector's http_server source handles body size limits via max_body_size
# This transform adds additional rate limiting at the event processing level

# =============================================================================
# Rate Limit Metadata Transform
# =============================================================================
# Adds rate limiting metadata and extracts client IP for tracking
# This runs after auth to ensure only authenticated requests are rate limited

[transforms.rate_limit_prep]
type = "remap"
inputs = ["auth_passthrough"]
source = '''
# =============================================================================
# Extract Client IP for Rate Limiting
# =============================================================================
# Vector's http_server source includes client IP in various fields
# depending on configuration and proxy headers

client_ip = null

# Check for X-Forwarded-For header (common with reverse proxies)
if exists(."X-Forwarded-For") {
    # X-Forwarded-For can contain multiple IPs, take the first (original client)
    xff = to_string(."X-Forwarded-For") ?? ""
    parts = split(xff, ",")
    if length(parts) > 0 {
        client_ip = strip_whitespace(parts[0]) ?? null
    }
} else if exists(.headers."X-Forwarded-For") {
    xff = to_string(.headers."X-Forwarded-For") ?? ""
    parts = split(xff, ",")
    if length(parts) > 0 {
        client_ip = strip_whitespace(parts[0]) ?? null
    }
}

# Check for X-Real-IP header
if client_ip == null {
    if exists(."X-Real-IP") {
        client_ip = to_string(."X-Real-IP") ?? null
    } else if exists(.headers."X-Real-IP") {
        client_ip = to_string(.headers."X-Real-IP") ?? null
    }
}

# Fall back to source address from Vector
if client_ip == null {
    if exists(.source_ip) {
        client_ip = to_string(.source_ip) ?? null
    } else if exists(.client_addr) {
        # client_addr may include port, extract just the IP
        addr = to_string(.client_addr) ?? ""
        # Handle IPv4:port format
        if contains(addr, ":") && !contains(addr, "[") {
            parts = split(addr, ":")
            if length(parts) >= 1 {
                client_ip = parts[0]
            }
        } else {
            client_ip = addr
        }
    }
}

# Set client_ip for rate limiting key
.client_ip = client_ip ?? "unknown"

# =============================================================================
# Add Rate Limit Metadata
# =============================================================================
.rate_limit_applied = true
.rate_limit_timestamp = now()
'''

# =============================================================================
# Throttle Transform - Per-IP Rate Limiting
# =============================================================================
# Requirement 3.1: Enforce configurable rate limit per source IP (default 1000 requests/second)
# Requirement 3.2: Return HTTP 429 Too Many Requests when exceeded
#
# The throttle transform limits the rate of events passing through.
# Events exceeding the rate are dropped with a log message.
# Using client_ip as the key enables per-IP rate limiting.

[transforms.rate_limit]
type = "throttle"
inputs = ["rate_limit_prep"]
# Maximum events per second per IP (1000 requests/second default)
threshold = 1000
# Time window for rate limiting (1 second)
window_secs = 1
# Key for rate limiting - use client IP for per-IP limiting
# If no client IP available, falls back to overall limiting
key_field = "client_ip"

# =============================================================================
# Rate Limited Events Router
# =============================================================================
# Routes events that pass rate limiting to the next stage
# Events that are throttled are logged and dropped by the throttle transform

[transforms.rate_limit_passthrough]
type = "remap"
inputs = ["rate_limit"]
source = '''
# Events reaching here have passed rate limiting
.rate_limited = false

# Clean up internal rate limiting fields (keep client_ip for logging)
del(.rate_limit_applied)
del(.rate_limit_timestamp)
'''

# =============================================================================
# Request Validation Transform
# =============================================================================
# Additional validation for request content
# Note: Body size is enforced by http_server's max_body_size setting (10MB)
# Vector automatically returns HTTP 413 Payload Too Large when exceeded
# This transform validates content structure

[transforms.request_validation]
type = "remap"
inputs = ["rate_limit_passthrough"]
source = '''
# =============================================================================
# Validate Request Content
# =============================================================================
# Requirement 3.5: Validate that incoming JSON contains required fields

validation_errors = []

# Check for minimum required structure
# At minimum, we need some content to process
if !exists(.message) && !exists(.raw_content) && !exists(.log) && !exists(.data) {
    # Check if the event itself has content
    event_str = encode_json(.) ?? ""
    if length(event_str) < 10 {
        validation_errors = push(validation_errors, "Empty or minimal content")
    }
}

# Store validation status
if length(validation_errors) > 0 {
    .validation_status = "warning"
    .validation_errors = validation_errors
} else {
    .validation_status = "valid"
}

# Mark as validated
.request_validated = true
'''
