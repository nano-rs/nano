# cargo-deny policy for the root workspace (NAN-5412, v2.0.27 "underlying libraries").
#
#   cargo deny check                      # what CI and the preflight hook run
#   cargo deny check advisories           # one section at a time
#
# The graph is every workspace member with all features on (open, enterprise and
# the app.nano.rs-only `platform` publishers), resolved for the Linux targets the
# release images ship on. nano-desktop is its own workspace and is not covered here.
#
# Rollout: advisories, licenses and sources are enforced (they are clean today, with
# the exceptions documented below). Duplicate versions are reported as warnings:
# the RustCrypto 0.10 -> 0.11 transition alone keeps ~60 duplicates until the
# majors land (see docs-internal/releases/v2.0.27-libraries-audit.md).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

# --------------------------------------------------------------------------------
[advisories]
# Every unmaintained notice for a crate we depend on, directly or not, is reported;
# an exception below needs a reason and the plan that removes it.
unmaintained = "all"
yanked = "warn"
ignore = [
    # zip 3.0.0: Critical/High path-traversal and extraction bugs, all in
    # ZipArchive::extract(). zip is compiled ONLY into the app.nano.rs platform
    # publishers (`--features platform`, platform/feed/adapters/convert.rs), which
    # read entries with ZipArchive::new + by_index and never call extract(). Never in
    # a customer image. Removed by the zip 3 -> 9 major (audit item M8).
    { id = "RUSTSEC-2026-0369", reason = "zip extract() only; platform publisher, never called (M8)" },
    { id = "RUSTSEC-2026-0429", reason = "zip extract() only; platform publisher, never called (M8)" },
    { id = "RUSTSEC-2026-0367", reason = "zip extract() only; platform publisher, never called (M8)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() only; platform publisher, never called (M8)" },
    # Unmaintained, no vulnerability. paste is a proc-macro reached only through
    # clickhouse 0.14 -> polonius-the-crab -> higher-kinded-types (compile time).
    # unsafe-libyaml comes with serde_yaml 0.9 (deprecated; connector specs, Sigma
    # import). Revisit with the clickhouse 0.15 major and a serde_yaml replacement.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro via clickhouse 0.14; no vuln" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, via serde_yaml 0.9; no vuln" },
]

# --------------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
# Permissive licenses, plus MPL-2.0 (file-level copyleft; vrl, cssparser, selectors,
# dtoa-short are used unmodified). No GPL/AGPL/SSPL from third parties: AGPL appears
# only on our own crates, which `private.ignore` skips.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[licenses.private]
# Our own crates (AGPL-3.0-or-later open core, LicenseRef-nano-proprietary
# enterprise) are `publish = false` or path-only; don't license-check them.
ignore = true

# --------------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true
highlight = "all"

# --------------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
