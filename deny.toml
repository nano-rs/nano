# cargo-deny policy for the root workspace (NAN-5412, v2.0.27 "underlying libraries").
#
#   cargo deny check                      # what CI and the preflight hook run
#   cargo deny check advisories           # one section at a time
#
# The graph is every workspace member with all features on (open, enterprise and
# the app.nano.rs-only `platform` publishers), resolved for the Linux targets the
# release images ship on. nano-desktop is its own workspace and is not covered here.
#
# Rollout: advisories, licenses and sources are enforced (they are clean today, with
# the exceptions documented below). Duplicate versions are reported as warnings:
# the RustCrypto 0.10 -> 0.11 transition alone keeps ~60 duplicates until the
# majors land (see docs-internal/releases/v2.0.27-libraries-audit.md).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

# --------------------------------------------------------------------------------
[advisories]
# Every unmaintained notice for a crate we depend on, directly or not, is reported;
# an exception below needs a reason and the plan that removes it.
unmaintained = "all"
yanked = "warn"
#
# Ignore entries carry a "review by" date in their reason. cargo-deny has no expiry
# field, so the date is a reminder: past it, re-check the advisory and the plan.
# An ignore that no longer matches anything shows as warning[advisory-not-detected];
# delete it then (the zip 3.x and paste entries went that way in NAN-5753).
ignore = [
    # Unmaintained, no vulnerability. unsafe-libyaml comes with serde_yaml 0.9
    # (deprecated; connector specs, Sigma import). Removed with a serde_yaml
    # replacement.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, via serde_yaml 0.9; no vuln. Review by 2027-02-20" },
    # NAN-5753: chrono and chrono-tz were declared unmaintained (chronotope/chrono#1768),
    # and humantime with them because it wraps chrono. No vulnerability, no fixed
    # version. None of the three can be removed by replacing our own use:
    #   chrono     workspace-wide (every crate's timestamps, sqlx chrono feature) and
    #              also reached through vrl, sqlx-core/postgres, cron, object_store,
    #              syslog_loose. Moving to jiff/time is a cross-crate migration that
    #              also needs those upstreams to move.
    #   chrono-tz  direct in nanosiem-core (2 files), but vrl 0.38 depends on it too,
    #              so dropping ours leaves it in the graph.
    #   humantime  not a direct dependency; only object_store 0.14 (enterprise
    #              archive tier) pulls it.
    # Plan: track upstream (vrl, sqlx, object_store, cron) moving off chrono, then
    # migrate our code to jiff in one pass. Re-check at every quarterly review.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no vuln; pervasive + via vrl/sqlx/cron/object_store (NAN-5753). Review by 2027-02-20" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained, no vuln; also via vrl 0.38 (NAN-5753). Review by 2027-02-20" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained (wraps chrono), no vuln; via object_store 0.14 only (NAN-5753). Review by 2027-02-20" },
]

# --------------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
# Permissive licenses, plus MPL-2.0 (file-level copyleft; vrl, cssparser, selectors,
# dtoa-short are used unmodified). No GPL/AGPL/SSPL from third parties: AGPL appears
# only on our own crates, which `private.ignore` skips.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[licenses.private]
# Our own crates (AGPL-3.0-or-later open core, LicenseRef-nano-proprietary
# enterprise) are `publish = false` or path-only; don't license-check them.
ignore = true

# --------------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true
highlight = "all"

# --------------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
