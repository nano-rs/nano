name: cisco_asa_ocsf
display_name: Cisco ASA (OCSF)
version: "1.2.0"
ocsf_version: "1.9.0"
description: >
  Preserves unconsumed parsed fields in redacted, dotted snake_case unmapped keys.
  Parses Cisco ASA / FTD syslog (%ASA-<sev>-<msgid>) into OCSF 1.9.0. Routes by
  message id: connection build/teardown, ACL permit/deny, NAT, ICMP and TCP
  drops -> Network Activity (4001); AAA, console/VPN login and device
  authentication -> Authentication (3002); IDS signature hits and threat
  detection -> Detection Finding (2004). Every other %ASA message, and any line
  the %ASA header regex does not match, still emits a well-formed Network
  Activity record with activity_id 99 and the raw line in `message`.
match_values:
  - cisco_asa
category: network
vendor: "Cisco"
product: "ASA"
parser_vrl: |
  # Cisco ASA -> OCSF 1.9.0 (4001 Network Activity / 3002 Authentication /
  # 2004 Detection Finding)

  raw_log = string!(.message)
  __raw_body = raw_log
  __source_kv = {}

  time_ms = to_int(to_unix_timestamp(now(), unit: "milliseconds"))
  dvc_host = ""
  working = raw_log

  # ---- syslog PRI ----
  pri_match, pri_err = parse_regex(working, r'^<(?P<pri>\d+)>(?P<body>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(pri_match))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if pri_err == null && pri_match != null { working = string!(pri_match.body) }

  # ---- syslog timestamp + optional hostname before %ASA ----
  sm, se = parse_regex(working, r'^(?P<ts>(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+(?:\d{4}\s+)?\d{2}:\d{2}:\d{2})\s*:?\s*(?P<host>[^\s:]+)?\s*:?\s*(?P<rest>%ASA-.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(sm))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if se == null && sm != null {
      ts_str = string!(sm.ts)
      ts, ts_err = parse_timestamp(ts_str, "%b %d %Y %H:%M:%S")
      if ts_err == null {
          time_ms = to_int(to_unix_timestamp(ts, unit: "milliseconds"))
      } else {
          ts2, ts_err2 = parse_timestamp(ts_str + " " + format_timestamp!(now(), "%Y"), "%b %d %H:%M:%S %Y")
          if ts_err2 == null { time_ms = to_int(to_unix_timestamp(ts2, unit: "milliseconds")) }
      }
      hv = to_string(sm.host)
      if hv != "" && hv != ":" { dvc_host = hv }
      working = string!(sm.rest)
  }

  # ---- %ASA-<sev>-<msgid>: <body> ----
  msg_id = ""
  msg_body = working
  sev_num = 6
  am, ae = parse_regex(working, r'%ASA-(?P<sev>\d)-(?P<msgid>\d+):\s*(?P<body>.*)$')
  # Capture parsed fields before mapping; omit structural raw-body captures.
  __capture = object(parse_json!(encode_json(am))) ?? {}
  __ignore = del(__capture.body)
  __ignore = del(__capture.content)
  __ignore = del(__capture.kvdata)
  __ignore = del(__capture.kvpart)
  __ignore = del(__capture.msg)
  __ignore = del(__capture.payload)
  __ignore = del(__capture.remainder)
  __ignore = del(__capture.rest)
  __ignore = del(__capture.sd)
  __source_kv = set!(__source_kv, ["header"], merge(object(get(__source_kv, ["header"]) ?? null) ?? {}, __capture))
  if ae == null && am != null {
      msg_id = string!(am.msgid)
      msg_body = string!(am.body)
      sev_num = to_int(am.sev) ?? 6
  }

  # syslog severity -> OCSF severity_id
  severity_id = 1
  severity = "Informational"
  if sev_num <= 2 { severity_id = 5; severity = "Critical" }
  if sev_num == 3 { severity_id = 4; severity = "High" }
  if sev_num == 4 { severity_id = 3; severity = "Medium" }
  if sev_num == 5 { severity_id = 2; severity = "Low" }

  # ---- accumulators ----
  route = "network"
  activity_id = 99
  activity_name = "Other"
  action_id = 3
  action = "Observed"
  disposition_id = 17
  disposition = "Logged"
  status_id = 1
  status_str = "Success"

  src_ip = ""
  src_port = 0
  dst_ip = ""
  dst_port = 0
  src_iface = ""
  dst_iface = ""
  proto = ""
  direction_id = 0
  conn_id = ""
  bytes_total = 0
  duration_s = 0
  hit_count = 0
  rule_name = ""
  user_name = ""
  vpn_group = ""
  remote_ip = ""
  assigned_ip = ""
  sig_id = ""
  sig_name = ""
  reason = ""
  nat_src_ip = ""
  nat_src_port = 0
  nat_dst_ip = ""
  nat_dst_port = 0
  icmp_type = ""
  icmp_code = ""
  desc = ""

  # ============================================================
  # 302013/302015/302020 Built connection
  # ============================================================
  if msg_id == "302013" || msg_id == "302015" || msg_id == "302020" {
      desc = "Built connection"
      activity_id = 1
      activity_name = "Open"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
      cm, ce = parse_regex(msg_body, r'Built\s+(?P<direction>inbound|outbound)\s+(?P<protocol>\w+)\s+connection\s+(?P<conn_id>\d+)\s+for\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s*(?:\x28(?P<src_nat_ip>[^/]+)/(?P<src_nat_port>\d+)\x29)?\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s*(?:\x28(?P<dst_nat_ip>[^/]+)/(?P<dst_nat_port>\d+)\x29)?')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(cm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ce == null && cm != null {
          d = downcase(string!(cm.direction))
          if d == "inbound" { direction_id = 1 }
          if d == "outbound" { direction_id = 2 }
          proto = downcase(string!(cm.protocol))
          conn_id = string!(cm.conn_id)
          src_iface = string!(cm.src_iface)
          src_ip = string!(cm.src_ip)
          src_port = to_int(cm.src_port) ?? 0
          dst_iface = string!(cm.dst_iface)
          dst_ip = string!(cm.dst_ip)
          dst_port = to_int(cm.dst_port) ?? 0
          nat_src_ip = to_string(cm.src_nat_ip)
          if nat_src_ip != "" { nat_src_port = to_int(cm.src_nat_port) ?? 0 }
          nat_dst_ip = to_string(cm.dst_nat_ip)
          if nat_dst_ip != "" { nat_dst_port = to_int(cm.dst_nat_port) ?? 0 }
      }

  # ============================================================
  # 302014/302016/302021 Teardown connection
  # ============================================================
  } else if msg_id == "302014" || msg_id == "302016" || msg_id == "302021" {
      desc = "Teardown connection"
      activity_id = 2
      activity_name = "Close"
      action_id = 1
      action = "Allowed"
      disposition_id = 1
      disposition = "Allowed"
      tm, te = parse_regex(msg_body, r'Teardown\s+(?P<protocol>\w+)\s+connection\s+(?P<conn_id>\d+)\s+for\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s+duration\s+(?P<h>\d+):(?P<m>\d{2}):(?P<s>\d{2})\s+bytes\s+(?P<bytes>\d+)(?:\s+reason\s+(?P<reason>.+))?')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(tm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if te == null && tm != null {
          proto = downcase(string!(tm.protocol))
          conn_id = string!(tm.conn_id)
          src_iface = string!(tm.src_iface)
          src_ip = string!(tm.src_ip)
          src_port = to_int(tm.src_port) ?? 0
          dst_iface = string!(tm.dst_iface)
          dst_ip = string!(tm.dst_ip)
          dst_port = to_int(tm.dst_port) ?? 0
          duration_s = ((to_int(tm.h) ?? 0) * 3600) + ((to_int(tm.m) ?? 0) * 60) + (to_int(tm.s) ?? 0)
          bytes_total = to_int(tm.bytes) ?? 0
          reason = to_string(tm.reason)
          if contains(downcase(reason), "reset") {
              activity_id = 3
              activity_name = "Reset"
          }
      }

  # ============================================================
  # 106023 Deny by access-group
  # ============================================================
  } else if msg_id == "106023" {
      desc = "ACL deny"
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      dm, de = parse_regex(msg_body, r'Deny\s+(?P<protocol>\w+)\s+src\s+(?P<src_iface>\w+):(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s+dst\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)\s+by\s+access-group\s+"(?P<acl>[^"]+)"')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(dm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if de == null && dm != null {
          proto = downcase(string!(dm.protocol))
          src_iface = string!(dm.src_iface)
          src_ip = string!(dm.src_ip)
          src_port = to_int(dm.src_port) ?? 0
          dst_iface = string!(dm.dst_iface)
          dst_ip = string!(dm.dst_ip)
          dst_port = to_int(dm.dst_port) ?? 0
          rule_name = string!(dm.acl)
      }

  # ============================================================
  # 106100 access-list permit/deny with hit count
  # ============================================================
  } else if msg_id == "106100" {
      desc = "ACL hit"
      am2, ae2 = parse_regex(msg_body, r'access-list\s+(?P<acl>\S+)\s+(?P<action>\w+)\s+(?P<protocol>\w+)\s+(?P<src_iface>\w+)/(?P<src_ip>[^\x28]+?)\x28(?P<src_port>\d+)\x29\s*->\s*(?P<dst_iface>\w+)/(?P<dst_ip>[^\x28]+?)\x28(?P<dst_port>\d+)\x29\s+hit-cnt\s+(?P<hits>\d+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(am2))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ae2 == null && am2 != null {
          act = downcase(string!(am2.action))
          if act == "permitted" || act == "permit" {
              activity_id = 6
              activity_name = "Traffic"
              action_id = 1
              action = "Allowed"
              disposition_id = 1
              disposition = "Allowed"
          } else {
              activity_id = 5
              activity_name = "Refuse"
              action_id = 2
              action = "Denied"
              disposition_id = 2
              disposition = "Blocked"
              status_id = 2
              status_str = "Failure"
          }
          proto = downcase(string!(am2.protocol))
          rule_name = string!(am2.acl)
          src_iface = string!(am2.src_iface)
          src_ip = string!(am2.src_ip)
          src_port = to_int(am2.src_port) ?? 0
          dst_iface = string!(am2.dst_iface)
          dst_ip = string!(am2.dst_ip)
          dst_port = to_int(am2.dst_port) ?? 0
          hit_count = to_int(am2.hits) ?? 0
      }

  # ============================================================
  # 106001 / 106006 / 106007 / 106015 / 710005 / 305005 / 305006 denies
  # ============================================================
  } else if msg_id == "106001" || msg_id == "106006" || msg_id == "106007" || msg_id == "106015" || msg_id == "710005" || msg_id == "305005" || msg_id == "305006" || msg_id == "419001" || msg_id == "419002" {
      desc = "Denied traffic"
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      if msg_id == "106001" { direction_id = 1 }
      if msg_id == "106006" || msg_id == "106007" { direction_id = 1 }
      pm, pe = parse_regex(msg_body, r'(?P<protocol>TCP|UDP|ICMP|tcp|udp|icmp)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(pm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if pe == null && pm != null { proto = downcase(string!(pm.protocol)) }
      # "from <ip>/<port> to <ip>/<port>" or "src <if>:<ip>/<port> dst <if>:<ip>/<port>"
      fm, fe = parse_regex(msg_body, r'(?:from|src)\s+(?:(?P<src_iface>\w+):)?(?P<src_ip>\d+\.\d+\.\d+\.\d+)/(?P<src_port>\d+)\s+(?:to|dst)\s+(?:(?P<dst_iface>\w+):)?(?P<dst_ip>\d+\.\d+\.\d+\.\d+)/(?P<dst_port>\d+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(fm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if fe == null && fm != null {
          src_iface = to_string(fm.src_iface)
          src_ip = string!(fm.src_ip)
          src_port = to_int(fm.src_port) ?? 0
          dst_iface = to_string(fm.dst_iface)
          dst_ip = string!(fm.dst_ip)
          dst_port = to_int(fm.dst_port) ?? 0
      }
      rm, re = parse_regex(msg_body, r'due\s+to\s+(?P<reason>.+)$')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(rm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if re == null && rm != null { reason = string!(rm.reason) }
      im, ie = parse_regex(msg_body, r'on\s+interface\s+(?P<iface>\S+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(im))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ie == null && im != null && dst_iface == "" { dst_iface = string!(im.iface) }

  # ============================================================
  # 305011/305012 dynamic NAT, 305009/305010 static NAT
  # ============================================================
  } else if msg_id == "305011" || msg_id == "305012" || msg_id == "305009" || msg_id == "305010" {
      desc = "NAT translation"
      activity_id = 1
      activity_name = "Open"
      if msg_id == "305012" || msg_id == "305010" { activity_id = 2; activity_name = "Close" }
      action_id = 4
      action = "Modified"
      disposition_id = 1
      disposition = "Allowed"
      nm, ne = parse_regex(msg_body, r'(?:Built|Teardown)\s+(?:dynamic|static)\s+(?P<protocol>\w+)?\s*translation\s+from\s+(?P<src_iface>\w+):(?P<src_ip>[^\s/]+)(?:/(?P<src_port>\d+))?\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^\s/]+)(?:/(?P<dst_port>\d+))?(?:\s+duration\s+(?P<h>\d+):(?P<m>\d{2}):(?P<s>\d{2}))?')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(nm))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ne == null && nm != null {
          proto = downcase(to_string(nm.protocol))
          src_iface = string!(nm.src_iface)
          src_ip = string!(nm.src_ip)
          sp = to_string(nm.src_port)
          if sp != "" { src_port = to_int(sp) ?? 0 }
          dst_iface = string!(nm.dst_iface)
          nat_src_ip = string!(nm.dst_ip)
          dp = to_string(nm.dst_port)
          if dp != "" { nat_src_port = to_int(dp) ?? 0 }
          hh = to_string(nm.h)
          if hh != "" {
              duration_s = ((to_int(hh) ?? 0) * 3600) + ((to_int(nm.m) ?? 0) * 60) + (to_int(nm.s) ?? 0)
          }
      }

  # ============================================================
  # 313001/313004/313005 denied ICMP
  # ============================================================
  } else if msg_id == "313001" || msg_id == "313004" || msg_id == "313005" {
      desc = "Denied ICMP"
      activity_id = 5
      activity_name = "Refuse"
      action_id = 2
      action = "Denied"
      disposition_id = 2
      disposition = "Blocked"
      status_id = 2
      status_str = "Failure"
      proto = "icmp"
      cm2, ce2 = parse_regex(msg_body, r'Denied\s+ICMP\s+type=(?P<t>\d+),?\s*code=(?P<c>\d+)\s+from\s+(?P<src_ip>\S+)\s+on\s+interface\s+(?P<iface>\w+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(cm2))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if ce2 == null && cm2 != null {
          icmp_type = string!(cm2.t)
          icmp_code = string!(cm2.c)
          src_ip = string!(cm2.src_ip)
          src_iface = string!(cm2.iface)
      }

  # ============================================================
  # 710003 TCP access permitted / denied
  # ============================================================
  } else if msg_id == "710003" {
      desc = "TCP access by ACL"
      proto = "tcp"
      tm2, te2 = parse_regex(msg_body, r'TCP\s+access\s+(?P<action>permitted|denied)\s+by\s+ACL\s+from\s+(?P<src_ip>[^/]+)/(?P<src_port>\d+)\s+to\s+(?P<dst_iface>\w+):(?P<dst_ip>[^/]+)/(?P<dst_port>\d+)')
      # Capture parsed fields before mapping; omit structural raw-body captures.
      __capture = object(parse_json!(encode_json(tm2))) ?? {}
      __ignore = del(__capture.body)
      __ignore = del(__capture.content)
      __ignore = del(__capture.kvdata)
      __ignore = del(__capture.kvpart)
      __ignore = del(__capture.msg)
      __ignore = del(__capture.payload)
      __ignore = del(__capture.remainder)
      __ignore = del(__capture.rest)
      __ignore = del(__capture.sd)
      __source_kv = set!(__source_kv, ["event"], merge(object(get(__source_kv, ["event"]) ?? null) ?? {}, __capture))
      if te2 == null && tm2 != null {
          if string!(tm2.action) == "permitted" {
              activity_id = 6
              activity_name = "Traffic"
              action_id = 1
              action = "Allowed"
              disposition_id = 1
              disposition = "Allowed"
          } else {
              activity_id = 5
              activity_name = "Refuse"
              action_id = 2
              action = "Denied"
              disposition_id = 2
              disposition = "Blocked"
