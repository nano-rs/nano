# TLS overlay for the open-source stack — bring-your-own-certificate.
#
# 1. Put your cert chain + private key here (PEM):
#      config/nginx/ssl/fullchain.pem
#      config/nginx/ssl/privkey.pem
#    Get them however you like — Let's Encrypt/certbot, your own CA, or a
#    self-signed pair via `config/nginx/generate-ssl.sh` (browser warning).
#
# 2. Bring the stack up with this overlay:
#      docker compose -f docker-compose.opensource.yml -f docker-compose.tls.yml up -d
#
# 3. Set BASE_URL=https://your.domain in .env so login cookies get the Secure
#    flag (the installer already leaves NANOSIEM_DEV_MODE=false for https URLs).
#
# nginx serves HTTPS on :443 and 301-redirects :80 → :443. No extra proxy or
# ACME client — renew your certs out of band and `docker compose ... restart nginx`.
services:
  nginx:
    # NAN-5397: the base service mounts config/nginx as a directory and links
    # the file named here as nginx.conf, so an upgrade's new config is live.
    environment:
      NANO_NGINX_CONF: nginx.opensource-tls.conf
    volumes:
      # NAN-5015: edge client-IP mode (none = strip CDN headers; cdn = forward them).
      - ./config/nginx/client-ip/${NANO_EDGE_CDN_CLIENT_IP:-none}.conf:/etc/nginx/nano-client-ip.d/edge.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    # NAN-5511: :80 only 301-redirects to https here, so the base file's
    # `wget http://127.0.0.1:80/api/health` check fails on every run and nginx
    # stays "unhealthy" (nano upgrade waits for healthy and then gives up).
    # Probe the HTTPS listener on loopback instead: same /api/health route,
    # through TLS. The certificate names the public host, not 127.0.0.1, so
    # this loopback-only probe skips verification (busybox wget verifies by
    # default and fails on any self-signed or public-name cert).
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:443/api/health >/dev/null 2>&1 || exit 1"]
