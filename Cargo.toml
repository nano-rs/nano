[workspace]
resolver = "2"
members = [
    "nanosiem-core",
    "nanosiem-api",
    "nanosiem-api-lib",
    "nanosiem-search",
    "tools/log-blaster",
    "tools/event-core",
    "tools/injector",
]

[workspace.package]
version = "0.1.652"
edition = "2021"
authors = ["NanoSIEM Team"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
clickhouse = { version = "0.14", features = ["uuid", "time", "native-tls"] }
rust_decimal = { version = "1.36", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.19", features = ["v7", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Parser combinators
nom = "8.0"

# SQL parsing
sqlparser = "0.61"

# Web framework (for API)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "set-header", "catch-panic"] }

# Testing
proptest = "1.9"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# RSS/Atom feed parsing
feed-rs = "2.3"

# OpenAPI / Swagger documentation
utoipa = { version = "5", features = ["chrono", "uuid", "axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
