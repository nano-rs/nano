<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo_small_dark_theme.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nano</title>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="nano - AI-Powered SIEM" />
  <meta property="og:description" content="Lightweight SIEM with AI-powered detection, real-time monitoring, and advanced threat hunting." />
  <meta property="og:image" content="/logo.svg" />
  <meta property="og:url" content="/" />
  <meta property="og:site_name" content="nano" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="nano - AI-Powered SIEM" />
  <meta name="twitter:description" content="Lightweight SIEM with AI-powered detection, real-time monitoring, and advanced threat hunting." />
  <meta name="twitter:image" content="/logo.svg" />

  <!-- Security Headers -->
  <!-- X-Frame-Options and frame-ancestors are set via nginx/server headers (ignored in meta tags) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
  <!-- CSP generated by cspPlugin in vite.config.ts (dev vs prod differences) -->
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  
  <!-- Theme initialization script - prevents flash of wrong theme -->
  <script>
    (function() {
      const storageKey = 'nanosiem-theme';
      const theme = localStorage.getItem(storageKey) || 'dark';
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const resolvedTheme = theme === 'system' ? systemTheme : theme;
      document.documentElement.classList.add(resolvedTheme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
