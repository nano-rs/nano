<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo_small_dark_theme.svg" />
  <!-- Geist + Geist Mono are self-hosted via @fontsource (bundled by Vite); see src/main.tsx. No Google Fonts CDN (air-gap). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nano</title>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="nano - AI-Powered SIEM" />
  <meta property="og:description" content="Lightweight SIEM with AI-powered detection, real-time monitoring, and advanced threat hunting." />
  <meta property="og:image" content="/logo.svg" />
  <meta property="og:url" content="/" />
  <meta property="og:site_name" content="nano" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="nano - AI-Powered SIEM" />
  <meta name="twitter:description" content="Lightweight SIEM with AI-powered detection, real-time monitoring, and advanced threat hunting." />
  <meta name="twitter:image" content="/logo.svg" />

  <!-- Security Headers -->
  <!-- X-Frame-Options and frame-ancestors are set via nginx/server headers (ignored in meta tags) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
  <!-- CSP generated by cspPlugin in vite.config.ts (dev vs prod differences) -->
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  
  <!-- Theme initialization script - prevents flash of wrong theme -->
  <script>
    (function() {
      // Keep in sync with THEMES in src/lib/theme.ts. This runs before the
      // bundle loads, so it cannot import it — but an unknown stored value must
      // not be pasted onto <html> as a class, so validate against the list.
      const themes = ['light', 'dark', 'matte'];
      const storageKey = 'nanosiem-theme';
      const stored = localStorage.getItem(storageKey) || 'dark';
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const resolvedTheme = stored === 'system' ? systemTheme : stored;
      document.documentElement.classList.add(
        themes.indexOf(resolvedTheme) === -1 ? 'dark' : resolvedTheme
      );
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
