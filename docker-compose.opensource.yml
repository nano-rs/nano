# nano — open-source quickstart compose
#
# Pulls pre-built images from ghcr.io/nano-rs and stands up a complete
# single-host nano cluster (postgres + clickhouse + api/search/jobs/web +
# vector for ingestion + nginx reverse proxy).
#
# Forked from the validated enterprise template at
# nano-main/deploy/docker-compose/docker-compose.yml. Intentional divergences:
#   - Images: ghcr.io/nano-rs/nano-* (not the private GCR registry)
#   - Storage: named docker volumes (not /mnt/data/* bind mounts on a LUKS partition)
#   - No TLS: nginx serves :80 only; users layer their own reverse proxy for HTTPS
#   - Stripped: node-exporter, prometheus (enterprise metrics fleet)
#   - Ports: published on 0.0.0.0 by default so `docker compose up` is useful on a fresh VM
#
# Intended entry point: ./install.sh (interactive bootstrap that generates .env
# and runs `docker compose -f docker-compose.opensource.yml up -d`).
#
# Required .env keys (see install.sh / .env.opensource.example):
#   NANO_VERSION              — image tag, default "latest"
#   POSTGRES_PASSWORD         — generated by install.sh
#   CLICKHOUSE_PASSWORD       — generated by install.sh
#   CLICKHOUSE_ADMIN_PASSWORD — generated by install.sh
#   JWT_SECRET                — generated by install.sh
#   NANOSIEM_ENCRYPTION_KEY   — 32-byte hex, generated by install.sh
#   VECTOR_AUTH_TOKEN         — generated by install.sh
#   BASE_URL                  — public URL users hit (default http://localhost)
#   NANOSIEM_DEV_MODE         — set to "true" by install.sh when BASE_URL is http://
#                               (allows refresh-token cookies over plain HTTP)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-logging-verbose: &verbose-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    container_name: nano-postgres
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: ["-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nanosiem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nanosiem}
    volumes:
      - nano-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanosiem}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: nano-clickhouse
    restart: unless-stopped
    logging: *verbose-logging
    security_opt:
      - no-new-privileges:true
    environment:
      # NAN-810: do NOT set CLICKHOUSE_DB here. The upstream entrypoint reacts
      # to it by running `clickhouse-client -u default -q "CREATE DATABASE …"`,
      # which fails against our default-profile users (allow_ddl=0 in
      # users.d/query_limits.xml). clickhouse/init.sql already creates the
      # nanosiem database via the clickhouse-migrate service, which runs as
      # the admin user — the entrypoint's create is redundant.
      #
      # NAN-809: do NOT set CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT here. The upstream
      # entrypoint reacts to that env by writing a generated default-user.xml into
      # /etc/clickhouse-server/users.d/, which conflicts with our :ro bind mount and
      # puts the container in a restart loop. Our users.d/default-user.xml already
      # sets <access_management>1</access_management> directly, so the env is
      # redundant.
      # Pass per-deployment passwords into users.d/*.xml via from_env="..." (NAN-807 bug #2).
      CLICKHOUSE_NANOSIEM_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    volumes:
      - nano-clickhouse-data:/var/lib/clickhouse
      - nano-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/?query=SELECT+1' 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: nano-dragonfly
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: ["--maxmemory", "512mb", "--proactor_threads", "2"]
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  clickhouse-migrate:
    image: ghcr.io/nano-rs/nano-api:${NANO_VERSION:-latest}
    container_name: nano-clickhouse-migrate
    command: ["clickhouse_migrator"]
    restart: "no"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nanosiem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nanosiem}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_CLUSTER: ""
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      # The migrator substitutes these into {pg_dict_*} placeholders in
      # clickhouse/init.sql so the PG-sourced dictionaries can authenticate
      # without hardcoded creds (NAN-807 bug #3).
      POSTGRES_DICT_HOST: postgres
      POSTGRES_DICT_PASSWORD: ${POSTGRES_PASSWORD}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  vector:
    image: timberio/vector:0.52.0-debian
    container_name: nano-vector
    restart: unless-stopped
    logging: *verbose-logging
    security_opt:
      - no-new-privileges:true
    # Static bundle at /etc/vector (read-only). Per-source parser configs
    # delivered by nano-api land in /etc/vector/dynamic/sources/{parsers,configs}/
    # via the shared nano-vector-dynamic volume (NAN-807 bug #15).
    #
    # The mkdir -p prefix is defensive: on the very first `compose up`, the
    # named volume is empty and `--config-dir` on a missing path makes Vector
    # error at startup. Enterprise's Hetzner deploy pre-creates the host dirs
    # so it never hit this; OSS users on a clean Docker host would.
    entrypoint: ["/bin/sh", "-c"]
    # NAN-813: `--config-dir` is recursive, so a single `--config-dir /etc/vector`
    # already picks up every .toml under /etc/vector/{sources,sinks,dynamic}/...
    # The previous compose listed the subdirs explicitly on top of the parent
    # scan, which loaded every parser twice and tripped Vector with
    # "duplicate transform id found" on first boot.
    command:
      - >
        mkdir -p /etc/vector/dynamic/sources/parsers /etc/vector/dynamic/sources/configs &&
        exec /usr/bin/vector --config-dir /etc/vector --watch-config
    environment:
      VECTOR_AUTH_TOKEN: ${VECTOR_AUTH_TOKEN}
      VECTOR_DATA_DIR: /var/lib/vector
      VECTOR_LOG: info
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      # HTTP ingestion (auto-detects format from Content-Type)
      - "8080:8080"
      # Vector → Vector native protocol (for on-prem aggregators / syslog relays)
      - "6000:6000"
      # Splunk HEC
      - "8088:8088"
      # OpenTelemetry
      - "4317:4317"
      - "4318:4318"
      # Fluent Forward
      - "24224:24224"
    volumes:
      - ./config/vector:/etc/vector:ro
      - nano-vector-dynamic:/etc/vector/dynamic
      - nano-vector-data:/var/lib/vector
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  nano-api:
    image: ghcr.io/nano-rs/nano-api:${NANO_VERSION:-latest}
    container_name: nano-api
    restart: unless-stopped
    logging: *verbose-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nanosiem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nanosiem}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_CLUSTER: ""
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      POSTGRES_DICT_HOST: postgres
      POSTGRES_DICT_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      CORS_ORIGINS: ${BASE_URL:-http://localhost}
      AUTH_ENABLED: "true"
      # install.sh flips this to "true" when BASE_URL is http:// so the refresh
      # cookie is set without the Secure flag (NAN-807 bug #12).
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      RUST_LOG: ${RUST_LOG:-info}
      # Parser config delivery — api writes here, vector reads from same volume.
      VECTOR_CONFIG_DIR: /app/config/vector
      VECTOR_SOURCES_RUNTIME_PATH: /etc/vector/dynamic
      VECTOR_CONTAINER_NAME: nano-vector
      # Skip docker-exec'd `vector validate` (the api image has no docker CLI).
      SKIP_VECTOR_VALIDATION: "true"
      NANOSIEM_DATA_DIR: /app/data
      NRT_MAX_CONCURRENT_RULES: "50"
      NRT_JITTER_MAX_SECS: "30"
      HOT_RETENTION_DAYS: ${HOT_RETENTION_DAYS:-90}
      WARM_RETENTION_DAYS: ${WARM_RETENTION_DAYS:-30}
      COLD_STORAGE_ENABLED: "false"
      NANO_TIER: ${NANO_TIER:-unrestricted}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-}
      REDIS_URL: redis://dragonfly:6379
      LOG_FORMAT: ${LOG_FORMAT:-}
      SIEM_FORWARD_URL: ${SIEM_FORWARD_URL:-}
      SIEM_FORWARD_TOKEN: ${SIEM_FORWARD_TOKEN:-}
    volumes:
      - nano-api-data:/app/data
      - nano-vector-dynamic:/etc/vector/dynamic
      - nano-vector-dynamic:/app/config/vector
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  nano-jobs:
    image: ghcr.io/nano-rs/nano-jobs:${NANO_VERSION:-latest}
    container_name: nano-jobs
    restart: unless-stopped
    logging: *verbose-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nanosiem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nanosiem}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_CLUSTER: ""
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      POSTGRES_DICT_HOST: postgres
      POSTGRES_DICT_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      JOBS_PORT: "3003"
      LEADER_ELECTION_ENABLED: "true"
      RUST_LOG: ${RUST_LOG:-info}
      VECTOR_CONFIG_DIR: /app/config/vector
      VECTOR_SOURCES_RUNTIME_PATH: /etc/vector/dynamic
      VECTOR_CONTAINER_NAME: nano-vector
      SKIP_VECTOR_VALIDATION: "true"
      NANOSIEM_DATA_DIR: /app/data
      NRT_MAX_CONCURRENT_RULES: "50"
      NRT_JITTER_MAX_SECS: "30"
      HOT_RETENTION_DAYS: ${HOT_RETENTION_DAYS:-90}
      WARM_RETENTION_DAYS: ${WARM_RETENTION_DAYS:-30}
      COLD_STORAGE_ENABLED: "false"
      NANO_TIER: ${NANO_TIER:-unrestricted}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-}
      REDIS_URL: redis://dragonfly:6379
      LOG_FORMAT: ${LOG_FORMAT:-}
      SIEM_FORWARD_URL: ${SIEM_FORWARD_URL:-}
      SIEM_FORWARD_TOKEN: ${SIEM_FORWARD_TOKEN:-}
    volumes:
      - nano-api-data:/app/data
      - nano-vector-dynamic:/etc/vector/dynamic
      - nano-vector-dynamic:/app/config/vector
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  nano-search:
    image: ghcr.io/nano-rs/nano-search:${NANO_VERSION:-latest}
    container_name: nano-search
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nanosiem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nanosiem}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_CLUSTER: ""
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SEARCH_PORT: "3002"
      JWT_SECRET: ${JWT_SECRET}
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      CORS_ORIGINS: ${BASE_URL:-http://localhost}
      AUTH_ENABLED: "true"
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      REDIS_URL: redis://dragonfly:6379
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      SIEM_FORWARD_URL: ${SIEM_FORWARD_URL:-}
      SIEM_FORWARD_TOKEN: ${SIEM_FORWARD_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  nano-web:
    image: ghcr.io/nano-rs/nano-web:${NANO_VERSION:-latest}
    container_name: nano-web
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # No healthcheck — the image's embedded nginx only binds IPv4 on :5173,
    # but Alpine wget resolves "localhost" to ::1 and fails. Enterprise has
    # no healthcheck either; nginx depends on web with service_started.
    # NAN-807 bug #4.
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: nano-nginx
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/nginx/nginx.opensource.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      nano-api:
        condition: service_healthy
      nano-web:
        condition: service_started
      vector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  nano-postgres-data:
  nano-clickhouse-data:
  nano-clickhouse-logs:
  nano-vector-data:
  nano-vector-dynamic:
  nano-api-data:
