# nano — open-source quickstart compose
#
# Pulls pre-built images from ghcr.io/nano-rs and stands up a complete
# single-host nano cluster (postgres + clickhouse + api/search/jobs/web +
# vector for ingestion + nginx reverse proxy).
#
# Intended entry point: ./install.sh (interactive bootstrap that generates
# .env and runs `docker compose -f docker-compose.opensource.yml up -d`).
#
# Required .env keys (see .env.opensource.example):
#   NANO_VERSION         — image tag, default "latest"
#   POSTGRES_PASSWORD    — generated by install.sh
#   CLICKHOUSE_PASSWORD  — generated by install.sh
#   CLICKHOUSE_ADMIN_PASSWORD — generated by install.sh
#   JWT_SECRET           — generated by install.sh
#   NANOSIEM_ENCRYPTION_KEY — 32-byte hex, generated by install.sh
#   VECTOR_AUTH_TOKEN    — generated by install.sh
#   BASE_URL             — public URL users hit (default http://localhost)

services:
  postgres:
    image: postgres:18
    container_name: nano-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: nanosiem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: nanosiem
    volumes:
      - nano-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanosiem -d nanosiem"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: nano-clickhouse
    security_opt:
      - no-new-privileges:true
    environment:
      CLICKHOUSE_DB: nanosiem
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - nano-clickhouse-data:/var/lib/clickhouse
      - nano-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: nano-dragonfly
    command: ["--maxmemory", "512mb", "--proactor_threads", "2"]
    security_opt:
      - no-new-privileges:true
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  clickhouse-migrate:
    image: ghcr.io/nano-rs/nano-api:${NANO_VERSION:-latest}
    container_name: nano-clickhouse-migrate
    command: ["clickhouse_migrator"]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://nanosiem:${POSTGRES_PASSWORD}@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  nano-api:
    image: ghcr.io/nano-rs/nano-api:${NANO_VERSION:-latest}
    container_name: nano-api
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://nanosiem:${POSTGRES_PASSWORD}@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: "true"
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      NANOSIEM_DEV_MODE: "false"
      API_HOST: 0.0.0.0
      API_PORT: 3000
      CORS_ORIGINS: ${BASE_URL:-http://localhost}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nano-search:
    image: ghcr.io/nano-rs/nano-search:${NANO_VERSION:-latest}
    container_name: nano-search
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://nanosiem:${POSTGRES_PASSWORD}@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: "true"
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      NANOSIEM_DEV_MODE: "false"
      SEARCH_PORT: 3002
      CORS_ORIGINS: ${BASE_URL:-http://localhost}
      RUST_LOG: ${RUST_LOG:-info}
      REDIS_URL: redis://dragonfly:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nano-jobs:
    image: ghcr.io/nano-rs/nano-jobs:${NANO_VERSION:-latest}
    container_name: nano-jobs
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://nanosiem:${POSTGRES_PASSWORD}@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_SELF_USER: nanosiem
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: "true"
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY}
      NANOSIEM_DEV_MODE: "false"
      JOBS_PORT: 3003
      LEADER_ELECTION_ENABLED: "true"
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nano-web:
    image: ghcr.io/nano-rs/nano-web:${NANO_VERSION:-latest}
    container_name: nano-web
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vector:
    image: timberio/vector:latest-alpine
    container_name: nano-vector
    security_opt:
      - no-new-privileges:true
    environment:
      VECTOR_AUTH_TOKEN: ${VECTOR_AUTH_TOKEN}
      VECTOR_DATA_DIR: /var/lib/vector
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      # HTTP ingestion (auto-detects format from Content-Type)
      - "8080:8080"
      # Syslog
      - "514:514/udp"
      - "514:514/tcp"
      # Splunk HEC
      - "8088:8088"
      # OpenTelemetry
      - "4317:4317"
      - "4318:4318"
      # Fluent Forward
      - "24224:24224"
    volumes:
      - ./config/vector:/etc/vector:ro
      - ./config/vector/sources/parsers:/etc/vector/sources/parsers
      - ./config/vector/sources/configs:/etc/vector/sources/configs
      - nano-vector-data:/var/lib/vector
    command: ["--config-dir", "/etc/vector", "--config-dir", "/etc/vector/sources/parsers", "--config-dir", "/etc/vector/sources/configs", "--config-dir", "/etc/vector/sinks", "--watch-config"]
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9598/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nano-nginx
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.opensource.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nano-web:
        condition: service_healthy
      nano-api:
        condition: service_healthy
      nano-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  nano-postgres-data:
  nano-clickhouse-data:
  nano-clickhouse-logs:
  nano-vector-data:
