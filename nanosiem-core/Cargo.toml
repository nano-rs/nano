[package]
name = "nanosiem-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for NanoSIEM - data models, query parsing, and business logic"

[dependencies]
tokio.workspace = true
sqlx.workspace = true
clickhouse.workspace = true
# Match ClickHouse's HTTP/1 transport, preserving native/private trust roots.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
semver = "1.0"
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
nom.workspace = true
# NAN-4917: grow the stack on demand in recursive query compilation/evaluation
# walks so a deep (but parser-bounded) expression can never abort the process
# on a 2 MiB tokio worker stack. Already in the lockfile (via `recursive`).
stacker = "0.1.23"
sqlparser.workspace = true
rust_decimal.workspace = true
regex = "1.12"
regex-syntax = "0.8"
rand = "0.9"
once_cell = "1.20"
futures = "0.3.32"
# Enrichment dependencies
reqwest = { version = "0.13", features = ["json", "form", "gzip", "stream"] }
url = "2.5"
flate2 = "1.0"
csv = "1.3"
tokio-util = { version = "0.7", features = ["io"] }
# meloD AI dependencies
# Query explanation cache
sha2 = "0.11"
hmac = "0.13"
sha1 = "0.11"
md-5 = "0.11"
governor = "0.10"
dashmap = "6.1"
# Redis for distributed job store (active/active search)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
# Encryption for credentials
aes-gcm = "0.10"
# NAN-4933: credential key ring (port of main NAN-4401 CP2a): HKDF for v2
# envelopes, zeroize for key material held in memory.
hkdf = "0.12"
sha2_10 = { package = "sha2", version = "0.10" }
zeroize = "1.8"
base64 = "0.22"
hex = "0.4"
urlencoding = "2.1"
# OpenAPI schema derives
utoipa.workspace = true
# Cron scheduling
cron = "0.16"
# IANA timezone database. Hunt schedules (NAN-2238) are WALL-CLOCK in the
# hunt's own `schedule_timezone`, so the slot arithmetic has to know about DST
# transitions rather than pretending every day is 24 hours long.
chrono-tz = "0.10"
# Authentication
bcrypt = "0.19"
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth", "qr", "serde_support"] }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
# Async trait for dyn-compatible async traits
async-trait = "0.1"
# Temp file handling for sandbox execution
tempfile = "3.25"
# Native VRL validation (from Vector). Tracks the VRL in the Vector we ship
# (nano-rs/vector nano/v0.61 = VRL 0.38) so validation rejects what Vector
# rejects. VRL 0.36+ adds `cli` (clap, rustyline, webbrowser) to its default
# features; this list is 0.30's default set: compiler + full stdlib + datadog.
vrl = { version = "0.38", default-features = false, features = ["compiler", "stdlib", "datadog"] }
# Structured TOML emission for generated Vector source configs (NAN-689)
toml = "0.9"
# Air-gapped signed bundle verification (NAN-1202): detached Ed25519 signature
# over a canonical manifest + streaming tar.gz payload checksum verification.
ed25519-dalek = { version = "2", features = ["pkcs8"] }
tar = "0.4"
# Platform feed bundle consumer (NAN-4948): O_NOFOLLOW opens of the signed
# container, and iteration of the IPinfo Lite MMDB it carries into the
# ClickHouse ip_enrichments table.
libc = "0.2"
maxminddb = "0.30"
ipnetwork = "0.21"

# NAN-4919: Vector observability gRPC messages for the live tap relay.
prost = "0.13"

# NAN-4919: resource limits for the Nano Pipe preview worker process.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
proptest.workspace = true
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
# tests/open_core_relation_inventory.rs parses the Rust sources an open build
# compiles to find the SQL relations they name.
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }
# NAN-1546: recompute/verify the webhook HMAC signature in the delivery
# integration test (these are non-dev deps too, but integration-test crates
# only link the crate-under-test + dev-deps, so they must be listed here).
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

[[bin]]
name = "parse_udm_csv"
path = "src/bin/parse_udm_csv.rs"

[[bin]]
name = "generate_udm_json"
path = "src/bin/generate_udm_json.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("enterprise"))'] }
