[package]
name = "nanosiem-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for NanoSIEM - data models, query parsing, and business logic"

[dependencies]
nanosiem-lake-cell = { path = "../nanosiem-lake-cell" }
tokio.workspace = true
sqlx.workspace = true
clickhouse.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
serde_yaml.workspace = true
semver = "1.0"
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
nom.workspace = true
sqlparser.workspace = true
rust_decimal.workspace = true
regex = "1.12"
regex-syntax = "0.8"
rand = "0.9"
once_cell = "1.20"
futures = "0.3.32"
# Enrichment dependencies
reqwest = { version = "0.13", features = ["json", "form", "gzip", "stream", "query"] }
# Standard OTLP/HTTP protobuf encoding for the existing synthetic runner's
# internal Vector export. This matches the already-pinned log-blaster OTLP
# transport; it is not a separate telemetry engine or service.
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic-messages", "metrics", "trace", "with-serde"] }
prost = "0.13"
url = "2.5"
flate2 = "1.0"
csv = "1.3"
zip = { version = "3.0", default-features = false, features = ["deflate"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7", features = ["io"] }
object_store = { version = "0.14.1", features = ["aws"], optional = true }
# NAN-2760: zstd JSONL cold archive of collected writer-registry rows (same version the lake worker locks).
zstd = { version = "0.13", optional = true }
maxminddb = { version = "0.30", features = ["mmap"] }
arc-swap = "1.7"
# meloD AI dependencies
# Query explanation cache
sha2 = "0.11"
hmac = "0.13"
sha1 = "0.11"
md-5 = "0.11"
governor = "0.10"
dashmap = "6.1"
# Redis for distributed job store (active/active search)
redis = { version = "1.2", features = ["tokio-rustls-comp", "connection-manager"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.6"
httparse = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Encryption for credentials
aes-gcm = "0.10"
hkdf = "0.12"
sha2_10 = { package = "sha2", version = "0.10" }
base64 = "0.22"
psl = "=2.1.199"
hex = "0.4"
zeroize = "1.8"
subtle = "2.6"
urlencoding = "2.1"
# OpenAPI schema derives
utoipa.workspace = true
# Cron scheduling
cron = "0.16"
# IANA timezone database. Hunt schedules (NAN-2238) are WALL-CLOCK in the
# hunt's own `schedule_timezone`, so the slot arithmetic has to know about DST
# transitions rather than pretending every day is 24 hours long.
chrono-tz = "0.10"
# Authentication
bcrypt = "0.19"
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth", "qr", "serde_support"] }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
# Async trait for dyn-compatible async traits
async-trait = "0.1"
# Temp file handling for sandbox execution
tempfile = "3.25"
# Native VRL validation (from Vector). Tracks the VRL in the tenant cell's
# Vector (0.59 = VRL 0.36, NAN-3367) so validation rejects what Vector rejects.
# 0.36 added `cli` (clap, rustyline, webbrowser) to the default features; the
# explicit list is 0.30's default set: compiler + full stdlib + datadog.
vrl = { version = "0.36", default-features = false, features = ["compiler", "stdlib", "datadog"] }
# Structured TOML emission for generated Vector source configs (NAN-689)
toml = "0.9"
# Air-gapped signed bundle verification (NAN-1202): detached Ed25519 signature
# over a canonical manifest + streaming tar.gz payload checksum verification.
ed25519-dalek = { version = "2", features = ["pkcs8"] }
tar = "0.4"
# NAN-2386: the owner-plane receipt signer needs the POSIX bits std does
# not expose — `O_NOFOLLOW`/`O_DIRECTORY` on open, and getuid/geteuid to
# prove the private key file is owned by the account doing the signing.
libc = "0.2"

[features]
default = []
enrichment-read-audit = []

[dev-dependencies]
arrow-json = "58"
parquet = "58"
nanosiem-lake-worker = { path = "../nanosiem-lake-worker" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "client"] }
proptest.workspace = true
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
# NAN-1546: recompute/verify the webhook HMAC signature in the delivery
# integration test (these are non-dev deps too, but integration-test crates
# only link the crate-under-test + dev-deps, so they must be listed here).
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# NAN-3462: tests/open_schema_sql_scan.rs parses the open-edition sources to
# find every runtime-checked `sqlx::query*` literal and prepares it against the
# open fresh-init schema. span-locations gives findings real line numbers.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }


[[bin]]
name = "parse_udm_csv"
path = "src/bin/parse_udm_csv.rs"

[[bin]]
name = "generate_udm_json"
path = "src/bin/generate_udm_json.rs"

[[bin]]
name = "nano-parser-bundle-build"
path = "src/bin/nano_parser_bundle_build.rs"


# Hosted-shared RLS activation helper (NAN-3861): enterprise builds only.

# NAN-4669: operator-invoked registry REINDEX / heap reclaim (dry run by default).








































































































# Hosted collector fixture lives under workers/, which the public export strips.

[build-dependencies]
vrl = { version = "0.36", default-features = false, features = ["compiler", "stdlib", "datadog"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("enterprise"))'] }
