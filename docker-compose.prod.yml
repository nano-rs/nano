version: '3.8'

# Production deployment with nginx reverse proxy
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before first run:
#   1. Generate SSL certs: bash config/nginx/generate-ssl.sh
#      Or use Let's Encrypt (see docs)
#   2. Set environment variables in .env file

services:
  # Production frontend - built and served via nginx
  nanosiem-web:
    build:
      context: ./nanosiem-web
      dockerfile: Dockerfile
    image: nanosiem-web:latest
    container_name: nanosiem-web
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nanosiem-nginx
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=100m
      - /var/run:noexec,nosuid,size=10m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./config/nginx/certbot:/var/www/certbot:ro
    depends_on:
      nanosiem-web:
        condition: service_healthy
      nanosiem-api:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Production API settings
  nanosiem-api:
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      AUTH_ENABLED: "true"
      # Production CORS - set your domain in .env or override here
      CORS_ORIGINS: ${CORS_ORIGINS:-https://nano.qsi.net}
    # Don't expose port directly in prod - nginx handles it
    expose:
      - "3000"
    ports: []

  # Production Search Service settings
  nanosiem-search:
    environment:
      RUST_LOG: ${RUST_LOG:-warn}
      # Production CORS - must match API settings
      CORS_ORIGINS: ${CORS_ORIGINS:-https://nano.qsi.net}
    # Don't expose port directly in prod - nginx handles it
    expose:
      - "3002"
    ports: []

  # Grafana production settings
  grafana:
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://nano.qsi.net/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    expose:
      - "3000"
    ports: []

  # Prometheus production settings
  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/prometheus/'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "9090"
    ports: []

  # Vector - keep ingestion port but could also proxy through nginx
  vector:
    expose:
      - "8080"
      - "9598"
    ports:
      # Keep metrics port for Prometheus scraping
      - "9598:9598"

  # Don't expose database ports in production
  postgres:
    ports: []

  clickhouse:
    ports: []
