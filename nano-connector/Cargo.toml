[package]
name = "nano-connector"
description = "Declarative connector engine: VRL request loop, pagination, checkpoints, sandboxed VRL (NAN-3490, ported to the ClickHouse product in NAN-4914)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Operator CLI (schema / validate / preview / shadow / check-uids) and the
# sandboxed VRL worker child (`vrl-worker`) the engine spawns.
[[bin]]
name = "nano-connector"
path = "src/bin/nano-connector.rs"

# NAN-4914 phase 4: the pull-feed runner service (its own process/container).
[[bin]]
name = "nano-connector-runner"
path = "src/bin/nano-connector-runner.rs"

# Open-core crate: no `enterprise` feature. SOAR (enterprise) consumes this
# library from nanosiem-enterprise; nothing enterprise-only lives here.
[features]
default = []

[dependencies]
vrl = { version = "0.38", default-features = false, features = ["compiler", "stdlib"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
schemars = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1"
rustls-pki-types = { version = "1", features = ["std"] }
aws-lc-rs = "1"
url = "2.5"
percent-encoding = "2"
flate2 = "1.0"
base64 = "0.22"
libc = "0.2"
async-trait = "0.1"
hex = "0.4"
aho-corasick = "1"
# The shared SSRF validator (`nanosiem_core::inputlookup::SsrfValidator`) is
# the platform's single source of truth for which addresses are never an
# outbound target; the broker applies it to every pinned address.
nanosiem-core = { path = "../nanosiem-core" }
# Pull-feed runner service (NAN-4914 phase 4): PostgreSQL feed store, HEC
# emit into the local Vector, cron schedules, metrics.
sqlx = { workspace = true }
# G22: identity feeds write the user directory (ClickHouse `user_registry`).
clickhouse = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
cron = "0.16"
rand = "0.9"
metrics = { workspace = true }
tracing-subscriber = { workspace = true }

# The VRL worker's syscall allowlist. seccomp is a Linux kernel facility:
# other targets (the macOS native dev stack) build without it and report the
# sandbox as degraded (see src/sandbox.rs).
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
