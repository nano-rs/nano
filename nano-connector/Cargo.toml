[package]
name = "nano-connector"
description = "NAN-3490: declarative connector engine with a VRL request loop, plus the feed runner service (Deno replacement)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "nano-connector"
path = "src/bin/nano-connector.rs"

# The jobs-style feed runner (scheduler + Postgres checkpoints + HEC emit).
[[bin]]
name = "nano-connector-runner"
path = "src/bin/nano-connector-runner.rs"

[features]
default = []
# Hosted per-feed ingest credential issuance through the request/reveal path
# in nanosiem-core.
# The open build runs feeds whose token is set at create time.

[dependencies]
vrl = { version = "0.36", default-features = false, features = ["compiler", "stdlib"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
schemars = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1"
rustls-pki-types = { version = "1", features = ["std"] }
aws-lc-rs = "1"
url = "2.5"
percent-encoding = "2"
flate2 = "1.0"
base64 = "0.22"
libc = "0.2"
async-trait = "0.1"
chrono = { workspace = true }
hex = "0.4"
# Service layer (NAN-3490 L1). nanosiem-core supplies the signed tenant
# transaction (tenant_db), the region RLS key loader, tenant discovery and
# the credential cipher. Default features only: this crate is not in any
# release image invocation (see the PR body's feature-unification check).
nanosiem-core = { path = "../nanosiem-core" }
sqlx = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
cron = "0.16"
rand = "0.9"
metrics = { workspace = true }
tracing-subscriber = { workspace = true }
aho-corasick = "1"
seccompiler = "0.5"
zeroize = "1.8"

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
# tests/pg_feed_store.rs (enterprise): a signed parser-bundle release for the
# enrolled source-mode fixture tenant, as the NAN-2590 fulfilment test does.
ed25519-dalek = "2"
sha2 = "0.11"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("enterprise"))'] }
