# =============================================================================
# DEV ONLY — DO NOT RUN ON A PUBLIC HOST
# =============================================================================
# This compose file is for local development. Every published port is bound to
# 127.0.0.1, including the internal services: Postgres (5432), ClickHouse
# HTTP/native (8123/9000), Prometheus (9090), Grafana (3001), Dragonfly and the
# exporters. Use an SSH tunnel to reach them from another machine. Never widen a
# binding to 0.0.0.0: these services are unauthenticated or use dev credentials.
# scripts/tests/compose-published-ports.sh enforces the loopback-only rule.
#
# To deploy nano, use the open-core stack instead: docker-compose.opensource.yml
# (via install.sh / get.nano.rs). That file publishes only the nginx entrypoint
# and the Vector ingest ports; the databases and app services stay on the internal
# Docker network. See SECURITY.md ("Deployment & network exposure") and
# docs/getting-started/docker-deployment.md ("Network exposure & firewall").
# =============================================================================
version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: nanosiem-postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: nanosiem
      POSTGRES_PASSWORD: nanosiem
      POSTGRES_DB: nanosiem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nanosiem-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanosiem -d nanosiem"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # ClickHouse schema migrator (one-shot)
  # =============================================================================
  # Runs init.sql + numbered migrations + distributed tables, then exits 0.
  # api/search/jobs gate on its successful completion via
  # `depends_on: { condition: service_completed_successfully }`. Running
  # migrations as a separate one-shot keeps DDL out of the api startup hot
  # path — see NAN-607 (saturn crash-loop incident).
  clickhouse-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: nanosiem-api:latest
    container_name: nanosiem-clickhouse-migrate
    command: ["clickhouse_migrator"]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://nanosiem:nanosiem@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: nanosiem
      # NAN-2003: migrator bootstraps the raw-SQL feature users when missing.
      CLICKHOUSE_RAWSQL_PASSWORD: ${CLICKHOUSE_RAWSQL_PASSWORD:-${CLICKHOUSE_PASSWORD:-nanosiem}}
      CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD: ${CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD:-${CLICKHOUSE_PASSWORD:-nanosiem}}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-nanosiem_admin_secret}
      CLICKHOUSE_SELF_USER: nanosiem
      RUST_LOG: ${RUST_LOG:-info}
      # NAN-2346: SIZE_IN_CELLS for the three prevalence CACHE dicts. The migrator
      # resolves the {prevalence_cache_cells*} placeholders in clickhouse/init.sql
      # and migration 172. COMPLEX_KEY_CACHE preallocates its whole cell array at
      # the first dictGet and CH rounds up to a power of two, so 5,000,000 burns
      # ~320 MiB to hold single-digit rows. Defaults below reproduce the historical
      # literals exactly — override in .env on a memory-tight box.
      NANO_PREVALENCE_CACHE_CELLS: ${NANO_PREVALENCE_CACHE_CELLS:-1000000}
      NANO_PREVALENCE_CACHE_CELLS_IP: ${NANO_PREVALENCE_CACHE_CELLS_IP:-5000000}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  nanosiem-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: nanosiem-api:latest
    container_name: nanosiem-api
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Run as host user to match volume permissions (avoids permission denied on config writes)
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      # Vector config directory for dynamic parser deployment (API writes, Vector reads)
      - ./config/vector:/etc/vector
    environment:
      # Vector config directory (must match volume mount)
      VECTOR_CONFIG_DIR: /etc/vector
      # NAN-1151: enrichment-lane ingest — identity providers POST raw records
      # to the dedicated nano_enrich source instead of writing ClickHouse
      # directly. Token must match the Vector service's VECTOR_AUTH_TOKEN.
      VECTOR_INGEST_URL: http://vector:8080/
      VECTOR_ENRICH_URL: http://vector:8090/
      VECTOR_AUTH_TOKEN: ${VECTOR_AUTH_TOKEN:-}
      # Vector reads its config from the shared directory: no HTTP delivery.
      NANO_VECTOR_CONFIG_DELIVERY: "off"
      # NAN-4907: nano-api writes the hashed ingest tokens file into the
      # mounted config dir Vector reads (/etc/vector/dynamic/ingest-tokens).
      NANO_INGEST_TOKENS_DELIVERY: shared_volume
      # NAN-4919: Nano Pipe draft preview runs tenant VRL in a resource-limited
      # worker process. Off unless explicitly enabled.
      NANO_PIPE_PREVIEW_ENABLED: ${NANO_PIPE_PREVIEW_ENABLED:-false}
      NANO_VECTOR_TAP_URL: http://vector:8687
      NANO_VECTOR_TAP_TOKEN: ${NANO_VECTOR_TAP_TOKEN:-}
      NANO_PLATFORM_INGEST_TOKEN: ${NANO_PLATFORM_INGEST_TOKEN:-}
      NANO_OTLP_EDGE_KEY: ${NANO_OTLP_EDGE_KEY:-}
      # PostgreSQL connection
      DATABASE_URL: postgres://nanosiem:nanosiem@postgres:5432/nanosiem
      # ClickHouse connection (runtime user - no DDL permissions for security)
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: nanosiem
      # NAN-2001: read-only raw-SQL pool creds. DualPool::from_env reads these two
      # passwords and defaults the usernames to nanosiem_rawsql /
      # nanosiem_rawsql_noaudit; boot fails if either is missing.
      CLICKHOUSE_RAWSQL_PASSWORD: ${CLICKHOUSE_RAWSQL_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD: ${CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      # ClickHouse admin credentials (for migrations only - has DDL permissions)
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-nanosiem_admin_secret}
      # ClickHouse self-referencing dictionary user (must exist — 'default' is removed)
      CLICKHOUSE_SELF_USER: nanosiem
      # Authentication
      JWT_SECRET: ${JWT_SECRET:-}
      # NAN-2042: shared service credential for private routes (/metrics).
      # Dev default only; Prometheus below presents the same value.
      NANO_SERVICE_TOKEN: ${NANO_SERVICE_TOKEN:-nanosiem-dev-service-token}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Encryption (required in production; dev uses NANOSIEM_ALLOW_DEFAULT_KEYS below)
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY:-}
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      # NAN-1355: lets the built-in public dev JWT/encryption keys be used when no real
      # secret is set. Local-dev only — prod composes (opensource) never set this, so a
      # missing secret fails closed even when DEV_MODE is on for HTTP cookies.
      NANOSIEM_ALLOW_DEFAULT_KEYS: ${NANOSIEM_ALLOW_DEFAULT_KEYS:-true}
      NRT_LAG_BUFFER_SECS: ${NRT_LAG_BUFFER_SECS:-60}
      NRT_MAX_BATCH_SIZE: ${NRT_MAX_BATCH_SIZE:-100000}
      NRT_MAX_CONCURRENT_RULES: ${NRT_MAX_CONCURRENT_RULES:-10}
      NRT_PHASE_MAX_SECS: ${NRT_PHASE_MAX_SECS:-300}
      # API server settings
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # CORS: Set CORS_ORIGINS in .env for production (e.g., https://your-domain.com)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      RUST_LOG: ${RUST_LOG:-info}
      # Cloudflare AI Gateway (for multi-provider AI support)
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CF_AIG_AUTH_TOKEN: ${CF_AIG_AUTH_TOKEN:-}
      # pivt docs grounding (NAN-5058): docs-search Worker caller token; empty = off.
      DOCS_SEARCH_TOKEN: ${DOCS_SEARCH_TOKEN:-}
      DOCS_SEARCH_URL: ${DOCS_SEARCH_URL:-https://docs-search.nano.rs}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Search Service - Handles /api/search endpoints
  # =============================================================================
  # NAN-4919: Nano Pipe live tap relay. Shares Vector's stable network
  # namespace so it is the ONLY client of Vector's loopback-bound API
  # (NAN-4918); nano-api reaches it at vector:8687 with a shared token. Holds
  # no database credentials and reads no event secrets. Idles harmlessly
  # (refuses to start) until NANO_VECTOR_TAP_TOKEN is set.
  vector-tap:
    image: nanosiem-api:latest
    command: ["nanosiem-api", "--vector-tap-relay"]
    network_mode: "service:vector-netns"
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    environment:
      NANO_VECTOR_TAP_TOKEN: ${NANO_VECTOR_TAP_TOKEN:-}
      NANO_VECTOR_TAP_LISTEN: 0.0.0.0:8687
      NANO_VECTOR_API_URL: http://127.0.0.1:8686
    # The namespace anchor outlives a Vector-only replacement (NAN-5004).
    depends_on:
      vector:
        condition: service_started

  nanosiem-search:
    build:
      context: .
      dockerfile: Dockerfile
      target: search
    image: nanosiem-search:latest
    container_name: nanosiem-search
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      # PostgreSQL connection
      DATABASE_URL: postgres://nanosiem:nanosiem@postgres:5432/nanosiem
      # ClickHouse connection
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: nanosiem
      # NAN-2001: read-only raw-SQL pool creds. DualPool::from_env reads these two
      # passwords and defaults the usernames to nanosiem_rawsql /
      # nanosiem_rawsql_noaudit; boot fails if either is missing. This is THE
      # service that serves POST /api/search/sql, so the pool is mandatory here.
      CLICKHOUSE_RAWSQL_PASSWORD: ${CLICKHOUSE_RAWSQL_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD: ${CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      # Authentication (same as API)
      JWT_SECRET: ${JWT_SECRET:-}
      # NAN-2042: shared service credential for private routes (/metrics).
      # Dev default only; Prometheus below presents the same value.
      NANO_SERVICE_TOKEN: ${NANO_SERVICE_TOKEN:-nanosiem-dev-service-token}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Encryption (required in production; dev uses NANOSIEM_ALLOW_DEFAULT_KEYS below)
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY:-}
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      # NAN-1355: lets the built-in public dev JWT/encryption keys be used when no real
      # secret is set. Local-dev only — prod composes (opensource) never set this, so a
      # missing secret fails closed even when DEV_MODE is on for HTTP cookies.
      NANOSIEM_ALLOW_DEFAULT_KEYS: ${NANOSIEM_ALLOW_DEFAULT_KEYS:-true}
      # Search service settings
      SEARCH_PORT: 3002
      # CORS: Set CORS_ORIGINS in .env for production (e.g., https://your-domain.com)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      RUST_LOG: ${RUST_LOG:-info}
      # AI Pipe agent (optional — queries with | ai require Cloudflare AI Gateway)
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CF_AIG_AUTH_TOKEN: ${CF_AIG_AUTH_TOKEN:-}
      # Valkey (Redis-compatible) cache for search result caching (optional — graceful degradation)
      REDIS_URL: redis://dragonfly:6379
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Jobs Service - Background tasks (detection, enrichment, tuning, cleanup)
  # =============================================================================
  nanosiem-jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs
    image: nanosiem-jobs:latest
    container_name: nanosiem-jobs
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      DATABASE_URL: postgres://nanosiem:nanosiem@postgres:5432/nanosiem
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: nanosiem
      # NAN-2001: read-only raw-SQL pool creds. DualPool::from_env reads these two
      # passwords and defaults the usernames to nanosiem_rawsql /
      # nanosiem_rawsql_noaudit; boot fails if either is missing.
      CLICKHOUSE_RAWSQL_PASSWORD: ${CLICKHOUSE_RAWSQL_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD: ${CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_ADMIN_USER: nanosiem_admin
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-nanosiem_admin_secret}
      CLICKHOUSE_SELF_USER: nanosiem
      # Identity sync runs in jobs; use the dedicated durable enrichment source.
      VECTOR_ENRICH_URL: http://vector:8090/
      VECTOR_AUTH_TOKEN: ${VECTOR_AUTH_TOKEN:-}
      NANO_VECTOR_CONFIG_DELIVERY: "off"
      JWT_SECRET: ${JWT_SECRET:-}
      # NAN-2042: shared service credential for private routes (/metrics).
      # Dev default only; Prometheus below presents the same value.
      NANO_SERVICE_TOKEN: ${NANO_SERVICE_TOKEN:-nanosiem-dev-service-token}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY:-}
      NANOSIEM_DEV_MODE: ${NANOSIEM_DEV_MODE:-false}
      # NAN-1355: lets the built-in public dev JWT/encryption keys be used when no real
      # secret is set. Local-dev only — prod composes (opensource) never set this, so a
      # missing secret fails closed even when DEV_MODE is on for HTTP cookies.
      NANOSIEM_ALLOW_DEFAULT_KEYS: ${NANOSIEM_ALLOW_DEFAULT_KEYS:-true}
      CLOUDFLARE_AI_GATEWAY_URL: ${CLOUDFLARE_AI_GATEWAY_URL:-}
      CF_AIG_AUTH_TOKEN: ${CF_AIG_AUTH_TOKEN:-}
      JOBS_PORT: 3003
      LEADER_ELECTION_ENABLED: "true"
      RUST_LOG: ${RUST_LOG:-info}
    # NAN-2042: the jobs health/metrics listener binds loopback inside the
    # container (JOBS_BIND_ADDR unset), so it is not published. The healthcheck
    # below runs in-container; scripts/local-stack.sh runs jobs on the host.
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # NAN-4914: pull-feed runner (Pull feeds page). Its own container: the VRL
  # worker sandbox re-execs this binary, so it gets no jobs/API secrets —
  # only PostgreSQL, the credential key and the Vector HEC token. Opt-in:
  #   docker compose --profile pull-feeds up -d nanosiem-connector-runner
  nanosiem-connector-runner:
    profiles: ["pull-feeds"]
    build:
      context: .
      dockerfile: Dockerfile
      target: connector-runner
    image: nanosiem-connector-runner:latest
    container_name: nanosiem-connector-runner
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/nano-connector:rw,noexec,nosuid,size=1m,uid=999,gid=999
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999
    environment:
      DATABASE_URL: postgres://nanosiem:nanosiem@postgres:5432/nanosiem
      NANOSIEM_ENCRYPTION_KEY: ${NANOSIEM_ENCRYPTION_KEY:-}
      NANOSIEM_ALLOW_DEFAULT_KEYS: ${NANOSIEM_ALLOW_DEFAULT_KEYS:-true}
      CONNECTOR_HEC_URL: http://vector:8088
      # NAN-4931 (G22): identity directory feeds write the ClickHouse user
      # directory (`user_registry`); unset, identity feeds are refused.
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nanosiem
      CLICKHOUSE_USER: nanosiem
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nanosiem}
      # NAN-4907 platform multiplex credential, never the install token.
      NANO_PLATFORM_INGEST_TOKEN: ${NANO_PLATFORM_INGEST_TOKEN:-}
      CONNECTOR_POLL_INTERVAL_SECS: ${CONNECTOR_POLL_INTERVAL_SECS:-30}
      CONNECTOR_MAX_CONCURRENT: "2"
      CONNECTOR_VRL_MAX_WORKERS: "4"
      CONNECTOR_VRL_WORKER_AS_BYTES: "268435456"
      CONNECTOR_HEALTH_FILE: /run/nano-connector/healthy
      # Docker's default seccomp profile and an undelegated cgroup: the VRL
      # sandbox uses what is available and reports DEGRADED otherwise.
      NANO_CONNECTOR_SECCOMP: prefer
      NANO_CONNECTOR_CGROUP: prefer
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nanosiem-api:
        condition: service_healthy
      vector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /run/nano-connector -name healthy -mmin -2 -print)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: ${CONNECTOR_MEM_LIMIT:-2G}

  # Stable network namespace: replacing only Vector must not strand the tap
  # relay in a retired container namespace (NAN-5004).
  vector-netns:
    image: nginx:alpine@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
    container_name: nanosiem-vector-netns
    entrypoint: ["/bin/sh", "-ec"]
    command: ["trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $$!; done"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - vector
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:9598:9598"
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:514:514/tcp"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:24224:24224"

  vector:
    # Pinned, not `latest-alpine`: a floating tag silently drifts local dev away
    # from what managed runs, and the committed bundle is only known-good against
    # specific versions. 0.56 matches the managed pin (nano-main types.ts).
    #
    # nano-rs/vector fork (nano/v0.61 = upstream 0.61.0 + nano patches, NAN-4904),
    # pinned by digest. Debian-based: there is no alpine variant.
    #
    # Vector 0.57+ disables environment variable interpolation by default. The
    # static configs use `${NAME:-default}` everywhere, so the command below opts
    # back in with --dangerously-allow-env-var-interpolation (trusted,
    # installation-owned configs only). Without the flag the hazard is
    # asymmetric and `vector validate` does NOT catch the bad half:
    #   numeric  max_bytes = ${VECTOR_BATCH_MAX_BYTES:-52428800}  -> TOML parse
    #            error, Vector refuses to start. Loud.
    #   string   valid_tokens = ["${VECTOR_AUTH_TOKEN}"]          -> validates
    #            CLEAN and accepts the literal text `${VECTOR_AUTH_TOKEN}` as
    #            the token. Silent.
    # So never drop the flag, and after any Vector bump confirm env-driven values
    # resolve at runtime (send HEC with the real token and with the literal).
    image: ghcr.io/nano-rs/vector:0.61.0-nano.7-debian@sha256:119dc25de7b6840285ac80d5c027ea7308513a334d0a0713b3352b5b30328c9c
    container_name: nanosiem-vector
    network_mode: "service:vector-netns"
    security_opt:
      - no-new-privileges:true
    environment:
      # Authentication token for HTTP ingestion endpoint
      VECTOR_AUTH_TOKEN: ${VECTOR_AUTH_TOKEN:-}
      # NAN-4907: OTLP edge assertion key; explicit static-fallback state
      # (a missing tokens file fails closed unless "true").
      NANO_OTLP_EDGE_KEY: ${NANO_OTLP_EDGE_KEY:-}
      NANO_INGEST_STATIC_FALLBACK: ${NANO_INGEST_STATIC_FALLBACK:-false}
      NANO_FUTURE_TIMESTAMP_SKEW_SECONDS: ${NANO_FUTURE_TIMESTAMP_SKEW_SECONDS:-86400}
      # Vector data directory (used for disk buffer persistence)
      VECTOR_DATA_DIR: /var/lib/vector
      # ClickHouse connection settings (for direct ClickHouse ingestion)
      # NOTE: Hardcoded to Docker network hostname - do NOT use env var substitution
      # as shell environment can override and break Docker-internal networking
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-nanosiem}
      CLICKHOUSE_USER: nanosiem_vector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_VECTOR_PASSWORD:-nanosiem_vector_secret}
      VECTOR_CLICKHOUSE_REQUEST_CONCURRENCY: ${VECTOR_CLICKHOUSE_REQUEST_CONCURRENCY:-6}
      VECTOR_DISK_BUFFER_MAX_BYTES: ${VECTOR_DISK_BUFFER_MAX_BYTES:-268435488}
      VECTOR_DISK_BUFFER_TOTAL_BUDGET_BYTES: ${VECTOR_DISK_BUFFER_TOTAL_BUDGET_BYTES:-2147483904}
      VECTOR_DISK_BUFFER_COUNT: ${VECTOR_DISK_BUFFER_COUNT:-8}
      # NAN-1443: the OCSF lane inserts into the `ocsf_logs_raw` ENGINE=Null
      # landing table; the `ocsf_logs_raw_mv` MV derives the stored row into
      # `ocsf_logs` (which no longer stores the full `event` blob). The generated
      # OCSF sink reads this; default keeps it pointed at the landing table.
      CLICKHOUSE_OCSF_LOGS_TABLE: ${CLICKHOUSE_OCSF_LOGS_TABLE:-ocsf_logs_raw}
      # NAN-4953: nano-api's config dir here is /etc/vector (VECTOR_CONFIG_DIR), so its
      # deploy lock file is too; the entrypoint takes the same lock while migrating.
      NANO_VECTOR_LOCK_FILE: /etc/vector/.nano-config.lock
    volumes:
      # Mount Vector configuration directory (base configs are read-only)
      - ./config/vector:/etc/vector:ro
      # Parsers directory must be writable for dynamic parser deployment via API
      - ./config/vector/sources/parsers:/etc/vector/sources/parsers
      # Source configs directory for cloud pull sources (GCP Pub/Sub, AWS S3, Kafka, etc.)
      - ./config/vector/sources/configs:/etc/vector/sources/configs
      # Persist disk buffer for durability across restarts
      # Requirement 2.5: Buffer survives Vector restarts without data loss
      - vector-data:/var/lib/vector
      # Mount TLS certificates (optional, create if needed)
      - ./config/vector/certs:/etc/vector/certs:ro
    # Use --config-dir to automatically load all .toml files from the config directory
    # This enables dynamic parser deployment without manual config updates
    # Files are loaded in alphabetical order, so use prefixes for ordering:
    #   00-base.toml, 10-transforms.toml, 20-parsers.toml, etc.
    # Note: --config-dir doesn't recurse, so we need to specify subdirectories explicitly
    # --watch-config enables automatic reload when config files change (no SIGHUP needed)
    # NAN-4953: through the nano entrypoint, so parser / source-config files rendered before
    # their env-escaping are migrated before Vector reads them (the dirs come from the
    # --config-dir arguments below), under the config lock nano-api's deploys hold.
    entrypoint: ["/bin/sh", "/etc/vector/.nano/vector-entrypoint.sh"]
    command: ["--dangerously-allow-env-var-interpolation", "--config-dir", "/etc/vector", "--config-dir", "/etc/vector/sources/parsers", "--config-dir", "/etc/vector/sources/configs", "--config-dir", "/etc/vector/sinks", "--watch-config"]
    depends_on:
      vector-netns:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      # The Debian image has no wget/curl: ask Vector's API health endpoint
      # (00-base.toml [api], 127.0.0.1:8686, loopback only) over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8686 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # NAN-4906: one-shot pre-start check. Aborts on an x86-64 CPU without AVX2
  # (CH 26.6+ needs it) and strips the s3-disk elements CH 26.10 refuses to
  # start with from a persisted tiering storage.xml. ClickHouse only starts
  # after it exits 0. Same image as the server, so nothing extra to pull.
  clickhouse-preflight:
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    container_name: nanosiem-clickhouse-preflight
    entrypoint: ["/bin/sh", "/preflight/clickhouse-preflight.sh", "/config.d"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./clickhouse/config.d:/config.d
      - ./clickhouse/preflight:/preflight:ro
    restart: "no"

  clickhouse:
    # Rollback: the ONLY supported downgrade target from 26.10 is
    # 26.8.36.3@sha256:d426d2f6… (see docs/dev/CLICKHOUSE-UPGRADE-NOTES.md).
    # 26.4/26.5 cannot read 26.10 text indexes and are CVE-2026-116366 exposed.
    image: clickhouse/clickhouse-server:26.10.3.7@sha256:739e099abd1157390960a59e4532d21781d8fde57e6e4151cb920ea02c30b1ce
    container_name: nanosiem-clickhouse
    depends_on:
      clickhouse-preflight:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      # NAN-5011: no CLICKHOUSE_DB / CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
      # (same as docker-compose.opensource.yml, NAN-809 / NAN-810). With them
      # the upstream entrypoint writes its own default-user.xml (a passwordless
      # `default` with access management) into users.d, which was this
      # checkout's writable clickhouse/users.d. users.d/default-user.xml owns
      # `default`: container-local, no access management. The migrator creates
      # the nanosiem database as the admin user.
      # NAN-839: users.d/nanosiem-users.xml resolves these via from_env;
      # missing them resolves the passwords to "" and breaks every migrator
      # / healthcheck auth. Defaults match scripts/start-microservices-dev.sh
      # and the healthcheck below.
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-nanosiem_admin_secret}
      CLICKHOUSE_NANOSIEM_PASSWORD: ${CLICKHOUSE_NANOSIEM_PASSWORD:-nanosiem}
      # NAN-1384 (G18): INSERT-only credential for direct OCSF writers
      # (users.d/nanosiem-users.xml `nanosiem_ingest`).
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:-nanosiem_ingest}
      CLICKHOUSE_VECTOR_PASSWORD: ${CLICKHOUSE_VECTOR_PASSWORD:-nanosiem_vector_secret}
      # NAN-2001: read-only raw-SQL feature users, resolved by from_env in
      # users.d/nanosiem-users.xml (`nanosiem_rawsql` / `nanosiem_rawsql_noaudit`).
      CLICKHOUSE_RAWSQL_PASSWORD: ${CLICKHOUSE_RAWSQL_PASSWORD:-${CLICKHOUSE_PASSWORD}}
      CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD: ${CLICKHOUSE_RAWSQL_NOAUDIT_PASSWORD:-${CLICKHOUSE_PASSWORD}}
    ports:
      # Native protocol (for clickhouse-rs client)
      - "127.0.0.1:9000:9000"
      # HTTP interface (for debugging/admin)
      - "127.0.0.1:8123:8123"
      # Prometheus metrics endpoint (configured in config.d/monitoring.xml)
      - "127.0.0.1:9363:9363"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      # init.sql is now run by the API via run_init_sql() on startup (not docker-entrypoint)
      # Dynamic config directory for storage tiering policies (generated by API)
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      # User profiles and query limits. Read-only: nothing in the container
      # may rewrite the users it authenticates (NAN-5011).
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "nanosiem", "--password", "nanosiem", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # Cache (Dragonfly — Redis-compatible, used for search result caching)
  # =============================================================================

  dragonfly:
    # NAN-5082: Valkey replaced Dragonfly (relicensed off open source). The
    # service key stays `dragonfly`: it is the hostname in REDIS_URL.
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: nanosiem-valkey
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--io-threads", "2", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # Monitoring Stack
  # =============================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nanosiem-prometheus
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      NANO_SERVICE_TOKEN: ${NANO_SERVICE_TOKEN:-nanosiem-dev-service-token}
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # NAN-2042: /metrics on api/search requires the service credential; hand
    # it to Prometheus as a credentials_file (Prometheus config has no env
    # expansion), written owner-only inside the container.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$${NANO_SERVICE_TOKEN}" > /tmp/nano-service-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d --web.enable-lifecycle
    depends_on:
      - postgres
      - clickhouse
      - vector
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: nanosiem-grafana
    security_opt:
      - no-new-privileges:true
    # No shipped admin password. GRAFANA_PASSWORD from .env wins; without it a
    # random one is generated and logged once (`docker compose logs grafana`).
    # Grafana applies it only when it first creates its database, so an
    # existing grafana-data volume keeps the password it already has.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$${GRAFANA_PASSWORD:-}" ]; then
          GRAFANA_PASSWORD="$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "Grafana admin password (generated, first start only): $${GRAFANA_PASSWORD}"
        fi
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_PASSWORD}"
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nanosiem-postgres-exporter
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      DATA_SOURCE_NAME: "postgresql://nanosiem:nanosiem@postgres:5432/nanosiem?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: nanosiem-node-exporter
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped

  # =============================================================================
  # Documentation (Fumadocs - Next.js static export)
  # =============================================================================

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: nanosiem-docs:latest
    container_name: nanosiem-docs
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  nanosiem-data:
  vector-data:
  clickhouse-data:
  clickhouse-logs:
  prometheus-data:
  grafana-data:
