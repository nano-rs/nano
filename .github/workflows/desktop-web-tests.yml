name: desktop + web tests

# NAN-2198 — the merge gate ran NOTHING for either of these packages.
#
# `nanosiem-web` has a dozen `npm run test:*` suites and `nano-desktop/src-tauri`
# has 111 Rust tests. No workflow invoked any of them: the only web-touching
# jobs were the dead-links gate, the image build, and `desktop-release.yml`,
# which is `workflow_dispatch`-only. The main `test` job covers the root cargo
# workspace, and `src-tauri` is deliberately its OWN workspace — so it was
# outside that too.
#
# Three bugs shipped through that gap in a single day:
#   - NAN-2185  the desktop terminal could not spawn a shell on Windows at all;
#               a `#[cfg(windows)]` branch nothing compiled, let alone ran.
#   - NAN-2191  UI text painted in a surface colour, invisible in both themes.
#               Valid Tailwind, so typecheck and build both passed.
#   - NAN-2193  routing presets naming fields the collector never emits.
#
# Each had (or now has) a test that catches it. None of those tests ran anywhere
# except on a developer's laptop, which is the same as not existing.

on:
  pull_request:
    paths:
      - "nano-desktop/**"
      - "nanosiem-web/**"
      - ".github/workflows/desktop-web-tests.yml"
  workflow_dispatch:

concurrency:
  group: desktop-web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # NAN-2283: per-job path gating. The workflow-level `paths:` filter above is
  # the union of both packages, so before this job existed a `nanosiem-web`-only
  # PR still started every job below — including `desktop`, which runs Rust
  # tests that a TypeScript change cannot possibly affect. Same `dorny` idiom as
  # build-and-push.yml's `changes` job.
  #
  # `workflow_dispatch` has no base ref to diff against, so the filter outputs
  # are empty there; every `if:` below carries an explicit dispatch escape so a
  # manual run still executes everything.
  #
  # Every gate below FAILS OPEN (`needs.changes.result != 'success'`). If this
  # job breaks, the dependents run instead of silently skipping — a broken gate
  # that quietly reports "skipped" on a green PR is exactly the NAN-2198 failure
  # this workflow exists to end. Wasting a run costs minutes; not running the
  # tests costs a shipped bug.
  changes:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      # Required, and NOT optional the way it is in build-and-push.yml's copy of
      # this job. That one runs on `push`, where paths-filter diffs locally with
      # git. On `pull_request` it calls the GitHub API to list changed files, and
      # a `permissions:` block replaces the defaults rather than adding to them —
      # so without this the action dies on "Resource not accessible by
      # integration" and every dependent job skips.
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'nano-desktop/**'
              - '.github/workflows/desktop-web-tests.yml'
            web:
              - 'nanosiem-web/**'
              - '.github/workflows/desktop-web-tests.yml'

  web:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    # Self-hosted only (repo rule — never ubuntu-latest).
    runs-on: [self-hosted, Linux, X64]
    # Raised from 15 for the open-edition build step added at the end (NAN-2356).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        working-directory: nanosiem-web
        run: npm ci

      # Typecheck is not a substitute for the suites below — NAN-2191 shipped
      # invisible text through a clean `tsc`.
      - name: Typecheck
        working-directory: nanosiem-web
        run: npm run typecheck

      # Run every `test:*` suite the package declares, discovered from
      # package.json rather than listed here, so a newly added suite is picked
      # up automatically instead of silently never running — which is the exact
      # failure this workflow exists to end.
      #
      # `test:deadlinks` and `test:e2e:404` are excluded: the first already has
      # its own required gate (frontend dead-links) and the second needs a live
      # stack with auth.
      - name: Run web test suites
        working-directory: nanosiem-web
        run: |
          set -euo pipefail
          suites=$(node -e "
            const s = require('./package.json').scripts;
            const skip = new Set(['test:deadlinks', 'test:e2e:404']);
            console.log(Object.keys(s).filter(k => k.startsWith('test:') && !skip.has(k)).join(' '));
          ")
          echo "discovered suites: $suites"
          [ -n "$suites" ] || { echo 'no test:* scripts found — did they get renamed?'; exit 1; }
          failed=""
          for s in $suites; do
            echo "::group::npm run $s"
            npm run --silent "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi

      # NAN-2356: CI only ever built the ENTERPRISE bundle, so anything that
      # breaks the open edition landed green on main and surfaced 40 minutes
      # into a `push_open_core=true` publish — or, worse, shipped. NAN-1190 was
      # a missing stub caught that way; NAN-2356 was an inert "+ New Dashboard"
      # that no build could have caught, which is why the stub-gating suite
      # above runs too.
      #
      # `VITE_EDITION=open` swaps `@/enterprise` to `src/enterprise-stubs`
      # (vite.config.ts resolveEdition), so this is the only step that proves
      # every stub the open bundle needs actually exists and type-checks.
      - name: Open-edition build
        working-directory: nanosiem-web
        env:
          VITE_EDITION: open
        run: npm run build

  desktop-web:
    # The `web` job above runs in `nanosiem-web`. `nano-desktop` is a SECOND
    # npm package with its own suites, and nothing ran them — the same gap this
    # workflow was created to close, one directory over.
    #
    # It owns the generated-types drift gate (`api-types.gen.test.ts`), which
    # regenerates from the committed spec and fails when the checked-in
    # TypeScript differs. That gate was written to stop desktop↔API wire
    # mismatches (NAN-2263, ~30 of them) and had never executed in CI.
    #
    # Linux + Node only: no Tauri, no webview, so this does not need the macOS
    # runner the `desktop` job below requires.
    needs: [changes]
    # Gated on BOTH packages, deliberately. `nano-desktop` reuses source from
    # `nanosiem-web/src` (vite aliases at runtime, direct resolution during
    # `tsc`), so a web-only change can break this typecheck. Cheap to run — it
    # is on the self-hosted X64 box — so err toward running it.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Desktop imports shared TypeScript directly from nanosiem-web. Bare
      # imports inside those files resolve from nanosiem-web/node_modules, so a
      # desktop-only install leaves React, Radix, and CodeMirror unresolved.
      - name: Install shared web deps
        working-directory: nanosiem-web
        run: npm ci

      - name: Install deps
        working-directory: nano-desktop
        run: npm ci

      - name: Typecheck
        working-directory: nano-desktop
        run: npm run typecheck

      # `vitest run` — includes the generated-types drift gate.
      - name: Run desktop web tests
        working-directory: nano-desktop
        run: npm test

  desktop:
    # `nano-desktop/src-tauri` is its own cargo workspace, excluded from the
    # root one, so the main `test` job never saw it.
    #
    # macOS rather than the self-hosted Linux runners, for the same reason
    # `desktop-release.yml` uses it: Tauri needs a system webview, and macOS
    # already has one. On Linux this job would need
    # libwebkit2gtk/libsoup/libjavascriptcoregtk installed — and the repo has
    # exactly one precedent for `apt-get` (sync-mirror), which does it inside
    # `container: rust:1-bookworm`, not on the bare runner. Installing on the
    # shared self-hosted box would assume passwordless sudo and pollute it on
    # every run; using a container instead trades that for the root-owned
    # workspace files `build-and-push` deliberately avoids. macOS sidesteps
    # both — verified: the 111 tests run there with zero extra packages.
    #
    # NAN-2283: self-hosted macOS (`mac-studio`, M1 Max) instead of
    # `macos-latest`. GitHub-hosted macOS bills at 10x on private repos, and
    # this job plus desktop-release.yml consumed ~1,230 of the 2,000-minute
    # monthly allowance in July on its own. The Studio is Apple Silicon like
    # the hosted runner it replaces, so nothing about the build changes.
    #
    # The `changes` gate above is what the old comment here claimed but did not
    # do: `nanosiem-web`-only PRs no longer start this job at all.
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: nano-desktop/src-tauri

      # NOT `--locked`: `.gitignore` blanket-ignores `Cargo.lock` and the
      # desktop lockfile was never force-added, unlike the root workspace's.
      # So `src-tauri` resolves dependencies fresh on every build and this job
      # cannot pin them. Worth fixing separately — a shipped installer built
      # from a floating dependency set is not reproducible — but committing the
      # lockfile is its own decision, so it does not belong in this workflow.
      - name: Run desktop tests
        working-directory: nano-desktop/src-tauri
        run: cargo test
