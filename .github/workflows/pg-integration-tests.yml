name: pg-integration-tests

# NAN-1272 — runs the DB-backed Postgres integration suites that used to be
# gated off behind `#![cfg(any())]` (so they never compiled or ran). Spins up a
# throwaway Postgres, then `cargo test -- --ignored` runs the suites; each suite
# applies the project migrations in-process via the canonical
# `run_postgres_migrations` runner (see tests/common/mod.rs), so the schema
# matches production. No app image build and no ClickHouse needed.
#
# These suites guard the class of bug NAN-1269 shipped: a column↔struct-field
# drift in a runtime-checked `sqlx::query_as` that the compiler can't see and
# only fails when executed against a real row.
on:
  # NAN-4971: nightly full run, restored from the lake line ('17 4 * * *').
  # Scheduled runs fire only from the default branch, so this takes effect
  # once this tree is main.
  schedule:
    - cron: '17 4 * * *'
  pull_request:
    # NAN-5791: on a PR, runs only while it carries the optional `ready-to-merge`
    # opt-in label (jobs' `if:`); the heavy run is the push-to-main one below.
    # docs-internal/ci-runner-pools.md#ready-to-merge-label-nan-5791
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "**/*.rs"
      # A dependency bump, feature flip, workspace-membership change or a new
      # test target changes what compiles and what runs without touching a
      # single .rs file, and would otherwise skip this gate entirely.
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "migrations/**"
      # The IR/SOC benchmark corpora are checked by soc_ir_corpus_tests.rs
      # (nanosiem-core lib tests): a corpus-only edit must run that gate too.
      - "benchmarks/results/soc_ir_corpus*.json"
      - ".github/workflows/pg-integration-tests.yml"
      # Attaches the host sccache to the cargo container.
      - "scripts/ci/cargo-cache-docker-args.sh"
  # Heavy suite on main after merges; same paths as the PR trigger.
  # docs-internal/ci-runner-pools.md#heavy-gates-on-main
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      # A dependency bump, feature flip, workspace-membership change or a new
      # test target changes what compiles and what runs without touching a
      # single .rs file, and would otherwise skip this gate entirely.
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "migrations/**"
      # The IR/SOC benchmark corpora are checked by soc_ir_corpus_tests.rs
      # (nanosiem-core lib tests): a corpus-only edit must run that gate too.
      - "benchmarks/results/soc_ir_corpus*.json"
      - ".github/workflows/pg-integration-tests.yml"
      # Attaches the host sccache to the cargo container.
      - "scripts/ci/cargo-cache-docker-args.sh"
  workflow_dispatch:

# Read-only token on every trigger: no run of this gate (PR, push to main,
# schedule, dispatch) can push, publish, sign or release.
permissions:
  contents: read

# NAN-5791: a labeled/unlabeled event for any other label gets its own group
# (its jobs skip), so it never cancels a real run. A push to main joins the
# `heavy-` group without cancel-in-progress: one run going plus at most one
# pending, the pending one replaced by the newest merge, so a burst of merges
# coalesces into two runs (docs-internal/ci-runner-pools.md#heavy-gates-on-main).
concurrency:
  group: ${{ github.event_name == 'push' && 'heavy-' || '' }}pg-integration-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-to-merge' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ready-to-merge')) }}
    # Self-hosted only (repo rule — never ubuntu-latest). A throwaway Postgres
    # container with a unique name and a random host port keeps concurrent runs
    # on the same host isolated (unlike the compose stack's fixed container_names).
    #
    # NAN-1282: the self-hosted runner host has neither `cargo` on the non-login
    # shell PATH nor system OpenSSL/pkg-config (which `openssl-sys`, pulled in by
    # clickhouse's `native-tls` feature, needs to build). Rather than manage host
    # deps, we run cargo inside `rust:1-bookworm` (ships cargo + libssl-dev +
    # pkg-config) — the same pattern as sync-mirror.yml / enrichment-lane-gate.yml.
    # The cargo container joins the host network so it reaches the Postgres port
    # published on 127.0.0.1, and writes its target dir to an in-container path
    # so no root-owned build artifacts land in the workspace.
    runs-on: [self-hosted, Linux, nano-pr] # any arch (NAN-5743)
    # 90, not 45: a cold compile of the whole workspace test set ran past 45
    # minutes on main twice with every test still passing (runs 44983042431
    # and the next one). sccache below makes warm runs much shorter; this is
    # the headroom for a cold host or a Cargo.lock bump.
    timeout-minutes: 90
    env:
      PG_CONTAINER: nan1272-pgit-${{ github.run_id }}
      RUST_IMAGE: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    steps:
      # A prior container job can leave root-owned files in this persistent
      # self-hosted workspace. Reclaim them before actions/checkout tries to
      # unlink the old tree (NAN-773).
      - name: Reclaim workspace before checkout (NAN-773)
        run: |
          # NAN-5733: nano-ci labels let the runner pre-job hook remove this container
          # if the job is cancelled (scripts/ci/runner-pre-job.sh).
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm -v "$GITHUB_WORKSPACE:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" .

      - name: Checkout
        uses: actions/checkout@v4

      - name: Start throwaway Postgres
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            -d --rm --name "$PG_CONTAINER" \
            -e POSTGRES_USER=nanosiem \
            -e POSTGRES_PASSWORD=nanosiem \
            -e POSTGRES_DB=nanosiem \
            -p 127.0.0.1::5432 \
            postgres:18
          # Resolve the randomly-assigned host port and export DATABASE_URL.
          host_port="$(docker port "$PG_CONTAINER" 5432/tcp | head -1 | sed 's/.*://')"
          echo "DATABASE_URL=postgres://nanosiem:nanosiem@localhost:${host_port}/nanosiem" >> "$GITHUB_ENV"
          echo "Waiting for Postgres on :${host_port} ..."
          for i in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U nanosiem -d nanosiem >/dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready in time"
          docker logs "$PG_CONTAINER" --tail 50 || true
          exit 1

      - name: DB-backed suites (cargo in rust container)
        run: |
          # --network host: reach the Postgres published on 127.0.0.1:<host_port>
          #   (DATABASE_URL above uses localhost).
          # CARGO_TARGET_DIR=/tmp/target: ephemeral, in-container — keeps
          #   root-owned build output out of the host workspace (NAN-773).
          # Shared registry volume caches crate downloads across runs
          #   (read-mostly; cargo's own file locks make concurrent access safe).
          # Run each suite as its own sequential cargo invocation. The suites
          # share one Postgres and each applies migrations via migrated_pool;
          # the harness only guards concurrent migration within a binary
          # (OnceCell), not across binaries, and the fresh-init CREATE TABLEs
          # are not advisory-locked. Serial invocations keep the migrations
          # from racing.
          #
          # Suites are grouped by which schema their migrated_pool applies:
          #   - nanosiem-core: open migration path only (run_postgres_migrations).
          #   - nanosiem-enterprise: open + enterprise overlay (postgres-enterprise).
          # case_stats_visibility_integration tests the enterprise `cases`
          # table, so it lives under -p nanosiem-enterprise (NAN-1283).
          #
          # NAN-1574: case_stats runs with --test-threads=1. Its tests share
          # the one migrated_pool Postgres and assert on get_stats counts that
          # include public "peer" cases owned by other users (NAN-684). Run in
          # parallel (the default), a sibling test's concurrent public-case
          # insert shifts the global count between a test's baseline and
          # excluded reads → flaky `N vs N-1`. Serial = deterministic.
          #
          # NAN-2029: case_route_authz_guard is the ONLY entry here without
          # `-- --ignored`. It needs no database (it source-scans the case
          # authorization surface), and `--ignored` runs ONLY ignored tests, so
          # listing it with the flag would silently execute nothing. This
          # workflow is the sole checked-in job that runs `cargo test`, and it
          # triggers on any `**/*.rs` change, so this is where a non-DB
          # regression guard has to live to actually gate a PR.
          #
          # NAN-2223: grant_authority_integration connects to an ALREADY-migrated
          # database (it has no migrated_pool of its own), so it must run AFTER a
          # suite that applied migrations. Like every suite migrated to
          # nanosiem-test-db (NAN-5967), it reads NANOSIEM_TEST_DATABASE_URL.
          # It had never been wired into this job at all, which is why the
          # privilege-grant regressions it guards were never gated on a PR.
          #
          # NAN-2229: nanosiem-search --lib carries authz_guard, the sibling of
          # case_route_authz_guard for the search surface. It was never wired in
          # here, so it sat RED on main behind a parser false positive while PRs
          # merged green. Whole --lib rather than the one module: it is 30 tests
          # in 0.02s, and the wider net costs nothing. Needs no database, same as
          # case_route_authz_guard, so it takes no --ignored flag.
          #
          # NAN-2262: the first line below now runs the WHOLE non-DB suite, which
          # subsumes the two entries above (kept for their comments, and because
          # naming a guard is how it survives a future edit to this list).
          #
          # Rationale for the wider net: an allowlist of targets is why 9 tests
          # across 2 binaries sat red on main for a month. Of 79 test binaries
          # under nanosiem-core/tests, 3 were listed here; nanosiem-core --lib
          # (3,165 tests) was not run at all. Anything not named simply never
          # gated a PR, so a deliberate SQL rewrite in July silently stranded the
          # assertions that tracked it.
          #
          # --workspace --lib --tests is 5,616 tests across 116 suites. Test
          # EXECUTION is seconds; the real cost is COMPILING ~116 test binaries
          # where this job previously built ~14. CARGO_TARGET_DIR is inside the
          # container and is not persisted between runs (a target dir is
          # mtime-based and unsafe to share across branches or concurrent jobs,
          # docs-internal/ci-runner-fleet.md). Instead the host sccache is
          # attached: content-addressed, shared safely, bounded by its own LRU,
          # so rustc outputs survive between runs. It ran past the old 45-minute
          # timeout cold on main; see timeout-minutes above.
          #
          # cargo-cache-docker-args.sh: on a fleet host with a ci_cache profile,
          # --env-file /etc/nano-ci/cargo.env (RUSTC_WRAPPER=sccache,
          # CARGO_INCREMENTAL=0, SCCACHE_BASEDIRS=/ws) plus the pinned sccache
          # client; this step adds the sccache volume at /sccache only then.
          # The bare -e CARGO_BUILD_JOBS comes after it, so the runner cap
          # (NAN-5806) wins when set and the profile value applies otherwise.
          # Anywhere else nothing changes from before.
          #
          # --no-fail-fast so one red binary does not mask the rest, which is
          # exactly how the second and third failing binaries stayed hidden
          # behind the first when this was found. It still exits non-zero, so
          # `set -e` fails the job.
          #
          # --test-threads=1 is REQUIRED, not tidiness. This job exports
          # TEST_DATABASE_URL, and --tests pulls in binaries whose non-ignored
          # tests hit that database directly. migration_fresh_init is the sharp
          # one: five non-ignored tests that drop and recreate a shared database
          # and whose own header says single-threaded, because the scenarios
          # share process env. Run in parallel they range from false-green early
          # returns after a CREATE DATABASE collision to one test killing
          # another connection.
          #
          # They passed the first CI run of this change, which is the trap — a
          # race that wins once looks identical to no race, and a flaky required
          # check is worse than an absent one. Serialising costs ~1 minute of
          # execution against a compile that dominates the job anyway.
          #
          # DB-backed suites stay listed explicitly below: they are #[ignore]d,
          # so this line does not run them, and several need --test-threads=1.
          # NAN-2225: migration_seed_parity builds BOTH migration paths in
          # throwaway databases of its own and diffs the seeded RBAC state. It is
          # the only thing that can catch a pre-baseline seed that 177 fails to
          # replay — the NAN-2212 / NAN-2218 / NAN-2221 class, all of which were
          # found by humans reading migrations rather than by CI. Single-threaded:
          # it sets NANOSIEM_MIGRATION_MODE in the process env to force each path.
          #
          # IMPORTANT: the `bash -c '...'` body below MUST stay apostrophe-free.
          # An apostrophe closes the single-quoted -c string, so everything after
          # it runs on the bare host instead of in the container (cargo: command
          # not found — NAN-1574 regressed this with `test's` in an inline
          # comment). Keep all prose up here in these host-shell `#` comments,
          # where apostrophes are harmless; keep only commands inside -c.
          #
          # NAN-4980: tuning_atomic_state_integration (NAN-1768 tuning state
          # machine) and credential_delete_in_use_integration (NAN-4902) were
          # never listed, so both sat red unnoticed. The tuning suite shares the
          # deployment-wide AI tuning mode and the enabled DaC target set between
          # cases and must run single-threaded. The credential suite encrypts
          # credentials, so it needs an encryption key: a throwaway one is
          # generated per run and set for that one command only, so no other
          # suite runs with a key it did not ask for.
          #
          # NAN-5238: sso_trust_authority_integration covers administrator
          # authority for SSO provider create/enable/issuer/client-id changes
          # and the issuer-change unlink. It sets its own disposable encryption
          # key in-process and shares provider fixtures, so single-threaded.
          # NAN-5274: scim_provisioning_integration drives the SCIM 2.0 router
          # (Okta/Entra shapes, deprovisioning, grants, email trust, limits).
          # NAN-5767: hunts::hunt_schedule_slot_live_tests (hunt cadence writer
          # shared by PATCH and the schedule endpoint, plus the scheduler
          # cadence CAS race) are lib tests gated on NANO_TEST_DATABASE_URL and
          # applying the enterprise overlay themselves. They share hunt rows
          # with the scheduler poll, so single-threaded.
          # NAN-5776: hunts::recon::dismissal_live_tests (a deleted recon draft
          # frees its technique for POST /api/hunts/drafts; recon runs still do
          # not recreate it). Same gate and overlay as the cadence suite.
          # NAN-5988: the marketplace sync DB tests (marketplace::sync_service
          # db_tests and owner_db_tests) used to run unignored in the first
          # line, on a database nothing had migrated yet, so they failed on a
          # missing table the first time NAN-5967 let them run (and, past
          # that, on the NAN-4955 content-channel source they predate). They
          # are now ignored there, apply the open migrations themselves, read
          # a local git repository, and run on
          # their own line below, after the hunts suites, with the same
          # features as those so the lib test binary is reused, not rebuilt.
          # -e CI forwards the runner CI=true into the cargo container: those
          # tests skip on an unset database URL locally but FAIL when CI=true,
          # so a job that lost its database can never pass them empty.
          # NAN-5967: tests migrated to nanosiem-test-db never read DATABASE_URL;
          # they read NANOSIEM_TEST_DATABASE_URL (then the older names), so the
          # same throwaway URL is exported under the canonical name too. The
          # enterprise, nanosiem-api, nanosiem-api-lib and nano-connector suites
          # read only that name now; DATABASE_URL stays exported for any suite
          # not migrated yet.
          mapfile -t cargo_cache_args < <(bash scripts/ci/cargo-cache-docker-args.sh)
          if [ "${cargo_cache_args[0]:-}" = --env-file ]; then
            cargo_cache_args+=(-v nanosiem-pgit-sccache:/sccache)
          fi
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm --network host \
            -v "$PWD":/ws -w /ws \
            "${cargo_cache_args[@]}" \
            -e CREDENTIAL_SUITE_ENCRYPTION_KEY="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" \
            -v nanosiem-pgit-cargo-registry:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e CARGO_BUILD_JOBS \
            -e CI \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TEST_DATABASE_URL="$DATABASE_URL" \
            -e NANOSIEM_TEST_DATABASE_URL="$DATABASE_URL" \
            -e NANOSIEM_ALLOW_DESTRUCTIVE_TESTS=1 \
            -e NANOSIEM_REQUIRE_RELATION_INVENTORY=1 \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              cargo test --workspace --lib --tests --no-fail-fast -- --test-threads=1
              # NAN-5056: --workspace builds nanosiem-api WITHOUT its enterprise
              # feature, so the enterprise-only OpenAPI contract tests (hunts
              # recon surface, desktop wire spec) need their own run.
              cargo test -p nanosiem-api --features enterprise --lib openapi::tests
              # NAN-5734: meloD config poller fingerprint (enterprise-only module;
              # its DB tests skip unless NANOSIEM_TEST_DATABASE_URL is set).
              NANOSIEM_TEST_DATABASE_URL="$DATABASE_URL" cargo test -p nanosiem-api --features enterprise --lib state::melod::config_poller_tests
              NANO_TEST_DATABASE_URL="$DATABASE_URL" cargo test -p nanosiem-core --features enterprise --lib hunts::hunt_schedule_slot_live_tests -- --ignored --test-threads=1
              NANO_TEST_DATABASE_URL="$DATABASE_URL" cargo test -p nanosiem-core --features enterprise --lib hunts::recon::dismissal_live_tests -- --ignored --test-threads=1
              # NAN-5988: marketplace sync DB tests (NAN-4930 re-parse retry, NAN-4946 slug ownership).
              cargo test -p nanosiem-core --features enterprise --lib marketplace::sync_service -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test migration_seed_parity -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test api_key_rate_limit_integration -- --ignored
              cargo test -p nanosiem-core --test first_admin_claim_integration -- --ignored
              # NAN-5825: token refresh never queries demo.sessions where it does not exist.
              cargo test -p nanosiem-core --test demo_session_probe_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test entitlement_grant_ai_credits_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-api-lib --test grant_authority_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test source_scope_integration -- --ignored
              cargo test -p nanosiem-core --test saved_search_validation_integration -- --ignored
              cargo test -p nanosiem-core --test ip_allowlist_fail_closed_integration -- --ignored --test-threads=1
              NANOSIEM_ENCRYPTION_KEY="$CREDENTIAL_SUITE_ENCRYPTION_KEY" cargo test -p nanosiem-core --test login_lockout_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test webhook_delivery_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test detection_delete_quiesce_integration -- --ignored
              NANOSIEM_ALLOW_DEFAULT_KEYS=true cargo test -p nanosiem-core --test source_config_credential_retarget_integration -- --ignored --test-threads=1
              NANOSIEM_ALLOW_DEFAULT_KEYS=true cargo test -p nanosiem-core --test source_config_deployed_edit_requires_deploy_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test lookup_create_owns_physical_table_integration -- --ignored
              cargo test -p nanosiem-core --test log_source_deploy_jobs_integration -- --ignored --test-threads=1
              # NAN-5785 (sweep is table-wide: serial) and NAN-5760.
              cargo test -p nanosiem-core --test log_source_delete_resolves_health_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test siem_health_deleted_sources_integration -- --ignored --test-threads=1
              if command -v sccache >/dev/null; then sccache --show-stats || true; fi
              cargo test -p nanosiem-core --test security_audit_outbox_batch_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --test unassigned_deleted_sources_integration -- --ignored --test-threads=1
              NANOSIEM_ALLOW_DEFAULT_KEYS=true cargo test -p nanosiem-core --test fetch_source_without_config_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test custom_enrichment_catalog_slug_guard_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test soar_deleted_flow_run_name_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-core --features enterprise --test tuning_atomic_state_integration -- --ignored --test-threads=1
              NANOSIEM_ENCRYPTION_KEY="$CREDENTIAL_SUITE_ENCRYPTION_KEY" cargo test -p nanosiem-core --features enterprise --test credential_delete_in_use_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test notebook_tab_revocation_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test notebook_visibility_lifecycle_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test settings_integration -- --ignored
              cargo test -p nanosiem-enterprise --test playbook_acl_integration -- --ignored --test-threads=1
              # NAN-5786: playbook audit transitions (what the API audits).
              cargo test -p nanosiem-enterprise --test playbook_audit_transitions -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test case_stats_visibility_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test incident_confidence_integration -- --ignored
              cargo test -p nanosiem-enterprise --test f34_case_source_scoping_integration -- --ignored
              cargo test -p nanosiem-enterprise --test case_visibility_scope_integration -- --ignored --test-threads=1
              # NAN-5790: case delete names the removed case for its audit row.
              cargo test -p nanosiem-enterprise --test case_delete_audit_identity_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test case_entity_provenance_integration -- --ignored
              cargo test -p nanosiem-enterprise --test melod_parser_draft_jobs_integration -- --ignored --test-threads=1
              cargo test -p nanosiem-enterprise --test sso_trust_authority_integration -- --ignored --test-threads=1 &&
              cargo test -p nanosiem-enterprise --test scim_provisioning_integration -- --ignored --test-threads=1
            '

      - name: Stop Postgres
        if: always()
        run: docker stop "$PG_CONTAINER" || true

      - name: Reclaim workspace (NAN-773)
        if: always()
        # Defensive: if cargo wrote anything to /ws as root (e.g. Cargo.lock),
        # chown it back via a throwaway container so the next host-side workflow's
        # actions/checkout can clean the tree without EACCES.
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm -v "$PWD:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
