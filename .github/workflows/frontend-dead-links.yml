name: frontend dead-links gate

# Static gates for the "route renders wrong" bug class. Pure text analysis — no
# stack, no browser, no build, ~1s each. (Workflow name kept as-is so the
# required-check name does not move.)
#
# NAN-1934 — "no new dead internal links" gate. Catches the class of bug
# that shipped NAN-1933: an in-app/notification link whose target matches no
# React Router route, so it renders the 404 page. Pure text analysis — no stack,
# no browser, no build, ~1s. The Puppeteer crawler (tests/e2e/crawl-404.mjs) is
# the runtime complement and is NOT run here (it needs a live stack + auth).
#
# Fails only on links NOT already in tests/e2e/dead-links-baseline.json, so it's
# a ratchet: existing known-dead links are grandfathered, new ones are blocked.

on:
  pull_request:
    # NAN-5791: on a PR, runs only while it carries the optional `ready-to-merge`
    # opt-in label (jobs' `if:`); the heavy run is the push-to-main one below.
    # docs-internal/ci-runner-pools.md#ready-to-merge-label-nan-5791
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "nanosiem-web/src/**"
      - "nanosiem-web/tests/e2e/**"
      - "nanosiem-core/src/**"
      - "nanosiem-api/src/**"
      - "nanosiem-enterprise/src/**"
      - "nanosiem-search/src/**"
      - ".github/workflows/frontend-dead-links.yml"
  # Heavy suite on main after merges; same paths as the PR trigger.
  # docs-internal/ci-runner-pools.md#heavy-gates-on-main
  push:
    branches: [main]
    paths:
      - "nanosiem-web/src/**"
      - "nanosiem-web/tests/e2e/**"
      - "nanosiem-core/src/**"
      - "nanosiem-api/src/**"
      - "nanosiem-enterprise/src/**"
      - "nanosiem-search/src/**"
      - ".github/workflows/frontend-dead-links.yml"
  workflow_dispatch:

# Read-only token on every trigger: no run of this gate (PR, push to main,
# schedule, dispatch) can push, publish, sign or release.
permissions:
  contents: read

# NAN-5791: a labeled/unlabeled event for any other label gets its own group
# (its jobs skip), so it never cancels a real run. A push to main joins the
# `heavy-` group without cancel-in-progress: one run going plus at most one
# pending, the pending one replaced by the newest merge, so a burst of merges
# coalesces into two runs (docs-internal/ci-runner-pools.md#heavy-gates-on-main).
concurrency:
  group: ${{ github.event_name == 'push' && 'heavy-' || '' }}frontend-dead-links-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-to-merge' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  dead-links:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ready-to-merge')) }}
    # Self-hosted only (repo rule — never ubuntu-latest). No Docker, no build:
    # just Node reading source files.
    runs-on: [self-hosted, Linux, nano-pr] # any arch (NAN-5743)
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check for new dead internal links
        run: node nanosiem-web/tests/e2e/check-dead-links.mjs

      # NAN-2190 — lazyWithRetryNamed names its export with a STRING, so a
      # mismatch survives tsc and vite build and only throws when a user
      # navigates to the route. That is how /integrations shipped broken.
      - name: Check lazy route exports resolve
        run: node nanosiem-web/tests/e2e/check-lazy-route-exports.mjs
