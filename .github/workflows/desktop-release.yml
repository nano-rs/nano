name: nano Desktop release

# NAN-1937 — standalone build of the nano Desktop (Tauri) app for testers.
# Deliberately SEPARATE from build-and-push.yml (the ~1h SIEM image pipeline):
# this builds only the desktop app (frontend + one Rust binary) in minutes and
# never touches Docker / images. Tauri can't cross-compile, so each installer is
# built on its own native runner.
#
# Output: .dmg (macOS, Apple Silicon) + .msi/.exe (Windows x64) via tauri-action,
# uploaded to a DRAFT GitHub Release. Unsigned for now — testers click through the
# one-time OS warning (macOS: right-click > Open; Windows SmartScreen: More info >
# Run anyway). Add code-signing secrets later to drop the warning.
#
# Runner choice: a mac/windows bundle can't be produced on the repo's Linux
# runners. macOS now builds on the self-hosted `mac-studio` (NAN-2283); Windows
# is still GitHub-hosted until a self-hosted Windows runner exists.

on:
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create the draft release + upload installers

jobs:
  build:
    strategy:
      fail-fast: false
      # NAN-2283: self-hosted Apple Silicon instead of `macos-latest` (no 10x
      # billing multiplier); Windows is still GitHub-hosted (2x), no
      # self-hosted Windows runner exists yet.
      # NAN-5050: a main release builds on the release-pool Mac (its hook
      # admits main only); a branch build on the PR-pool Mac user, and only
      # once that runner exists (vars.NANO_PR_MACOS_POOL == 'true'; the
      # Windows leg posts a notice otherwise). Never the release Mac off main.
      matrix:
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"platform":["self-hosted", "macOS", "ARM64", "nano-release"], "rust_target":"aarch64-apple-darwin"}, {"platform":["windows-latest"], "rust_target":"x86_64-pc-windows-msvc"}]' || (vars.NANO_PR_MACOS_POOL == 'true' && '[{"platform":["self-hosted", "macOS", "ARM64", "nano-pr"], "rust_target":"aarch64-apple-darwin"}, {"platform":["windows-latest"], "rust_target":"x86_64-pc-windows-msvc"}]' || '[{"platform":["windows-latest"], "rust_target":"x86_64-pc-windows-msvc"}]')) }}
    runs-on: ${{ matrix.platform }} # runner-pool: matrix.platform lists above name their pool
    timeout-minutes: 45
    steps:
      - name: Runner pool notice
        if: matrix.rust_target == 'x86_64-pc-windows-msvc' && github.ref != 'refs/heads/main' && vars.NANO_PR_MACOS_POOL != 'true'
        run: echo "::notice title=macOS skipped::No macOS PR-pool runner yet (vars.NANO_PR_MACOS_POOL != 'true'); this branch build is Windows-only. See docs-internal/ci-runner-pools.md."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: nano-desktop/src-tauri

      # The desktop reuses source from nanosiem-web/src. At vite RUNTIME those
      # shared libs resolve to the desktop's own node_modules (vite.config
      # aliases), but the `tsc --noEmit` typecheck resolves the shared files'
      # imports (react, date-fns, @radix-ui/*) against nanosiem-web/node_modules —
      # so its deps must be installed too. Deps only: no web build, no SIEM build.
      - name: Install nanosiem-web deps (shared-module types)
        run: npm ci
        working-directory: nanosiem-web

      - name: Install desktop frontend deps
        run: npm ci
        working-directory: nano-desktop

      - name: Build + draft release (tauri-action)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: nano-desktop
          tagName: nano-desktop-v__VERSION__-b${{ github.run_number }}
          releaseName: nano Desktop v__VERSION__ (build ${{ github.run_number }})
          releaseBody: |
            Test build of the nano Desktop app (unsigned).
            - macOS: right-click the app and choose Open, or run `xattr -dr com.apple.quarantine /Applications/nano.app`.
            - Windows: on the SmartScreen prompt choose "More info" then "Run anyway".
            The app connects to a nano backend — point it at your tenant URL on first launch.
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
