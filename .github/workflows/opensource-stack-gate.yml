name: opensource stack gate

# NAN-1261 — cheap PR gate for the open-source quickstart stack DEFINITION.
# Validates docker-compose.opensource.yml + images.lock + install.sh + the
# config/vector bundle WITHOUT standing the stack up, so breakage like NAN-1260
# (vector rejecting a removed config field after a version bump) is caught on the
# PR, not after merge. The heavy full bring-up + ingestion smoke is a separate,
# dispatch-only gate (see enrichment-lane-gate.yml for that pattern).

on:
  pull_request:
    paths:
      - docker-compose.opensource.yml
      - docker-compose.siem-only.yml
      - images.lock
      - install.sh
      - scripts/lib/resource-sizing.sh
      - clickhouse/config.d/zzzz-nano-sizing.xml
      - clickhouse/users.d/zzzz-nano-sizing.xml
      - Dockerfile*
      - scripts/check-cargo-package-scoping.sh
      - config/vector/**
      - scripts/check-opensource-pins.sh
      - clickhouse/preflight/**
      - clickhouse/users.d/**
      - scripts/tests/clickhouse-default-user.live.sh
      - scripts/tests/test_install_clickhouse_default_preflight.py
      - nanosiem-web/**
      - tools/sync-to-nano-mirror.sh
      - tools/scan-mirror-secrets.sh
      - tools/tests/**
      - scripts/tests/install-edition.test.sh
      - scripts/tests/install-env-set-keys.test.sh
      - scripts/lib/generated-secrets.sh
      - scripts/tests/install-api-call.test.sh
      - scripts/tests/install-bind-address-probes.test.sh
      - scripts/tests/test_nano_upgrade_bind_address.py
      - scripts/tests/install-image-pull.test.sh
      - scripts/lib/data-mount.sh
      - scripts/tests/install-data-mount.test.sh
      - scripts/lib/image-pull.sh
      - scripts/tests/install-umask.test.sh
      - scripts/tests/install-umask.live.sh
      - scripts/tests/install-resource-sizing.test.sh
      - scripts/tests/resource-sizing.test.sh
      - scripts/tests/clickhouse-sizing-mount.test.sh
      - scripts/tests/fixtures/resource-sizing.snap
      - skills/nano-deploy/**
      - scripts/tests/nano_deploy_plan_support.py
      - scripts/tests/test_nano_deploy_plan*.py
      - scripts/tests/test_nano_deploy_customer_run.py
      - scripts/tests/test_nano_deploy_health_checks.py
      - scripts/tests/test_nano_deploy_pg_preflight.py
      - scripts/tests/test_nano_deploy_k8s_health.py
      - scripts/tests/fixtures/nano-deploy-health/**
      - scripts/tests/test_otlp_edge_content_type.py
      - scripts/tests/test_otlp_edge_auth_unavailable.py
      - config/nginx/nginx.opensource*.conf
      - deploy/compose/config/nginx.ingest.conf.template
      - deploy/helm/nano/templates/ingest/**
      - scripts/tests/test_nano_deploy_fetch_bundle.py
      - scripts/tests/test_valkey_ha_entrypoint.py
      - scripts/nano-support-bundle
      - scripts/nano-cluster-health
      - scripts/tests/test_nano_support_bundle.py
      - scripts/tests/fixtures/nano-deploy-plan/**
      - scripts/check-opencore-web-build.sh
      - docker-compose.yml
      - docker-compose.tls.yml
      - config/nginx/**
      - deploy/compose/**
      - deploy/helm/nano/templates/edge/**
      - ludus/roles/nanosiem_stack/files/nginx/**
      - scripts/tests/compose-published-ports.sh
      - scripts/tests/fixtures/compose-published-ports.allow
      - scripts/tests/nginx-internal-404.sh
      # Open-core relation inventory (relation-inventory job): any Rust or
      # schema change can make open code name a relation the open schema lacks.
      - "**/*.rs"
      - migrations/postgres/**
      - migrations/postgres-open/**
      - nanosiem-core/src/db/migrations.rs
      - nanosiem-core/tests/open_core_relation_inventory.rs
      - "**/Cargo.toml"
      - .github/workflows/opensource-stack-gate.yml
  workflow_dispatch:

concurrency:
  group: opensource-stack-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Self-hosted only (repo rule — never ubuntu-latest). Needs docker +
    # docker compose v2 on the runner (same as enrichment-lane-gate).
    runs-on: [self-hosted, Linux, X64, nano-pr]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck install.sh + gate script (best-effort)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x install.sh scripts/lib/resource-sizing.sh scripts/check-opensource-pins.sh
          else
            echo "shellcheck not installed on runner — skipping."
          fi

      # NAN-2363: an unscoped `cargo build` in the Dockerfile selects the whole
      # workspace and unifies features, so nanosiem-enterprise turned on
      # nanosiem-core/enterprise for OPEN images too. Both editions still
      # compile, so only a structural check catches it.
      - name: Cargo package scoping (open-edition feature leak)
        run: bash scripts/check-cargo-package-scoping.sh

      - name: Validate open-source stack definition
        run: bash scripts/check-opensource-pins.sh

      # NAN-4968: install.sh edition/release resolution fails closed, and the
      # mirror credential scan catches multiline PEM private keys. The install
      # test lives under scripts/, which the public mirror strips.
      - name: install.sh edition and release scenarios
        run: |
          if [ -f scripts/tests/install-edition.test.sh ]; then
            bash scripts/tests/install-edition.test.sh
            bash scripts/tests/install-env-set-keys.test.sh
          else
            echo "install-edition test not in this tree (public mirror); skipping"
          fi

      # NAN-5124: installer -> edge calls succeed only on a 2xx (a TLS-overlay
      # 301 used to read as "Admin user created").
      - name: install.sh edge calls are 2xx-only
        run: |
          if [ -f scripts/tests/install-api-call.test.sh ]; then
            bash scripts/tests/install-api-call.test.sh
          else
            echo "install api-call test not in this tree (public mirror); skipping"
          fi

      # A private inventory bind_address: install.sh's health/readiness probes
      # use the address the edges are published on, not localhost; nano-upgrade
      # post-verify probes stay inside the edge containers.
      - name: install.sh probes honour bind_address
        run: |
          if [ -f scripts/tests/install-bind-address-probes.test.sh ]; then
            bash scripts/tests/install-bind-address-probes.test.sh
            python3 -m unittest scripts/tests/test_nano_upgrade_bind_address.py
          else
            echo "install bind-address test not in this tree (public mirror); skipping"
          fi

      # NAN-5197: present images are never pulled; missing ones are bounded,
      # retried, and fail naming the image and registry.
      - name: install.sh bounded image pull
        run: |
          if [ -f scripts/tests/install-image-pull.test.sh ]; then
            bash scripts/tests/install-image-pull.test.sh
          else
            echo "install-image-pull test not in this tree (public mirror); skipping"
          fi

      # NAN-5251: never install onto Docker's root disk while the data disk
      # that should hold DockerRootDir is unmounted.
      - name: install.sh data-disk guard
        run: |
          if [ -f scripts/tests/install-data-mount.test.sh ]; then
            bash scripts/tests/install-data-mount.test.sh
          else
            echo "install-data-mount test not in this tree (public mirror); skipping"
          fi

      # NAN-5006: prove the documented streamed installer cannot lose its
      # remaining source to Compose stdin, while retaining hostile-umask mode
      # coverage. DinD isolates fixed compose names from every runner stack.
      - name: install.sh streamed hostile-umask fresh and resume scenarios
        run: |
          if [ -f scripts/tests/install-umask.live.sh ]; then
            bash scripts/tests/install-umask.live.sh
          else
            echo "install-umask live test not in this tree (public mirror); skipping"
          fi

      - name: Host resource sizing scenarios
        run: |
          if [ -f scripts/tests/resource-sizing.test.sh ]; then
            bash scripts/tests/resource-sizing.test.sh
            bash scripts/tests/install-resource-sizing.test.sh
            bash scripts/tests/clickhouse-sizing-mount.test.sh
          else
            echo "resource-sizing tests not in this tree (public mirror); skipping"
          fi

      # NAN-5216: the nano-deploy cloud planner. Its inventories must pass the
      # renderer's validation, its overrides must pass resource-sizing.sh, and
      # its vendored port matrix must equal the renderer's, so a change to
      # deploy/compose or the sizing helper re-runs this. Offline, no cloud calls.
      - name: nano-deploy cloud planner
        run: |
          if [ -f scripts/tests/test_nano_deploy_plan.py ]; then
            python3 -I scripts/tests/test_nano_deploy_plan.py -v
            python3 -I scripts/tests/test_nano_deploy_plan_ha.py -v
            python3 -I scripts/tests/test_nano_deploy_plan_inventory.py -v
            python3 -I scripts/tests/test_nano_deploy_customer_run.py -v
            python3 -I scripts/tests/test_nano_deploy_health_checks.py -v
            python3 -I scripts/tests/test_nano_deploy_pg_preflight.py -v
            python3 -I scripts/tests/test_nano_deploy_k8s_health.py -v
            python3 -I scripts/tests/test_otlp_edge_content_type.py -v
            python3 -I scripts/tests/test_otlp_edge_auth_unavailable.py -v
            python3 -I scripts/tests/test_nano_deploy_fetch_bundle.py -v
          else
            echo "nano-deploy planner tests not in this tree (public mirror); skipping"
          fi

      # NAN-5253: support-bundle redaction, packaging and stub-docker fixture runs.
      - name: nano support-bundle
        run: |
          if [ -f scripts/tests/test_nano_support_bundle.py ]; then
            python3 -I scripts/tests/test_nano_support_bundle.py -v
          else
            echo "support-bundle test not in this tree (public mirror); skipping"
          fi

      # NAN-5248: the Valkey HA entrypoint acts only on a Sentinel majority
      # (fake valkey-cli; no containers).
      - name: Valkey HA entrypoint
        run: |
          if [ -f scripts/tests/test_valkey_ha_entrypoint.py ]; then
            python3 -I scripts/tests/test_valkey_ha_entrypoint.py -v
          else
            echo "Valkey HA entrypoint test not in this tree (public mirror); skipping"
          fi

      # Security review 2026-11-08 (NAN-5008/NAN-5038): the full published-port
      # set of every shipped stack matches the reviewed allowlist, and the dev
      # stack is loopback-only. Render only; nothing is started.
      - name: Compose published-port allowlist
        run: |
          if [ -f scripts/tests/compose-published-ports.sh ]; then
            bash scripts/tests/compose-published-ports.sh
          else
            echo "published-port test not in this tree (public mirror); skipping"
          fi

      # NAN-5013/NAN-5042: every nginx edge 404s /api/internal/*, proven live
      # against the open-core edge config.
      - name: nginx edges refuse /api/internal
        run: |
          if [ -f scripts/tests/nginx-internal-404.sh ]; then
            bash scripts/tests/nginx-internal-404.sh
          else
            echo "nginx /api/internal test not in this tree (public mirror); skipping"
          fi

      - name: Mirror credential scan tests
        run: bash tools/tests/scan-mirror-secrets.test.sh

      # NAN-4906: the ClickHouse pre-start preflight (AVX2 + obsolete s3-disk
      # elements) gates every compose stack's server start.
      - name: ClickHouse preflight script tests
        run: sh clickhouse/preflight/test-clickhouse-preflight.sh

      # Security review 2026-11-08 (NAN-5011): the passwordless `default` user
      # is container-local on the pinned image with the shipped users.d, and
      # install.sh's upgrade pre-flight reports remote `default` clients.
      - name: ClickHouse default user is container-local
        run: |
          if [ -f scripts/tests/clickhouse-default-user.live.sh ]; then
            bash scripts/tests/clickhouse-default-user.live.sh
            python3 -I scripts/tests/test_install_clickhouse_default_preflight.py
          else
            echo "ClickHouse default-user tests not in this tree (public mirror); skipping"
          fi

      # NAN-4902: the open web edition must build from the STRIPPED tree. In
      # the private tree `@/enterprise/*` still resolves to the real sources
      # (tsconfig falls back to the stubs), so drifted stubs only break the
      # public mirror. Run in a one-off container so Node 22 and rsync are
      # available even when the bare self-hosted runner has drifted. The
      # checkout is mounted read-only; npm writes only to the container's
      # per-run stripped tree and cannot leave root-owned workspace files.
      - name: Open-core web build from the stripped tree
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" -w /workspace \
            node:22-bookworm \
            bash -euo pipefail -c '
              if ! command -v rsync >/dev/null 2>&1; then
                apt-get update
                apt-get install -y --no-install-recommends rsync
              fi
              bash scripts/check-opencore-web-build.sh
            '

  relation-inventory:
    # A compile-only mirror check cannot catch SQL that names a table omitted
    # from the fresh-open migration snapshot. Run the inventory against both
    # the exact stripped source tree and an isolated PostgreSQL 18 instance.
    runs-on: [self-hosted, Linux, X64, nano-pr]
    timeout-minutes: 45
    env:
      PG_CONTAINER: opencore-relations-${{ github.run_id }}
      RUST_IMAGE: rust:1.95-bookworm
    steps:
      - name: Reclaim workspace before checkout (NAN-773)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" .

      - name: Checkout
        uses: actions/checkout@v4

      - name: Start throwaway PostgreSQL 18
        run: |
          docker run -d --rm --name "$PG_CONTAINER" \
            -e POSTGRES_USER=nanosiem \
            -e POSTGRES_PASSWORD=nanosiem \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1::5432 \
            postgres:18
          host_port="$(docker port "$PG_CONTAINER" 5432/tcp | head -1 | sed 's/.*://')"
          echo "TEST_DATABASE_URL=postgres://nanosiem:nanosiem@localhost:${host_port}/postgres" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U nanosiem -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs "$PG_CONTAINER" --tail 50 || true
          exit 1

      - name: Fresh stripped open-core relation inventory
        run: |
          docker run --rm --network host \
            -v "$PWD:/source:ro" \
            -v nanosiem-opencore-relations-cargo-registry:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e NANOSIEM_ALLOW_DESTRUCTIVE_TESTS=1 \
            -e NANOSIEM_REQUIRE_RELATION_INVENTORY=1 \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends rsync
              # The private tree is stripped first; the public mirror deletes the
              # strip script and IS the stripped tree, so it is copied as-is.
              if [ -f /source/tools/sync-to-nano-mirror.sh ]; then
                /source/tools/sync-to-nano-mirror.sh /source /tmp/open-core
              else
                rsync -a --exclude .git --exclude target /source/ /tmp/open-core/
              fi
              cd /tmp/open-core
              cargo test -p nanosiem-core --test open_core_relation_inventory -- --nocapture
            '

      - name: Stop PostgreSQL
        if: always()
        run: docker stop "$PG_CONTAINER" || true

      - name: Reclaim workspace (NAN-773)
        if: always()
        run: |
          docker run --rm -v "$PWD:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
