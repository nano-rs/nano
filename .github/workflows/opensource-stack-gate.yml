  workflow_dispatch:

# Read-only token on every trigger: no run of this gate (PR, push to main,
# schedule, dispatch) can push, publish, sign or release.
permissions:
  contents: read

# NAN-5791: a labeled/unlabeled event for any other label gets its own group
# (its jobs skip), so it never cancels a real run. A push to main joins the
# `heavy-` group without cancel-in-progress: one run going plus at most one
# pending, the pending one replaced by the newest merge, so a burst of merges
# coalesces into two runs (docs-internal/ci-runner-pools.md#heavy-gates-on-main).
concurrency:
  group: ${{ github.event_name == 'push' && 'heavy-' || '' }}opensource-stack-gate-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ready-to-merge' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ready-to-merge')) }}
    # Self-hosted only (repo rule — never ubuntu-latest). Needs docker +
    # docker compose v2 on the runner (same as enrichment-lane-gate).
    runs-on: [self-hosted, Linux, nano-pr] # any arch (NAN-5743)
    # NAN-5840: 30 was ~28 min of steps with no headroom; the NAN-5822 sizing
    # sweep pushed every main run over it. Trim the slow steps, then lower.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck install.sh + gate script (best-effort)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x install.sh scripts/lib/resource-sizing.sh scripts/check-opensource-pins.sh
            shellcheck -S warning scripts/lib/vector-native-pki.sh
          else
            echo "shellcheck not installed on runner — skipping."
          fi

      # NAN-2363: an unscoped `cargo build` in the Dockerfile selects the whole
      # workspace and unifies features, so nanosiem-enterprise turned on
      # nanosiem-core/enterprise for OPEN images too. Both editions still
      # compile, so only a structural check catches it.
      - name: Cargo package scoping (open-edition feature leak)
        run: bash scripts/check-cargo-package-scoping.sh

      - name: Validate open-source stack definition
        run: bash scripts/check-opensource-pins.sh

      # NAN-4968: install.sh edition/release resolution fails closed, and the
      # mirror credential scan catches multiline PEM private keys. The install
      # test lives under scripts/, which the public mirror strips.
      - name: install.sh edition and release scenarios
        run: |
          if [ -f scripts/tests/install-edition.test.sh ]; then
            bash scripts/tests/install-edition.test.sh
            bash scripts/tests/install-env-set-keys.test.sh
            bash scripts/tests/install-ingest-ack-durability.test.sh
          else
            echo "install-edition test not in this tree (public mirror); skipping"
          fi

      # NAN-5124: installer -> edge calls succeed only on a 2xx (a TLS-overlay
      # 301 used to read as "Admin user created").
      - name: install.sh edge calls are 2xx-only
        run: |
          if [ -f scripts/tests/install-api-call.test.sh ]; then
            bash scripts/tests/install-api-call.test.sh
          else
            echo "install api-call test not in this tree (public mirror); skipping"
          fi

      # A private inventory bind_address: install.sh's health/readiness probes
      # use the address the edges are published on, not localhost; nano-upgrade
      # post-verify probes stay inside the edge containers.
      - name: install.sh probes honour bind_address
        run: |
          if [ -f scripts/tests/install-bind-address-probes.test.sh ]; then
            bash scripts/tests/install-bind-address-probes.test.sh
            python3 -m unittest scripts/tests/test_nano_upgrade_bind_address.py
          else
            echo "install bind-address test not in this tree (public mirror); skipping"
          fi

      # NAN-5197: present images are never pulled; missing ones are bounded,
      # retried, and fail naming the image and registry.
      - name: install.sh bounded image pull
        run: |
          if [ -f scripts/tests/install-image-pull.test.sh ]; then
            bash scripts/tests/install-image-pull.test.sh
          else
            echo "install-image-pull test not in this tree (public mirror); skipping"
          fi

      # NAN-5505: enterprise installs log in to the private registry with the
      # license-issued pull credential and default to the customer lock.
      - name: install.sh registry login
        run: |
          if [ -f scripts/tests/install-registry-login.test.sh ]; then
            bash scripts/tests/install-registry-login.test.sh
          else
            echo "install-registry-login test not in this tree (public mirror); skipping"
          fi

      # NAN-5515: Vector native :6000 is mutual TLS only (CA, listener and
      # client certificates; compose bind; installer summary).
      - name: Vector-native mutual TLS
        run: |
          if [ -f scripts/tests/vector-native-mtls.test.sh ]; then
            bash scripts/tests/vector-native-mtls.test.sh
            python3 -I scripts/tests/test_nano_upgrade_vector_native_pki.py
          else
            echo "vector-native-mtls test not in this tree (public mirror); skipping"
          fi

      # NAN-5515 (M5): the TLS-layer proof with the pinned Vector image on this
      # Linux runner: valid sender delivers; no cert, plaintext, foreign
      # anchor, the listener cert as a client and a revoked sender are
      # refused; revocation leaves the other senders untouched; a sender
      # anchor cannot act as a listener; missing/unreadable files lock :6000.
      - name: Vector-native mutual TLS, live (Docker)
        run: |
          if [ -f scripts/tests/vector-native-mtls.live.sh ]; then
            TMPDIR="$RUNNER_TEMP" bash scripts/tests/vector-native-mtls.live.sh
          else
            echo "vector-native-mtls live test not in this tree (public mirror); skipping"
          fi

      # NAN-5874: the pinned Vector keeps every acknowledged HEC and HTTP event
      # across a hot reload that re-points an unchanged input (the v2.0.35
      # upgrade's _source_tz insert, a parser extension toggle) and across an
      # ordinary VRL publish. 0.61.0-nano.13 lost every event sent during such
      # a reload's build while answering 200 / ackId true.
      - name: Vector hot reload keeps acknowledged events, live (Docker)
        run: |
          if [ -f scripts/tests/reload-acked-loss.live.sh ]; then
            TMPDIR="$RUNNER_TEMP" bash scripts/tests/reload-acked-loss.live.sh
          else
            echo "reload-acked-loss live test not in this tree (public mirror); skipping"
          fi

      # NAN-5509: installer errors, prerequisites and recovery hints (TLS
      # certificate preflight, python3/git, docker permissions, log hint,
      # host-minimum re-run commands, license login on upgrade, ports).
      - name: install.sh errors and prerequisites
        run: |
          if [ -f scripts/tests/install-errors-prereqs.test.sh ]; then
            bash scripts/tests/install-errors-prereqs.test.sh
            python3 -I scripts/tests/test_nano_upgrade_license_registry_login.py
          else
            echo "install-errors-prereqs test not in this tree (public mirror); skipping"
          fi

      - name: install.sh re-run and upgrade regressions
        run: |
          if [ -f scripts/tests/install-rerun-upgrade.test.sh ]; then
            bash scripts/tests/install-rerun-upgrade.test.sh
          else
            echo "install-rerun-upgrade test not in this tree (public mirror); skipping"
          fi

      - name: legacy 0.1.x upgrade guard and OCSF backfill tools (NAN-5559)
        run: |
          if [ -f scripts/tests/install-legacy-upgrade.test.sh ]; then
            bash scripts/tests/install-legacy-upgrade.test.sh
            bash scripts/tests/install-legacy-vector-native.test.sh
            bash scripts/tests/install-senders-paused.test.sh
            bash scripts/tests/nano-ocsf-legacy.test.sh
            python3 -I scripts/tests/test_ocsf_legacy_backfill.py
          else
            echo "legacy upgrade tests not in this tree (public mirror); skipping"
          fi

      - name: v2.0.30 audit regressions (overlays, TLS preflight, :6000, backup)
        run: |
          if [ -f scripts/tests/install-v2030-audit.test.sh ]; then
            bash scripts/tests/install-v2030-audit.test.sh
            python3 -I scripts/tests/test_nano_upgrade_v2030_audit.py
          else
            echo "install-v2030-audit test not in this tree (public mirror); skipping"
          fi

      # NAN-5251: never install onto Docker's root disk while the data disk
      # that should hold DockerRootDir is unmounted.
      - name: install.sh data-disk guard
        run: |
          if [ -f scripts/tests/install-data-mount.test.sh ]; then
            bash scripts/tests/install-data-mount.test.sh
          else
            echo "install-data-mount test not in this tree (public mirror); skipping"
          fi

      # NAN-5006: prove the documented streamed installer cannot lose its
      # remaining source to Compose stdin, while retaining hostile-umask mode
      # coverage. DinD isolates fixed compose names from every runner stack.
      - name: install.sh streamed hostile-umask fresh and resume scenarios
        run: |
          if [ -f scripts/tests/install-umask.live.sh ]; then
            bash scripts/tests/install-umask.live.sh
          else
            echo "install-umask live test not in this tree (public mirror); skipping"
          fi

      # NAN-5556: the read-only upgrade readiness check and content export
      # (secret stripping, self-scan, layout, backfill estimate, export format),
      # and `export --encrypt` with the support-side decrypt helper.
      - name: Upgrade readiness check unit tests
        run: |
          if [ -f scripts/tests/test_nano_upgrade_readiness.py ]; then
            python3 -I scripts/tests/test_nano_upgrade_readiness.py -v
            python3 -I scripts/tests/test_nano_upgrade_readiness_ingest.py -v
            python3 -I scripts/tests/test_nano_upgrade_readiness_encrypt.py -v
            python3 -I scripts/tests/test_nano_upgrade_readiness_url_scrub.py -v
          else
            echo "upgrade readiness tests not in this tree (public mirror); skipping"
          fi

      # NAN-5494: ClickHouse mounts the assembled config.d / users.d only and
      # refuses to start without them; no package path is a live mount point.
      - name: ClickHouse config directories (assemble, fail closed, re-extract guard)
        run: |
          if [ -f scripts/tests/test_compose_mount_reextract_guard.py ]; then
            python3 -I scripts/tests/test_clickhouse_config_dirs.py -v
            python3 -I scripts/tests/test_compose_mount_reextract_guard.py -v
          else
            # Public mirror: assemble the checkout's trees the way install.sh does.
            python3 -I scripts/lib/clickhouse_config_dirs.py --root . --env-file /dev/null \
              --config-output "$RUNNER_TEMP/ch/config.d" --users-output "$RUNNER_TEMP/ch/users.d"
          fi

      - name: Host resource sizing scenarios
        run: |
          if [ -f scripts/tests/resource-sizing.test.sh ]; then
            bash scripts/tests/resource-sizing.test.sh
            bash scripts/tests/resource-sizing-planned-volume.test.sh
            bash scripts/tests/retention-sizing.test.sh
            bash scripts/tests/resource-sizing-evidence-pack.test.sh
            bash scripts/tests/install-resource-sizing.test.sh
            bash scripts/tests/clickhouse-sizing-mount.test.sh
          else
            echo "resource-sizing tests not in this tree (public mirror); skipping"
          fi

      # NAN-5216: the nano-deploy cloud planner. Its inventories must pass the
      # renderer's validation, its overrides must pass resource-sizing.sh, and
      # its vendored port matrix must equal the renderer's, so a change to
      # deploy/compose or the sizing helper re-runs this. Offline, no cloud calls.
      - name: nano-deploy cloud planner
        run: |
          if [ -f scripts/tests/test_nano_deploy_plan.py ]; then
            python3 -I scripts/tests/test_nano_deploy_plan.py -v
            python3 -I scripts/tests/test_nano_deploy_plan_ha.py -v
            python3 -I scripts/tests/test_nano_deploy_plan_inventory.py -v
            python3 -I scripts/tests/test_nano_deploy_customer_run.py -v
            python3 -I scripts/tests/test_nano_deploy_health_checks.py -v
            python3 -I scripts/tests/test_smoke_otlp.py -v
            python3 -I scripts/tests/test_nano_deploy_pg_preflight.py -v
            python3 -I scripts/tests/test_nano_deploy_k8s_health.py -v
            python3 -I scripts/tests/test_otlp_edge_content_type.py -v
            python3 -I scripts/tests/test_otlp_edge_auth_unavailable.py -v
            python3 -I scripts/tests/test_nano_deploy_fetch_bundle.py -v
          else
            echo "nano-deploy planner tests not in this tree (public mirror); skipping"
          fi

      # NAN-5253: support-bundle redaction, packaging and stub-docker fixture runs.
      - name: nano support-bundle
        run: |
          if [ -f scripts/tests/test_nano_support_bundle.py ]; then
            python3 -I scripts/tests/test_nano_support_bundle.py -v
          else
            echo "support-bundle test not in this tree (public mirror); skipping"
          fi

      # NAN-5248: the Valkey HA entrypoint acts only on a Sentinel majority
      # (fake valkey-cli; no containers).
      - name: Valkey HA entrypoint
        run: |
          if [ -f scripts/tests/test_valkey_ha_entrypoint.py ]; then
            python3 -I scripts/tests/test_valkey_ha_entrypoint.py -v
          else
            echo "Valkey HA entrypoint test not in this tree (public mirror); skipping"
          fi

      # NAN-5241: the postgres-ha member moves etcd leadership off the
      # PostgreSQL primary's host only when it leads both (no containers).
      - name: etcd leader steer
        run: |
          if [ -f scripts/tests/test_etcd_leader_steer.py ]; then
            python3 -I scripts/tests/test_etcd_leader_steer.py -v
          else
            echo "etcd leader steer test not in this tree (public mirror); skipping"
          fi

      # Security review 2026-11-08 (NAN-5008/NAN-5038): the full published-port
      # set of every shipped stack matches the reviewed allowlist, and the dev
      # stack is loopback-only. Render only; nothing is started.
      - name: Compose published-port allowlist
        run: |
          if [ -f scripts/tests/compose-published-ports.sh ]; then
            bash scripts/tests/compose-published-ports.sh
          else
            echo "published-port test not in this tree (public mirror); skipping"
          fi

      # NAN-5013/NAN-5042: every nginx edge 404s /api/internal/*, proven live
      # against the open-core edge config.
      - name: nginx edges refuse /api/internal
        run: |
          if [ -f scripts/tests/nginx-internal-404.sh ]; then
            bash scripts/tests/nginx-internal-404.sh
          else
            echo "nginx /api/internal test not in this tree (public mirror); skipping"
          fi

      # NAN-5645: no shipped nginx edge turns on HTTP/2 or HTTP/3 while the
      # pinned nginx is older than 1.31.9 (CVE-2026-123007 and friends).
      - name: nginx edges keep HTTP/2 and HTTP/3 off
        run: |
          if [ -f scripts/tests/nginx-no-http2.test.sh ]; then
            bash scripts/tests/nginx-no-http2.test.sh
          else
            echo "nginx HTTP/2 guard not in this tree (public mirror); skipping"
          fi

      # NAN-5397: the edge routes /health, /health/detailed, /ready and /livez
      # to nano-api with the query string (plain and TLS), and an upgrade's
      # nginx config is live after the installer sequence.
      - name: nginx edge health routes and upgraded config
        run: |
          if [ -f scripts/tests/nginx-edge-health.test.sh ]; then
            bash scripts/tests/nginx-edge-health.test.sh
            bash scripts/tests/compose-config-refresh.test.sh
            bash scripts/tests/compose-legacy-overlay-nginx.test.sh
            python3 -I scripts/tests/test_compose_stale_mounts.py
          else
            echo "edge health/config refresh tests not in this tree (public mirror); skipping"
          fi

      - name: Mirror credential scan tests
        run: bash tools/tests/scan-mirror-secrets.test.sh

      # NAN-4906: the ClickHouse pre-start preflight (AVX2 + obsolete s3-disk
      # elements) gates every compose stack's server start.
      - name: ClickHouse preflight script tests
        run: sh clickhouse/preflight/test-clickhouse-preflight.sh

      # Security review 2026-11-08 (NAN-5011): the passwordless `default` user
      # is container-local on the pinned image with the shipped users.d, and
      # install.sh's upgrade pre-flight reports remote `default` clients.
      - name: ClickHouse default user is container-local
        run: |
          if [ -f scripts/tests/clickhouse-default-user.live.sh ]; then
            bash scripts/tests/clickhouse-default-user.live.sh
            python3 -I scripts/tests/test_install_clickhouse_default_preflight.py
            python3 -I scripts/tests/test_install_compose_up_hint.py
          else
            echo "ClickHouse default-user tests not in this tree (public mirror); skipping"
          fi

      # NAN-5281: enterprise-only Rust modules are compiled out of the open
      # edition by `#[cfg(feature = "enterprise")]`, but their SOURCE shipped
      # in the public mirror unless the strip list also deleted them (hunts,
      # playbooks, license, SSO, tuning engine all leaked). The strip script
      # now runs tools/check-mirror-enterprise-strip.py, which derives the
      # gated module set from the code and fails if any of it survives, so a
      # new gated module fails this PR instead of reaching nano-rs/nano.
      - name: Mirror strip guard (no enterprise-only source in open core)
        run: |
          # NAN-5733: nano-ci labels let the runner pre-job hook remove this container
          # if the job is cancelled (scripts/ci/runner-pre-job.sh).
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm \
            -v "$PWD:/workspace:ro" -w /workspace \
            python:3.12-slim-bookworm \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends rsync >/dev/null
              bash tools/tests/check-mirror-enterprise-strip.test.sh
              bash tools/sync-to-nano-mirror.sh /workspace "$(mktemp -d)/tree"
            '

      # NAN-4902: the open web edition must build from the STRIPPED tree. In
      # the private tree `@/enterprise/*` still resolves to the real sources
      # (tsconfig falls back to the stubs), so drifted stubs only break the
      # public mirror. Run in a one-off container so Node 22 and rsync are
      # available even when the bare self-hosted runner has drifted. The
      # checkout is mounted read-only; npm writes only to the container's
      # per-run stripped tree and cannot leave root-owned workspace files.
      - name: Open-core web build from the stripped tree
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm \
            -v "$PWD:/workspace:ro" -w /workspace \
            node:22.23.5-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb \
            bash -euo pipefail -c '
              if ! command -v rsync >/dev/null 2>&1; then
                apt-get update
                apt-get install -y --no-install-recommends rsync
              fi
              bash scripts/check-opencore-web-build.sh
            '

  relation-inventory:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-to-merge') && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ready-to-merge')) }}
    # A compile-only mirror check cannot catch SQL that names a table omitted
    # from the fresh-open migration snapshot. Run the inventory against both
    # the exact stripped source tree and an isolated PostgreSQL 18 instance.
    runs-on: [self-hosted, Linux, nano-pr] # any arch (NAN-5743)
    timeout-minutes: 45
    env:
      PG_CONTAINER: opencore-relations-${{ github.run_id }}
      RUST_IMAGE: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
    steps:
      - name: Reclaim workspace before checkout (NAN-773)
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm -v "$GITHUB_WORKSPACE:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" .

      - name: Checkout
        uses: actions/checkout@v4

      - name: Start throwaway PostgreSQL 18
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            -d --rm --name "$PG_CONTAINER" \
            -e POSTGRES_USER=nanosiem \
            -e POSTGRES_PASSWORD=nanosiem \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1::5432 \
            postgres:18
          host_port="$(docker port "$PG_CONTAINER" 5432/tcp | head -1 | sed 's/.*://')"
          echo "TEST_DATABASE_URL=postgres://nanosiem:nanosiem@localhost:${host_port}/postgres" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U nanosiem -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs "$PG_CONTAINER" --tail 50 || true
          exit 1

      - name: Fresh stripped open-core relation inventory
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm --network host \
            -v "$PWD:/source:ro" \
            -v nanosiem-opencore-relations-cargo-registry:/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e CARGO_BUILD_JOBS \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            -e NANOSIEM_ALLOW_DESTRUCTIVE_TESTS=1 \
            -e NANOSIEM_REQUIRE_RELATION_INVENTORY=1 \
            "$RUST_IMAGE" \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends rsync
              # The private tree is stripped first; the public mirror deletes the
              # strip script and IS the stripped tree, so it is copied as-is.
              if [ -f /source/tools/sync-to-nano-mirror.sh ]; then
                /source/tools/sync-to-nano-mirror.sh /source /tmp/open-core
              else
                rsync -a --exclude .git --exclude target /source/ /tmp/open-core/
              fi
              cd /tmp/open-core
              cargo test -p nanosiem-core --test open_core_relation_inventory -- --nocapture
            '

      - name: Stop PostgreSQL
        if: always()
        run: docker stop "$PG_CONTAINER" || true

      - name: Reclaim workspace (NAN-773)
        if: always()
        run: |
          docker run \
            --label nano-ci=1 --label "nano-ci.repo=$GITHUB_REPOSITORY" --label "nano-ci.runner=$RUNNER_NAME" \
            --label "nano-ci.run_id=$GITHUB_RUN_ID" --label "nano-ci.run_attempt=$GITHUB_RUN_ATTEMPT" --label "nano-ci.job=$GITHUB_JOB" \
            --rm -v "$PWD:/ws" -w /ws alpine \
            chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
