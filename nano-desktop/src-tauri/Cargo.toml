[package]
name = "nano-desktop"
version = "0.1.0"
description = "nano — native SIEM client"
authors = ["NanoSIEM Team"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

# Deliberately its own workspace: the root nanosiem workspace lists its members
# explicitly, and pulling the wry/webkit dependency tree into the shared lockfile
# would slow every backend `cargo build` for no benefit.
[workspace]

[lib]
name = "nano_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# Only for synthesizing an RFC3339 "now" to seed the alert-stream cursor (so the
# tray watches from the present instead of replaying every alert ever). Minimal
# feature set — no serde, no wasm.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# native-tls (Security.framework on macOS) so an internal CA already trusted in
# the user's keychain works without extra configuration — common on-prem.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "stream"] }
keyring = { version = "3", features = ["apple-native"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "macros"] }
futures-util = { version = "0.3", default-features = false }
url = "2"
thiserror = "2"
portable-pty = "0.9.0"
base64 = "0.22.1"
robius-authentication = "0.1.1"

# Quick Search "capture the selection": post ⌘C to the frontmost app
# (core-graphics, version matched to the one already in the tree), read and
# restore the clipboard (arboard, non-destructive), and request the Accessibility
# permission that synthesizing keystrokes requires.
core-graphics = "0.25"
arboard = "3"
macos-accessibility-client = "0.0.1"

# The macOS Services entry ("Search in nano" on any selection, anywhere). Needs a
# real Objective-C class registered as NSApp's services provider — versions match
# the objc2 tree tauri/wry already pull in, so this adds no second copy.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
